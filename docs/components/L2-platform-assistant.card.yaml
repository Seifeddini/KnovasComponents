card: 2
id: L2-PLATFORM-ASSISTANT
name: Knovas Assistent
kind: code
owner: ROLE-ENGINE-OWNER
status: planned
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/assistant
- KnovasPlatform/components/docbridge_integration/src/identity/chats.py
- KnovasPlatform/components/docbridge_integration/src/identity/migrations/0026_assistant_chats.sql
- KnovasPlatform/components/docbridge_integration/src/web_interface/assistant_routes.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/ask.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/ask.css
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/ask.js
purpose: The one company assistant of the Platform's Workspace, which answers a signed-in person's question only from the passages that person's own search returns, shows only statements whose references it could check, and keeps that person's past chats.
responsible_for:
- id: L2-PLATFORM-ASSISTANT/R-1
  aliases:
  - RESP-01
  statement: Answers a signed-in person's question from passages the Brain returned to that person, with a checked reference per statement.
  code:
  - KnovasPlatform/components/docbridge_integration/src/assistant
- id: L2-PLATFORM-ASSISTANT/R-2
  statement: 'Past chats (W-07): what a person asked and the answers as they were shown, with their references, stored in the Platform''s own database in new tables only, listed, opened and deleted by their owner only (plan § 5.2).'
  code:
  - KnovasPlatform/components/docbridge_integration/src/identity/chats.py
  - KnovasPlatform/components/docbridge_integration/src/identity/migrations/0026_assistant_chats.sql
- id: L2-PLATFORM-ASSISTANT/R-3
  statement: 'The ask page (W-01, W-03, PMVP-22a): POST /fragen takes the question from the search page''s box, asks the
    service once for the signed-in person and shows the reply: each statement with its reference, which opens the
    statement''s quote right under it; the passages; no answer with the closest passages; busy or failed as the plain
    message. The switch Fragen / Suchen beside the box (ask.js) sends a question there and leaves searching to the
    search page.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/assistant_routes.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/ask.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/ask.css
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/ask.js
- id: L2-PLATFORM-ASSISTANT/R-4
  statement: 'Its own claim (RB-6): the assistant is a member of roles, and every Core call of an answer (the search,
    the document-fields probe inside it, the generation) carries the claim the Platform signs for it, narrowed to the
    signed-in person (its roles'' groups and functions that she also holds), and declares the actor {kind: agent, id:
    the assistant, on_behalf_of: the person}. Without the assistant''s claim it answers failed; it never falls back to
    the person''s own claim.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/assistant_routes.py
not_responsible_for:
- Reading documents any other way than through the person's own search and, for the passages that search returned,
  the text of those documents around each hit, under the founder's five limits of 2026-11-22 (PMVP-20 context;
  plan § 5.2, step 2, POST-02 as amended).
- Deciding who may see a document; the Brain's search does, as the signed-in person.
- The search page and the document view; they belong to the Platform's web app (index.html draws the box and the
  switch only when the ask page says the assistant is on).
- Opening a document from a reference; the web app's file routes serve what retrieval handed the person.
terms:
- reference (a number in an answer that points to a passage retrieved for this person in this chat)
- passage (a hit's verbatim text that the person's search returned, or up to 1,200 characters of the text around
  it read from that document (PMVP-20 context), numbered in search order)
- chat (one person's questions and the answers as they were shown, with their references)
operations:
- id: http.POST.fragen
  name: 'POST /fragen - the ask page: one question from the box, the reply with its references, quotes and passages'
  entrance: http
  ref: POST /fragen
- id: call.web_interface.assistant_routes.install_assistant
  name: install_assistant(app, client, identity_gate, split, csrf_valid, grant, page_context, pdf_preview) - registers
    the ask page and the factory of its service; app.py calls it once, when accounts are on
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/assistant_routes.py#install_assistant
- id: call.assistant.core.make_service
  name: 'make_service(settings, api_client, split, user_key) - the assistant as the settings say now: OFF while it is
    switched off, else the service with the provider the customer chose (the assistant''s routes, PMVP-22a, build it per
    request)'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/assistant/core.py#make_service
- id: call.assistant.providers.connection_test
  name: connection_test(api_key, model) - «Verbindung testen» on the settings page, one call to Claude with an invented
    passage and question
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/assistant/providers.py#connection_test
- id: call.assistant.providers.settings_problems
  name: 'settings_problems(settings) - what the settings page says next to the key: anthropic chosen without a readable
    key'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/assistant/providers.py#settings_problems
- id: call.assistant.errors.CoreBusy
  name: CoreBusy - the Core or the provider is busy (HTTP 429, 503 from the Core; 429, 529 from Claude); the Platform's
    client (knovas_client.py) raises it
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/assistant/errors.py#CoreBusy
- id: call.assistant.errors.CoreFailed
  name: CoreFailed - any other failure of the Core or the provider; the Platform's client (knovas_client.py) raises it
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/assistant/errors.py#CoreFailed
contract:
  '*':
    needs:
    - id: L2-PLATFORM-ASSISTANT/*/N-1
      aliases:
      - PRE-01
      statement: The person is signed in and the request carries the Platform's request-forgery token.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_signed_out_is_sent_to_sign_in
        - test_without_the_token_the_question_is_refused
        - test_a_wrong_token_is_refused
    - id: L2-PLATFORM-ASSISTANT/*/N-2
      aliases:
      - PRE-02
      statement: The assistant is switched on for this installation.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_switch.py
        checks:
        - test_off_by_default_nothing_is_built_and_nothing_is_searched
        - test_the_deployment_pins_the_switch
        - test_the_page_switches_it_on_and_off_without_a_restart
    promises:
    - id: L2-PLATFORM-ASSISTANT/*/P-1
      aliases:
      - POST-01
      statement: Every reference shown points to a passage retrieved for this person in this chat.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_sentences_with_valid_references_are_kept
        - test_several_references_on_one_sentence
        - test_a_sentence_citing_an_unknown_number_is_removed_and_counted
        - test_a_sentence_mixing_a_valid_and_an_unknown_number_is_removed
        - test_a_sentence_without_any_reference_is_removed_and_counted
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_sentence_split_acceptance.py
        checks:
        - test_a_statement_after_a_referenced_one_is_checked_on_its_own
        - test_a_number_before_a_stop_does_not_join_two_statements
        - test_common_abbreviations_ordinals_and_dates_stay_in_one_sentence
    - id: L2-PLATFORM-ASSISTANT/*/P-2
      aliases:
      - POST-02
      statement: 'No passage enters the prompt that the person''s own search would not have returned at that moment.
        Amended by the founder on 2026-11-22 (PMVP-20 context): a passage may be widened to the text around its hit,
        read only from a document that this question''s search returned (never an id from the question, the chat, the
        model or an earlier question), decided by the Core on every read (any refusal or failure keeps the search''s
        snippet), through the same client as the same principal with the same declared actor, bounded (at most 8
        documents, 3 parts each, 8 seconds a question, one read at a time) and with no text in any log line.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_context_core.py
        checks:
        - test_only_the_documents_this_search_returned_are_read
        - test_each_refusal_and_failure_keeps_the_snippet_and_the_answer
        - test_the_read_is_made_as_the_person_who_searched
        - test_inside_the_assistants_claim_the_read_declares_the_same_actor
        - test_nothing_of_the_text_reaches_a_log_line_at_debug
        - test_the_search_page_reads_no_document_text
        - test_only_the_assistants_reader_calls_document_text
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_context_reads.py
        checks:
        - test_only_the_documents_this_search_returned_are_read
        - test_nothing_is_kept_from_one_question_to_the_next
        - test_each_refusal_and_failure_keeps_the_snippet_and_the_answer_is_produced
        - test_two_hits_in_one_document_share_one_reading
        - test_at_most_eight_documents_are_read_the_lowest_ranked_keep_their_snippets
        - test_the_time_budget_stops_further_reads_and_bounds_each_read
        - test_not_found_keeps_the_snippet_after_at_most_three_parts
        - test_a_quote_from_outside_the_context_is_removed
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_the_question_is_searched_once_as_given
        - test_every_retrieved_passage_is_numbered_in_the_prompt
        - test_no_text_enters_the_prompt_that_search_did_not_return
        - test_rows_without_passage_text_are_not_passages
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_providers.py
        checks:
        - test_the_provider_receives_the_system_instruction_and_the_composed_messages_only
        - test_only_role_and_content_of_a_message_are_sent
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_switch.py
        checks:
        - test_anthropic_answers_through_claude_on_the_saved_key_and_model
    - id: L2-PLATFORM-ASSISTANT/*/P-3
      aliases:
      - POST-03
      statement: A chat is readable and deletable by its owner only; deleting removes its messages and references.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp21_chats_acceptance.py
        checks:
        - test_the_owner_reads_back_messages_and_references
        - test_the_list_holds_the_owners_chats_only_newest_first
        - test_another_person_cannot_read_a_chat
        - test_another_persons_chat_looks_like_a_missing_one
        - test_another_person_cannot_write_into_a_chat
        - test_another_person_cannot_delete_a_chat
        - test_deleting_removes_the_chat_its_messages_and_references
        - test_a_removed_person_takes_their_chats_along
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_identity_chats_store.py
        checks:
        - test_every_link_is_deleted_along
        - test_deleting_an_unknown_id_raises_the_same_not_found
        - test_a_malformed_id_is_a_missing_chat
        - test_a_foreign_write_does_not_move_the_chat
        - test_not_found_names_no_id
    - id: L2-PLATFORM-ASSISTANT/*/P-4
      aliases:
      - POST-04
      statement: No question, answer or passage text is written to a log line; logs carry ids, counts and durations.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_no_customer_text_reaches_a_log_line
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_identity_chats_store.py
        checks:
        - test_no_text_reaches_a_log_line
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_providers.py
        checks:
        - test_no_customer_text_and_no_key_reach_a_log_line
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_sdk_logs.py
        checks:
        - test_at_debug_the_sdk_logs_no_request_and_no_transport_error
    - id: L2-PLATFORM-ASSISTANT/*/P-5
      aliases:
      - POST-05
      statement: If no passage supports an answer, the reply says so and lists the closest passages; it does not answer from general knowledge.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_nothing_left_after_the_check_gives_the_no_answer_reply
        - test_no_passages_means_no_generation_and_the_no_answer_reply
        - test_no_answer_text_is_the_agreed_sentence
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_sentence_split_acceptance.py
        checks:
        - test_the_no_answer_sentence_is_never_a_cited_answer
        - test_a_no_answer_sentence_inside_an_answer_is_not_shown
    - id: L2-PLATFORM-ASSISTANT/*/P-6
      aliases:
      - POST-06
      statement: A failed or slow Core call produces a plain message and no partial answer.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_a_busy_core_gives_a_plain_busy_message_and_no_answer_text
        - test_a_failed_core_gives_a_plain_message_and_no_answer_text
        - test_a_failed_search_gives_no_generation_and_no_exception
        - test_an_unexpected_generation_error_does_not_escape
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_providers.py
        checks:
        - test_the_service_says_busy_or_failed_and_nothing_else
    - id: L2-PLATFORM-ASSISTANT/*/P-7
      statement: The provider's API key (assistant.anthropic_api_key) is kept sealed by the settings registry and is in no
        log line, exception, page, response or audit entry (the audit says geändert); without a key no client is built,
        and the answer fails.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_settings_assistant.py
        checks:
        - test_the_key_is_sealed_audited_as_changed_and_never_shown
        - TestThroughTheApp::test_an_admin_switches_it_on_saves_the_key_and_tests_it
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_providers.py
        checks:
        - test_each_sdk_error_is_busy_or_failed_with_a_status_and_a_reason_only
        - test_without_a_key_no_client_is_built_and_the_answer_fails
        - test_no_customer_text_and_no_key_reach_a_log_line
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_switch.py
        checks:
        - test_the_builders_key_is_not_the_assistants
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_sdk_logs.py
        checks:
        - test_at_debug_the_sdk_logs_no_request_and_no_transport_error
    - id: L2-PLATFORM-ASSISTANT/*/P-8
      statement: 'The provider is the one the customer chose (assistant.provider): knovas is the Core''s
        /secured/llm/generate as before; anthropic is Claude on the saved key and model (assistant.model, claude-opus-5-5
        by default), with effort medium, the server-side fallback, at least 8,000 tokens, 60 seconds and no retry.
        Either way the search is the person''s own and the check is the same.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_switch.py
        checks:
        - test_knovas_is_the_cores_call_as_built
        - test_anthropic_answers_through_claude_on_the_saved_key_and_model
        - test_a_changed_model_applies_to_the_next_answer
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_providers.py
        checks:
        - test_the_request_is_the_ordered_shape_and_nothing_else
        - test_max_tokens_is_at_least_8000
        - test_the_client_gets_the_settings_key_60_seconds_and_no_retry_and_is_closed
        - test_the_client_is_built_without_a_retry
        - test_the_service_answers_through_claude_unchanged
    limits:
    - id: L2-PLATFORM-ASSISTANT/*/L-1
      statement: 'The prompt keeps the Core''s limits for /secured/llm/generate (plan § 5.2, step 3): at most 32 messages with the question last, and the passages and the chat''s earlier turns cut to the byte limits per message.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp20_assistant_acceptance.py
        checks:
        - test_a_long_history_stays_within_the_core_limits_and_ends_with_the_question
        - test_long_passages_are_cut_to_fit_the_core_limits
        - test_a_short_history_is_passed_on_in_order
    - id: L2-PLATFORM-ASSISTANT/*/L-2
      statement: A chat's title is one line of at most 200 characters; a longer title, a role other than user or assistant and a malformed reference are refused before any statement runs, and the refusal repeats nothing the person typed.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_identity_chats_store.py
        checks:
        - test_a_title_is_one_line
        - test_a_title_over_200_characters_is_refused_before_the_database
        - test_a_title_of_200_characters_is_kept_whole
        - test_a_role_other_than_user_or_assistant_is_refused_before_the_database
        - test_a_malformed_reference_is_refused_before_the_database
        - test_two_references_with_one_number_are_refused_before_the_database
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp21_chats_acceptance.py
        checks:
        - test_only_user_and_assistant_roles_are_stored
  http.POST.fragen:
    needs:
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/N-1
      statement: 'The caller is signed in (else the login gate sends them to sign in) and the form carries its
        csrf_token field (else 400, "Formular ist abgelaufen", and nothing is asked). The app exempts the endpoint
        from its header gate, as it does for its other form posts, because the route checks the field itself.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_signed_out_is_sent_to_sign_in
        - test_signed_out_is_sent_to_sign_in_with_the_switch_off_too
        - test_without_the_token_the_question_is_refused
        - test_a_wrong_token_is_refused
        - test_the_header_alone_does_not_stand_in_for_the_form_token
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/N-2
      statement: The assistant is switched on (assistant.enabled, read on every request); off, the page answers 404
        and the search page's box offers only searching.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_switched_off_the_page_answers_404
        - test_the_settings_page_switches_it_on
        - test_the_switch_is_read_on_every_request
        - test_a_service_factory_that_says_off_is_a_404
        - test_switched_off_the_box_only_searches
        - test_switched_on_the_box_asks_and_offers_the_switch
    promises:
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/P-1
      statement: 'POST-01 on the page: each statement shows the one reference the check kept for it, and the reference
        opens that statement''s own quote, under it, with the title and page of that passage; the passages listed are
        the reply''s. The service is asked once, with the question as typed.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_the_question_is_asked_once_as_typed
        - test_each_statement_is_a_paragraph_with_its_reference
        - test_each_reference_controls_its_own_quote
        - test_the_quote_stands_right_under_its_statement
        - test_the_quote_card_names_the_document_and_the_page
        - test_the_passages_follow_with_number_title_and_page
        - test_without_javascript_every_quote_is_open
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/P-2
      statement: 'POST-05 on the page: no answer shows "Dazu finde ich nichts in Ihren Quellen" and the closest
        passages, and no statement.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_no_answer_says_so_and_lists_the_closest_passages
        - test_no_answer_without_passages_shows_the_sentence_alone
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/P-3
      statement: 'POST-06 on the page: busy and failed show the plain message and nothing else (no statement, quote,
        passage or count), also for a question over the limit, which is refused before the service.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_busy_and_failed_show_the_plain_message_and_nothing_else
        - test_a_question_over_the_limit_is_refused_before_the_service
        - test_the_real_service_is_wired_and_fails_closed_without_the_secured_api
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/P-4
      statement: 'Question, statement, quote and title reach the page as plain text, escaped: no Markdown, no HTML, no
        link from the model (FU-11); a title or a quote is a run of its own direction, so a right-to-left mark in it
        cannot reorder the line around it. Every address on the page is built with url_for, none taken from the reply
        (FU-34); a passage shown may be opened through the file routes as a search hit may.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
        - test_titles_and_quotes_are_isolated_runs
        - test_statement_quote_and_title_come_out_as_their_characters
        - test_every_address_on_the_page_is_built_by_the_app
        - test_the_link_opens_the_pdf_as_a_search_hit_opens_it
        - test_the_passages_shown_may_be_opened
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_static.py
        checks:
        - test_the_template_marks_nothing_safe
        - test_every_href_of_the_page_is_built_by_the_app
        - test_the_script_writes_no_markup_from_text
    - id: L2-PLATFORM-ASSISTANT/http.POST.fragen/P-5
      statement: The count of removed statements is shown when it is not 0, never their text; the route's one log line
        carries the status and counts only (POST-04).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_assistant_page_routes.py
        checks:
