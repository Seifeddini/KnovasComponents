uses:
- component: EXT-BRAIN-API
  method: 'POST /secured/query (the person''s own search), GET /secured/document/<uuid>/text (the text around each hit, only for the documents that search returned, under the founder''s limits of 2026-11-22; PMVP-20 context) and POST /secured/llm/generate (one whole answer, no streaming), through the Platform''s client (knovas_client.py) on the Platform''s certificate, as the Knovas Assistent for the signed-in person: its own claim narrowed to her and the declared actor (plan § 5.2; RB-6)'
  protocol: HTTPS with mTLS
- component: EXT-ANTHROPIC-API
  operations:
  - messages
  expects:
  - EXT-ANTHROPIC-API/messages/P-1
  - EXT-ANTHROPIC-API/messages/P-2
  method: 'when the customer chose anthropic (assistant.provider): the official SDK (anthropic==2.12.0),
    client.beta.messages.create, on the key and the model of the settings registry, with the system instruction and
    the composed messages only (POST-02; the passages are the contexts around the hits since PMVP-20 context); one call per answer, and one per «Verbindung testen» with invented text
    (src/assistant/providers.py, PMVP-25)'
  protocol: HTTPS
hides:
- The layout of the tables assistant_chats, assistant_messages and assistant_references (migration 0026).
- How the prompt is worded and how an answer is split into statements before the check.
- Which provider writes the answer; the service and the check take the same generate either way.
decisions:
- id: FU-14
  statement: 'No Alloy model for POST-02 (the founder, 2026-11-19): the assistant gets document content only through the Brain''s search, which enforces access.'
- id: PMVP-20-context
  statement: 'The founder, 2026-11-22 ("Yes, with limits"): the assistant may read the Core''s document-text route for the documents the person''s own search just returned, under five limits (only those documents; the Core decides every read and any failure keeps the snippet; as the person; bounded; no text in logs). POST-02 is amended to them; Core request CR-1 is not needed for the pilot.'
risks:
- id: L2-PLATFORM-ASSISTANT/RISK-01
  statement: The check catches a reference number that matches no passage, not one that matches the wrong passage (plan § 7, risks).
  mitigation: The test questions measure it (plan § 11), and the page always shows the passage under the sentence, so the reader sees the evidence itself.
- id: L2-PLATFORM-ASSISTANT/RISK-02
  statement: POST-02 keeps the prompt to what the person's search returns; the search follows the person's rights only where a customer's enforcement is on, and it is off for every tenant today (plan § 3).
  mitigation: No customer is switched to enforcement «Ein» before the Core's end-to-end rights test has passed twice (plan § 8.1, DEC-0082).
- id: L2-PLATFORM-ASSISTANT/RISK-04
  statement: 'The document-text route takes no claim on a GET yet (Core request CR-1c): it resolves the principal from the certificate alone, so under disabled it reads every document as the search does, under enforcing open documents only, and under brokered it refuses every read (401). The context then reads at most what the tenant''s posture lets an unnamed caller read, never a document the search did not return.'
  mitigation: Only documents this question's search returned are read, and a refusal keeps the snippet; CR-1c makes the read narrow exactly as the person's search does; until then «Ein» (brokered) means snippets only.
- id: L2-PLATFORM-ASSISTANT/RISK-03
  statement: 'With anthropic chosen (the founder, 2026-11-21: the Platform calls the language model itself and the customer chooses the provider; the pilot chose Anthropic), the passages the person''s search returned (since PMVP-20 context up to 1,200 characters around each hit), the question and its history leave the installation for Anthropic; while enforcement is off (RISK-02) they may hold passages beyond the person''s rights. The key is a secret of the installation.'
  mitigation: Off and knovas by default; only an administrator chooses anthropic and enters the key; the key is sealed with the deployment's settings key and never shown or logged; PMVP-25 is critical under the repository's CLAUDE.md, so management approves it before main.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: Planned until the service (PMVP-20), its switch and provider (PMVP-25) and its pages (PMVP-22a) are integrated on feat/platform-mvp; chats.py and migration 0026 are integrated (PMVP-21) but nothing calls them yet.
- at: /operations
  why: 'Listed by PMVP-25 (on feat/pmvp-25, from feat/pmvp-20): what other files take today (CoreBusy and CoreFailed by knovas_client.py; connection_test and settings_problems by the settings page) and make_service, the entry the ask page (PMVP-22a, http.POST.fragen, inside this card) takes. Not listed until a caller takes them: AssistantService with Turn, Passage, Sentence, Reply and NO_ANSWER_TEXT (service.py), make_search and make_generate (core.py), make_anthropic_generate (providers.py). identity/chats.py''s ChatStore and ChatNotFound are taken by no other file yet; the routes that use them come with PMVP-22a and PMVP-23.'
- at: /uses
  why: 'Operations and expected lines follow with PMVP-20''s integration: EXT-BRAIN-API lists neither POST /secured/query nor POST /secured/llm/generate yet. The service also takes the search page''s own search plan (doc_fields_routes.py) and the web app''s client (knovas_client.py), which have no card.'
- at: /operations/0
  why: 'PMVP-22a. The ask page''s tests replace the service with a fake that returns a fixed reply (no model, no
    Knovas); one test builds the real service through make_service and sees it fail closed without the secured API.
    The page shows the quote under its statement, the first half of W-04 pulled in from PMVP-22b; the chat (history,
    past chats) is PMVP-22b''s and PMVP-23''s, so each question stands alone. A document opens from the page without
    a script: a PDF in the browser''s viewer at the passage''s page (preview route, s= the sentence), anything else as
    the file (download route); the search page''s preview dialog is app.js''s and is not on this page. index.html
    (the box and the switch) and the wiring statement and CSRF exemption in app.py stay with the web app, which has
    no card.'
- at: /uses/1
  why: 'EXT-ANTHROPIC-API is new with PMVP-25; the Brain Builder''s views assistant calls the same API with its own key, and its card does not name the dependency yet.'
- at: L2-PLATFORM-ASSISTANT/*/P-7
  why: Critical (a secret). The key's sealing and the audit entry are the settings registry's (KC-0.1, platform_settings.SecretBox and SettingStore); the evidence shows them for this key.
- at: L2-PLATFORM-ASSISTANT/*/P-1
  why: Evidence named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here.
- at: L2-PLATFORM-ASSISTANT/*/P-2
  why: The first evidence is named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here. The provider path's (PMVP-25) was seen passing. The statement's amendment (the founder, 2026-11-22) and its evidence, one test per limit, are PMVP-20 context's (work order docs/platform-mvp/work-orders/PMVP-20-context.md; built 2026-11-22, not yet verified; class sensitive, Siran approves before main); the reads are assistant/context.py (widen_passages), the reader assistant/core.py (make_read_text) and the client's document_text (knovas_client.py, no card).
- at: L2-PLATFORM-ASSISTANT/*/P-4
  why: The chat store's half (test_identity_chats_store.py) and the provider path's (PMVP-25) were seen passing; the service's half is named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here.
- at: L2-PLATFORM-ASSISTANT/*/P-5
  why: Evidence named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here.
- at: L2-PLATFORM-ASSISTANT/*/P-6
  why: The first evidence is named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here. The provider path's (PMVP-25) was seen passing; Claude's client waits 60 seconds and never retries (a 429 or 529 is busy at once), under nginx's 180. FU-08 (a 504 from nginx before the plain message) is PMVP-24's.
- at: L2-PLATFORM-ASSISTANT/*/L-1
  why: Evidence named when the card was written (PMVP-01), in files PMVP-20's rework 2 withdrew (test_pmvp20_assistant_acceptance.py, test_pmvp20_sentence_split_acceptance.py; not on this branch). Their successor, test_pmvp20_statements_acceptance.py, passes on feat/pmvp-25 (88 tests); PMVP-20's integration names its checks here. The limits are the Core's; with anthropic the service keeps them all the same (PMVP-25 changes nothing of the service). FU-06 (a digit-heavy history can overflow the prompt budget) and FU-07 (no history at all when the turns are long) are PMVP-23's.
- at: L2-PLATFORM-ASSISTANT/R-4
  why: 'RB-6 (2026-11-21, work order docs/platform-mvp/work-orders/RB-6-7.md; design role-builder.md § 4). The claim
    is AgentStore.claim_for (identity/agents.py) signed by PrincipalBroker (identity/principal.py), and the actor is
    knovas_client.py''s (body of a POST, ?actor= on a GET): the identity package and the client have no card. The
    assistant''s membership (every role but Administration, migration 0028_agents and RoleStore.create_role) is the
    identity package''s too. It narrows only where the Core enforces the claim (CR-R1, «Ein»); until then it is signed
    and logged and changes nothing. make_service is unchanged: the wrapping is in install_assistant.'
- at: L2-PLATFORM-ASSISTANT/R-2
  why: Not a line of plan § 7 (which has RESP-01 only); written from plan § 5.2 and W-07, which the chat store and its frozen tests implement.
