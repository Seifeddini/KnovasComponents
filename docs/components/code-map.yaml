# brain-runner's code reader (code_map) on this repository, against the boundaries in boundaries.yaml: what each
# component's code offers (routes, commands, names another component takes) and which other components it needs.
#   python3 -m brain_runner code-map --spec docs/components/code-map.yaml --root .
#   python3 -m brain_runner code-map --spec docs/components/code-map.yaml --root . --owner L3-KNOVAS-LINK --documents
# Python only; the same options as map-check.yaml's code entry.
glob: "**/*.py"
options:
  tracked_only: true
  roots: [KnovasLink/src, KnovasPlatform/components/sync_component/src,
          KnovasPlatform/components/docbridge_integration/src, KnovasConnector/src,
          KnovasPlatform/components/experiments_runner, KnovasPlatform/experiments-sdk/python,
          KnovasPlatform/mock_knovas_api]
  boundaries: {path: docs/components/boundaries.yaml, select: "items(data.components)[].{owner: key, prefixes: value.paths}"}
  routes: {decorators: [route], verb_decorators: [get, post, put, patch, delete], registrations: [add_url_rule]}
  cli: {subcommands: [add_parser], commands: [command], main_guard: true}
  http: {methods: [get, post, put, patch, delete]}
