uses:
- component: EXT-BRAIN-API
  operations:
  - access-routes
  - graph-routes
  expects:
  - EXT-BRAIN-API/access-routes/P-1
  method: 'through the Platform''s own client on the Platform''s certificate (knovas_client, passed in by the app as client_factory):
    access groups and folder rules; a document''s fields (/secured/graph/doc-values); the document list (GET /secured/documents),
    a document''s access (PUT /secured/document_access) and erasing the corpus (DELETE /secured/delete_all_documents)'
  protocol: HTTPS with mTLS
hides:
- The German texts of the console.
- How a guarded action's payload is summarised on the Freigaben page.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
- at: /status
  why: Live or planned is not read from the code; the console is on main and runs where the Platform runs.
- at: /source_paths
  why: 'The work order''s scope: the people, groups and access pages PMVP-40 to PMVP-42 change. guarded.py is here because
    only console modules use it (admin_documents.py, admin_ingestion.py). admin.css is the stylesheet of every console page,
    those without a card too. The other console modules (admin_ingestion.py, admin_doc_fields.py, admin_system.py) and their
    pages stay outside (boundaries.yaml, not_carded); their domain is open (DEC-0083 names the Admin pages, not each console
    module): the project that cards them decides.'
