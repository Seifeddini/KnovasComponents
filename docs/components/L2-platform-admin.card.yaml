card: 2
id: L2-PLATFORM-ADMIN
name: Verwaltung
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin_approvals.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/guarded.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_people.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_approvals.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/admin_people.js
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/admin.css
purpose: The firm's administration console in the Platform, where an administrator manages people and their roles, and
  a second person confirms guarded actions; the console's blueprint and role gates, on which the access pages
  (L2-PLATFORM-ACCESS) hang.
responsible_for:
- id: L2-PLATFORM-ADMIN/R-1
  statement: 'People (A-01, A-02): create, deactivate and activate an account, reset a password, sign a person out everywhere,
    and set a person''s roles, named in plain words, and access groups.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_people.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/admin_people.js
- id: L2-PLATFORM-ADMIN/R-3
  statement: 'Approvals: a guarded action (a document''s access groups, a folder rule, erasing the corpus) is queued for
    a second person, who confirms or rejects it; an administrator acting alone is recorded as a bypass, and only an administrator
    switches the bypass.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_approvals.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/guarded.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_approvals.html
- id: L2-PLATFORM-ADMIN/R-4
  statement: The console's one blueprint and its role gates, on which the other console pages (Zugriffsgruppen and Dokumente
    of L2-PLATFORM-ACCESS, Ingestion, Dokumentfelder, System's checks) are mounted, and the console's stylesheet. The console
    draws no menu of its own - its pages are the entries of the navigation's area Verwaltung, which the shell draws; each
    page names itself to the navigation.
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/admin.css
not_responsible_for:
- Accounts, roles, sessions, the audit log and the approval queue's storage; the Platform's identity package (src/identity)
  keeps them.
- The access groups, the folder rules and the documents with their access groups (A-03, A-04); L2-PLATFORM-ACCESS, whose
  routes hang on this blueprint and its gate.
- Whether a person may read a document; the Brain decides, per customer, where enforcement is on.
- The console's Ingestion and Dokumentfelder pages and System's checks (admin_ingestion.py, admin_doc_fields.py, admin_system.py);
  they are mounted on this blueprint and have no card yet.
- «Was sieht …?» and the enforcement posture; today they are the Builder's (access window), and PMVP-41 and PMVP-42 bring
  them here.
terms:
- 'guarded action (an action a second person must confirm: a document''s access groups, a folder rule, erasing the corpus,
  an ingestion profile)'
- bypass (an administrator acting alone on a guarded action, recorded as approval.bypassed)
operations:
- id: http.GET.admin
  name: GET /admin/ - the console's entry; redirects to Personen
  entrance: http
  ref: GET /admin/
- id: http.GET.admin.people
  name: 'GET /admin/people - Personen: every account with its roles and access groups'
  entrance: http
  ref: GET /admin/people
- id: http.POST.admin.people.create
  name: POST /admin/people/create - create an account (A-01)
  entrance: http
  ref: POST /admin/people/create
- id: http.POST.admin.people.disable
  name: POST /admin/people/disable - deactivate an account (A-01)
  entrance: http
  ref: POST /admin/people/disable
- id: http.POST.admin.people.enable
  name: POST /admin/people/enable - activate an account again
  entrance: http
  ref: POST /admin/people/enable
- id: http.POST.admin.people.roles
  name: POST /admin/people/roles - replace a person's roles (A-02)
  entrance: http
  ref: POST /admin/people/roles
- id: http.POST.admin.people.groups
  name: POST /admin/people/groups - replace a person's access groups
  entrance: http
  ref: POST /admin/people/groups
- id: http.POST.admin.people.reset-password
  name: POST /admin/people/reset-password - reset a password, to be changed at the next sign-in (A-01)
  entrance: http
  ref: POST /admin/people/reset-password
- id: http.POST.admin.people.sign-out
  name: POST /admin/people/sign-out - sign a person out everywhere (A-01)
  entrance: http
  ref: POST /admin/people/sign-out
- id: http.GET.admin.system
  name: 'GET /admin/system - System: whether the outside connections hold, as a page'
  entrance: http
  ref: GET /admin/system
- id: http.GET.approvals
  name: 'GET /admin/approvals - Freigaben: guarded actions waiting for a second person, and the bypasses'
  entrance: http
  ref: GET /admin/approvals
- id: http.POST.approvals._request_id.approve
  name: POST /admin/approvals/{request_id}/approve - confirm another person's request
  entrance: http
  ref: POST /admin/approvals/{request_id}/approve
- id: http.POST.approvals._request_id.execute
  name: POST /admin/approvals/{request_id}/execute - carry out a confirmed request
  entrance: http
  ref: POST /admin/approvals/{request_id}/execute
- id: http.POST.approvals._request_id.reject
  name: POST /admin/approvals/{request_id}/reject - reject a request, with a reason
  entrance: http
  ref: POST /admin/approvals/{request_id}/reject
- id: http.POST.approvals.admin-bypass
  name: POST /admin/approvals/admin-bypass - switch whether an administrator may act alone
  entrance: http
  ref: POST /admin/approvals/admin-bypass
- id: call.web_interface.admin.create_admin_blueprint
  name: create_admin_blueprint - builds the console's one blueprint under /admin with its role gates; the app registers
    it
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin.py#create_admin_blueprint
- id: call.web_interface.guarded.run_guarded
  name: 'run_guarded - the console''s one way to perform a four-eyes-guarded action: queued, or executed and recorded as
    a bypass'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/guarded.py#run_guarded
