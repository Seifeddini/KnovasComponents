uses:
- component: L2-PLATFORM-ADMIN
  operations:
  - call.web_interface.guarded.run_guarded
  expects: []
  method: 'imported: every write that a second person must confirm (a document''s access groups, a folder rule, erasing
    the corpus) goes through run_guarded; the routes are attached to the blueprint and the gate create_admin_blueprint
    passes in'
  protocol: in-process call
- component: L2-PLATFORM-ROLE-DATA
  operations:
  - call.web_interface.admin_role_data.execute_role_data
  expects:
  - L2-PLATFORM-ROLE-DATA/call.web_interface.admin_role_data.execute_role_data/P-1
  method: 'imported when it runs: execute_acl_change hands the two actions of a role''s data (role_data_add,
    role_data_remove; RB-5) to execute_role_data, which plans them again and carries them out'
  protocol: in-process call
- component: EXT-BRAIN-API
  operations:
  - access-routes
  - graph-routes
  expects:
  - EXT-BRAIN-API/access-routes/P-1
  method: 'through the Platform''s own client on the Platform''s certificate (knovas_client, passed in by the app as client_factory):
    access groups and folder rules; a document''s fields (/secured/graph/doc-values); the document list (GET /secured/documents),
    a document''s access (PUT /secured/document_access) and erasing the corpus (DELETE /secured/delete_all_documents)'
  protocol: HTTPS with mTLS
hides:
- The German texts of the access pages.
- How the flat list of groups the Brain returns is drawn as a tree (admin_access_groups.html); a group whose parent is not
  in the list is drawn at the top, and each group once.
- 'Which state of a document carries a mark on the Dokumente page: every state but "active".'
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
- at: /status
  why: Live or planned is not read from the code; the console is on main and runs where the Platform runs.
- at: /source_paths
  why: 'Split from L2-PLATFORM-ADMIN by PMVP-40 (2026-11-21, FU-17): together the card was over its context budget, the
    code alone (16,724 tokens) over 16,000. This card took admin_documents.py, its two templates and admin_documents.js,
    the responsibility L2-PLATFORM-ADMIN/R-2 and the contract lines of their routes, each with its old id as its first
    alias. The parent L1-WORKSPACE (KnowledgeBase) does not list this card yet.'
- at: /operations
  why: The routes of admin_documents.py are attached to the blueprint admin.py passes in, so the code reader shows them
    without the prefix /admin (e.g. GET /access-groups @web_interface.admin_documents.bp); the refs here name the served
    path. Backlog row B33 of the Software Map plan.
- at: /operations
  why: 'attach_document_routes, execute_acl_change and execute_corpus_purge have no line: plan § 7 gives none. They became
    operations of their own when the card was split (admin.py on L2-PLATFORM-ADMIN imports them).'
- at: /contract
  why: 'Plan § 7 names Verwaltung only in SHELL POST-01, whose server half ("the server refuses the page otherwise") is
    each route''s N-1 here. Every other line of these routes has no source in § 7. Since PMVP-40 each N-1 has live tests
    in tests/test_web_admin_gates.py: the view the app registered lets in admin alone (allowed_roles); every other role
    the console gives and an account with no role get 403 and nothing runs; an administrator gets 200 (for the three
    fields routes, which answer JSON, that 200 is TestDocFieldsLive''s). The signed-out test cannot catch a missing
    route gate on its own: the app''s sign-in check answers first. The source check of test_web_admin_documents.py
    (every @bp.route carries @require_admin) stays as a second piece of evidence.'
- at: /responsible_for
  why: 'PMVP-40 (2026-11-21): both pages are one column of the shared page parts (_parts.html); the group tree stays a tree,
    a folder rule and a document are rows of a list, their access groups in words. Marks only for exceptions: a document
    whose state is not "active" carries a tag with its state; admin_documents.js draws the rows it loads the same way. The
    access groups are shown as the data holds them (by id), as before.'
- at: /uses
  why: 'Not declared because they have no card yet: the Platform''s identity package (audit, approvals), the web app''s client
    (knovas_client.py) and the document-fields modules (doc_fields_capability.py, doc_fields_view.py, admin_doc_fields.py).
    L2-PLATFORM-ADMIN''s run_guarded has no line to expect: plan § 7 gives none. EXT-BRAIN-API lists neither /secured/document_access
    nor /secured/delete_all_documents, and its ingest-routes promise is written for Link''s relays, not for the console''s
    document list.'
