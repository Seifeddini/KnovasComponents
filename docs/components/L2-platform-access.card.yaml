card: 2
id: L2-PLATFORM-ACCESS
name: Zugriff
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin_documents.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_access_groups.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_documents.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/admin_documents.js
purpose: Who may read what, as the firm's administrator sets it in the Platform's console - the access groups as a tree,
  the folder rules and a document's access groups - and the console's document list with its fields drawer and the
  erasing of the corpus.
responsible_for:
- id: L2-PLATFORM-ACCESS/R-1
  aliases:
  - L2-PLATFORM-ADMIN/R-2
  statement: 'Access (A-03, A-04): the access groups as a tree, the folder rules and a document''s access groups, written
    through the Brain''s access routes; a document''s fields drawer.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_documents.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_access_groups.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_documents.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/js/admin_documents.js
- id: L2-PLATFORM-ACCESS/R-2
  statement: 'Erasing the tenant''s whole corpus at Knovas, from the Dokumente page: only with the tenant''s id typed in,
    as a guarded action, and recorded after the call returns.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_documents.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_documents.html
not_responsible_for:
- The console's blueprint, its role gates and run_guarded (L2-PLATFORM-ADMIN); the routes here are attached to that blueprint
  with its require_admin, and every write that needs a second person goes through run_guarded.
- Whether a person may read a document; the Brain decides, per customer, where enforcement is on. The document list shows
  only what the administrator may see.
- The document fields' registry, packs and rules (admin_doc_fields.py, the Dokumentfelder page; no card yet), whose views
  the drawer reuses.
- «Was sieht …?» and the enforcement posture, on the page «Zugriff» (L2-PLATFORM-ACCESS-CHECK; PMVP-41 and PMVP-42).
terms:
- access group (a group of readers at Knovas; a document or a folder rule names the groups that may read it, by id)
- folder rule (a path prefix whose documents take the rule's access groups, at ingest and, for documents already there,
  with a reconciliation)
