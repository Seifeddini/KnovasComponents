    hands to L2-PLATFORM-ROLE-DATA's execute_role_data
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_documents.py#execute_acl_change
- id: call.web_interface.admin_documents.execute_corpus_purge
  name: execute_corpus_purge - erases the tenant's corpus at Knovas and records it after the call returns; the one function
