contract:
  home:
    needs:
    - id: L2-BRAIN-BUILDER/home/N-1
      statement: The caller holds the Builder permission «view» (ENDPOINT_PERMISSIONS), from a Platform role or a running grant on the workspace; otherwise 403.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_builder_team.py
        checks:
        - TestEveryRoute::test_an_endpoint_not_listed_needs_manage
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_builder_shell.py
        checks:
        - TestTheShell::test_the_entry_point_opens_the_first_stage
    promises:
