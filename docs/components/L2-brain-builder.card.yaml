  - EXT-BRAIN-API/sign-certificate/P-1
  - EXT-BRAIN-API/graph-routes/P-1
  - EXT-BRAIN-API/access-routes/P-1
  method: through the Platform's own client on the Platform's certificate (knovas_client, passed in by the app)
  protocol: HTTPS with mTLS
