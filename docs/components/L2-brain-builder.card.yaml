purpose: Where a person sets up a company's Brain in the Platform - workspaces, ontology, processes, sources and mappings, views and access - reviews and publishes it, and connects and watches the company's sites and components.
responsible_for:
- id: L2-BRAIN-BUILDER/R-1
  statement: 'Workspaces and their draft: the ontology, processes, sources, mappings, views and access design, edited with undo, imported from and exported to a configuration package.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/store.py
  - KnovasPlatform/components/docbridge_integration/src/builder/editing.py
  - KnovasPlatform/components/docbridge_integration/src/builder/package.py
- id: L2-BRAIN-BUILDER/R-2
  statement: 'Review and publish: the dry run, the four-eyes approval bound to the digest of what publishing changes, and the apply to the tenant through brain-runner.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/review.py
  - KnovasPlatform/components/docbridge_integration/src/builder/publisher.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/builder_routes.py
- id: L2-BRAIN-BUILDER/R-3
  statement: 'Components and sites: enrolment, tokens, the install package, the certificate step, commands, runs, held plans, schedules (also «bei neuen Commits»), the switch «automatisch anwenden» per source, the sync status per source, and the Platform''s side of connector protocol v1.2.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/components.py
  - KnovasPlatform/components/docbridge_integration/src/builder/sites.py
  - KnovasPlatform/components/docbridge_integration/src/builder/protocol.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/connector_protocol.py
- id: L2-BRAIN-BUILDER/R-4
  statement: The sources' two switches and the mapping panels «Zugriff» and «Zurückschreiben».
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/sources.py
  - KnovasPlatform/components/docbridge_integration/src/builder/source_edits.py
  - KnovasPlatform/components/docbridge_integration/src/builder/mappings.py
  - KnovasPlatform/components/docbridge_integration/src/builder/mapping_edits.py
- id: L2-BRAIN-BUILDER/R-5
  statement: '«Betrieb»: «Freigaben» for write proposals and, with BUILDER_PROTOCOL_V2 on, change sets with their
    previews (write back v2, approved only on exact previews), and «Verbindung», one health card per site.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/approvals.py
  - KnovasPlatform/components/docbridge_integration/src/builder/connection.py
  - KnovasPlatform/components/docbridge_integration/src/builder/connection_api.py
  - KnovasPlatform/components/docbridge_integration/src/builder/codes.py
- id: L2-BRAIN-BUILDER/R-6
  statement: 'Who may do what in the Builder: roles, grants on one workspace, comments and the access log; and the access window over the tenant''s groups and folder rules.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/team.py
  - KnovasPlatform/components/docbridge_integration/src/builder/access.py
  - KnovasPlatform/components/docbridge_integration/src/builder/access_edits.py
  - KnovasPlatform/components/docbridge_integration/src/builder/access_backend.py
- id: L2-BRAIN-BUILDER/R-7
  statement: 'Connector protocol 2.0 (draft, BUILDER_PROTOCOL_V2, off by default): the connector declarations Knovas
    Link reports, checked and kept on each component; writing back offered where the serving component declared
    actions for the source''s kind and passed the conformance suite''s write properties; the declared actions listed
    with the ways each can write; the staging per source (direct unless set, plan C-Q1), sent with each approval.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/builder/protocol_v2.py
  - KnovasPlatform/components/docbridge_integration/src/builder/protocol.py
  - KnovasPlatform/components/docbridge_integration/src/builder/sources.py
not_responsible_for:
- Reading a company's sources at the company; components do (the sync component, behind Knovas Link).
- Storing or showing a source's original documents; they pass through Link from the source.
- Signing a site's certificate; a Knovas admin signs it, the Builder records it.
- Sign-in and the Platform's roles; the Platform's identity gate gives them.
terms:
- 'workspace (one company''s model: a draft and published versions)'
- site (one machine at a company running Knovas Link)
- write proposal (a change of a fact an agent proposed, decided in «Freigaben»)
- change set (named actions of the tenant's ontology with the connector's preview, approved or rejected in «Freigaben»; write back v2)
- staging (how an approved write reaches a source - direct, or native_review in the source's own review step; kept per source)
- digest (the hash of everything a publish changes, which an approval holds)
