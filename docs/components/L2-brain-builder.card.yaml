decisions:
- id: DEC-0056
  statement: 'A site''s certificate: Knovas''s client CA signs Link''s request; the Builder records it and from then on requires its fingerprint (option A, A1).'
- id: CL-4
  statement: Accepting or rejecting a write proposal needs «publish»; «Freigaben» and «Verbindung» are read with a Platform role.
- id: C-Q1
  statement: 'Write back v2 (FEAT-2026-11-10-write-back, decided A by the founder on 2026-11-10): the Builder keeps the
    staging per source (direct unless set, D-3) and sends it with each approval; the Brain refuses a mode the
    connector did not declare.'
risks:
- id: L2-BRAIN-BUILDER/RISK-01
  statement: The Builder records who accepted a proposal or approved a change set, but the Brain does not yet bind the accept or the approval to a verified person (I2, WB-40).
  mitigation: The declared actor is recorded; verification comes with I2 (connection-layer.md, "What is built and what is not").
review:
- at: /owner
  why: Proposed owner; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: The Builder runs for its first tenant from a branch; its connection-layer pages are built and not deployed at a company. Live or planned is not read from the code.
- at: /source_paths
  why: 'Differs from the entry L2-BRAIN-BUILDER in the Brain''s own component manifest (kept where the Brain is built): adds connector_protocol.py (the HTTP binding of builder/protocol.py), static/css/builder and the builder migrations; leaves out scripts/builder_*.py (development tools). The manifest entry is to follow this card (boundaries.yaml says why).'
- at: L2-BRAIN-BUILDER/component-settings/P-1
  why: No evidence; no test calls the settings route.
- at: L2-BRAIN-BUILDER/access-rule-remove/P-1
  why: No evidence; no test calls the rule-removal route.
- at: L2-BRAIN-BUILDER/site-package/L-1
  why: No evidence; read from builder_routes.py (_PLATFORM_URL, the revoked check, the response headers).
- at: L2-BRAIN-BUILDER/protocol-heartbeat/L-1
  why: No evidence; MAX_BODY and the no_tenant answer in connector_protocol.py. Stated once for all eight protocol calls.
- at: /contract
  why: Every route's first need is its permission from ENDPOINT_PERMISSIONS; the test named shows that every endpoint is in the table and that the gate enforces it for representative roles, not each route's permission one by one.
- at: /uses
  why: 'Not declared because they have no card yet: the Platform''s web app and its client (web_interface/app.py, knovas_client.py) that wire the Builder; the Knovas Connector''s HTTP API (adapter and reader); the language-model API of the views assistant; GitHub (read through brain-runner).'
- at: /operations
  why: The page scripts (static/js/builder) are not read by the code reader (Python only); what they call is in the routes listed here.
