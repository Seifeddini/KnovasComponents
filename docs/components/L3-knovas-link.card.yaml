card: 2
id: L3-KNOVAS-LINK
name: Knovas Link
kind: code
owner: ROLE-ENGINE-OWNER
status: planned
level: 3
parent: L2-CONNECTION
source_paths:
- KnovasLink/src/knovas_link
- KnovasLink/contracts/codes.json
- KnovasLink/contracts/contracts.lock
- KnovasLink/contracts/job-result.schema.json
- KnovasLink/contracts/job.schema.json
- KnovasLink/contracts/local-api.md
- KnovasLink/contracts/stream-message.schema.json
- KnovasLink/contracts/v2/codes.json
- KnovasLink/contracts/v2/contracts.lock
- KnovasLink/contracts/v2/declaration.schema.json
- KnovasLink/contracts/v2/job.schema.json
- KnovasLink/contracts/v2/permit-keys.schema.json
- KnovasLink/contracts/v2/permit.schema.json
- KnovasLink/contracts/v2/result.schema.json
- KnovasLink/contracts/v2/site.schema.json
- KnovasLink/contracts/v2/stream-message.schema.json
- KnovasLink/Dockerfile
- KnovasLink/pyproject.toml
- KnovasLink/requirements.txt
purpose: The one program at a company's site that talks to Knovas, outwards only, so that the site's other components
  reach the Platform and the Brain only through its local API.
responsible_for:
- id: L3-KNOVAS-LINK/R-1
  statement: The site's identity - its key (made on site, never sent), the enrolment with the Platform and the site's own
    client certificate.
  code:
  - KnovasLink/src/knovas_link/identity.py
  - KnovasLink/src/knovas_link/certificate.py
  - KnovasLink/src/knovas_link/link.py
- id: L3-KNOVAS-LINK/R-2
  statement: The control plane with the Platform (heartbeat with the site's telemetry, configuration, package, commands,
    reports) for itself and for the components behind it.
  code:
  - KnovasLink/src/knovas_link/link.py
  - KnovasLink/src/knovas_link/platform_client.py
  - KnovasLink/src/knovas_link/telemetry.py
- id: L3-KNOVAS-LINK/R-3
  statement: The work channel - claiming the Brain's jobs for the site's sources and carrying them, their parts and
    their results between the Brain and the component that serves the source; and the probes.
  code:
  - KnovasLink/src/knovas_link/jobs.py
  - KnovasLink/src/knovas_link/brain_client.py
- id: L3-KNOVAS-LINK/R-4
  statement: The local API for the site's components, a token per component, and the relay of their Brain calls on an
    allow-list.
  code:
  - KnovasLink/src/knovas_link/local_api.py
  - KnovasLink/src/knovas_link/registry.py
  - KnovasLink/src/knovas_link/relay.py
- id: L3-KNOVAS-LINK/R-5
  statement: The shared contract files it is built against (job, result and stream schemas, codes, local API), pinned
    by contracts.lock.
  code:
  - KnovasLink/src/knovas_link/contracts.py
  - KnovasLink/contracts/contracts.lock
- id: L3-KNOVAS-LINK/R-6
  statement: Connector protocol 2.0 (draft), only while LINK_PROTOCOL_V2 is on - the site declaration to the Brain,
    the pinned permit keys, the permit checks before an act reaches its connector, the used-permit store with the
    first result for a repeat, the site's write log, and the routing of the v2 jobs to the connector that declared
    the action.
  code:
  - KnovasLink/src/knovas_link/protocol_v2.py
  - KnovasLink/src/knovas_link/permits.py
  - KnovasLink/src/knovas_link/write_path.py
  - KnovasLink/src/knovas_link/jobs.py
  - KnovasLink/contracts/v2/contracts.lock
not_responsible_for:
- Reading a source; that is a component's job (today the sync component).
- Holding a source's credential; it stays in the component's environment.
- Signing the site's certificate; a Knovas admin signs it and the Builder records it.
terms:
- site (one machine at a company, one Docker network)
- component (a program beside Link that reads a source)
- work channel (the long-poll on which the Brain hands out jobs)
- lease (the claim's token, sent back with every part and result)
operations:
- id: local.register
  name: POST /local/v1/register - a component says its kind, version, capabilities and job kinds
  entrance: http
  ref: POST /local/v1/register
- id: local.heartbeat
  name: POST /local/v1/heartbeat - a component's heartbeat; the Platform's commands come back
  entrance: http
  ref: POST /local/v1/heartbeat
- id: local.command-done
  name: POST /local/v1/commands/{command_id}/done
  entrance: http
  ref: POST /local/v1/commands/{command_id}/done
- id: local.config
  name: GET /local/v1/config
  entrance: http
  ref: GET /local/v1/config
- id: local.package
  name: GET /local/v1/package
  entrance: http
  ref: GET /local/v1/package
- id: local.ping
  name: GET /local/v1/ping
  entrance: http
  ref: GET /local/v1/ping
- id: local.jobs
  name: GET /local/v1/jobs?wait=0..25 - a component's long-poll for its next job
  entrance: http
  ref: GET /local/v1/jobs
- id: local.job-part
  name: POST /local/v1/jobs/{job_id}/part?n=N - one part of a fetch
  entrance: http
  ref: POST /local/v1/jobs/{job_id}/part
- id: local.job-result
  name: POST /local/v1/jobs/{job_id}/result
  entrance: http
  ref: POST /local/v1/jobs/{job_id}/result
- id: local.brain-relay
  name: ANY /local/v1/brain/{path} - a component's Brain call, relayed
  entrance: http
  ref: /local/v1/brain/{path}
- id: local.report
  name: POST /local/v1/report/{kind} - runs, events or checks of a component
  entrance: http
  ref: POST /local/v1/report/{kind}
- id: cli.knovas_link.__main__
  name: python -m knovas_link - start Link (the image's entry point)
  entrance: cli
  ref: python -m knovas_link
- id: certificate-request
  name: python -m knovas_link certificate-request - print the site's certificate request
  entrance: cli
  ref: python -m knovas_link certificate-request
- id: certificate-fingerprint
  name: python -m knovas_link certificate-fingerprint - print the request's public-key fingerprint
  entrance: cli
  ref: python -m knovas_link certificate-fingerprint
- id: install-certificate
  name: python -m knovas_link install-certificate [FILE|-] - install the certificate Knovas signed
  entrance: cli
  ref: python -m knovas_link install-certificate
- id: work-channel
  name: The work channel - a long-poll claiming the Brain's jobs for the site's sources
  entrance: queue
  ref: KnovasLink/src/knovas_link/jobs.py#WorkChannel.run
- id: heartbeat-loop
  name: The heartbeat to the Platform, every LINK_HEARTBEAT_SECONDS
  entrance: job
  ref: KnovasLink/src/knovas_link/link.py#Link._control_loop
- id: probe-loop
  name: The probe of the work channel, every LINK_PROBE_SECONDS and on the Platform's check command
  entrance: job
  ref: KnovasLink/src/knovas_link/link.py#Link._probe_loop
contract:
  '*':
    needs:
    - id: L3-KNOVAS-LINK/*/N-1
      statement: Every local API call carries Authorization Bearer with the token Link wrote for the component and
        X-Component with the component's name; otherwise 401 unknown_component or bad_token, answered as
        {error, message}.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_every_endpoint_needs_the_token_and_the_name
    always:
    - id: L3-KNOVAS-LINK/*/A-1
      statement: Logs carry codes, counts and durations only - never a path, a document's name, a token, a key or a
        certificate - and there is no access log.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_logs_carry_no_token_key_or_certificate
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_relayed_path_or_query_never_reaches_a_log_line
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_the_heartbeat_carries_codes_and_counts_never_a_name
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_logs_carry_no_permit_token_or_value
    - id: L3-KNOVAS-LINK/*/A-2
      statement: Link does not start when a contract file it uses does not match contracts.lock (and, with
        LINK_PROTOCOL_V2 on, a v2 contract file its own lock).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_contracts_must_match_their_lock
      - kind: test
        ref: KnovasLink/tests/test_contracts.py
        checks:
        - test_contracts_lock_matches_the_files
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_link_refuses_to_start_with_v2_on_when_a_v2_contract_is_stale
    - id: L3-KNOVAS-LINK/*/A-3
      statement: Link's code, image and README name no client (no tenant, company, repository, mapping or type of a
        client's package).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_generic.py
        checks:
        - test_link_names_no_client
    limits:
    - id: L3-KNOVAS-LINK/*/L-1
      statement: A JSON body of the local API is at most 256 KiB (else 400 bad_field); the local API listens on port
        8460 on the site's internal network, with no published port.
      risk_class: standard
  local.register:
    needs:
    - id: L3-KNOVAS-LINK/local.register/N-1
      statement: The body names the caller's own name as component, a kind and a version of the contract's patterns,
        at most 30 capabilities and 10 job kinds as codes; otherwise 400 bad_field.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_register_refuses_a_bad_field
    promises:
    - id: L3-KNOVAS-LINK/local.register/P-1
      statement: Answers the sources the Platform assigned to that component's name (workspace, key, kind, access,
        settings, fetch, and since protocol 1.2 auto_apply, false unless the Platform says true), never a credential.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_register_answers_the_sources_assigned_to_the_name_without_credentials
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_a_source_s_automatic_apply_reaches_its_component
    - id: L3-KNOVAS-LINK/local.register/P-2
      statement: A later registration replaces the earlier one; a job kind other than fetch, write and probe is
        ignored.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_a_later_registration_replaces_the_earlier_and_unknown_job_kinds_are_ignored
    - id: L3-KNOVAS-LINK/local.register/P-3
      statement: With LINK_PROTOCOL_V2 on, a registration may carry a connector declaration (declaration.schema.json;
        400 bad_field otherwise); only then do the v2 job kinds count, and Link declares its site to the Brain again.
        With the switch off a declaration is ignored.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_with_the_switch_off_a_v2_job_is_refused_and_a_declaration_is_ignored
        - test_link_declares_its_site_with_each_connectors_declaration_and_its_sources_of_that_kind
    limits:
    - id: L3-KNOVAS-LINK/local.register/L-1
      statement: Before Link has any configuration from the Platform the answer is 503 unreachable.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_register_without_any_configuration_is_unreachable
  local.heartbeat:
    needs:
    - id: L3-KNOVAS-LINK/local.heartbeat/N-1
      statement: state is online or degraded; lag_seconds and open_errors, when given, are whole numbers; otherwise 400
        bad_field.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_heartbeat_refuses_a_bad_field
    promises:
    - id: L3-KNOVAS-LINK/local.heartbeat/P-1
      statement: Answers paused, schedule and the Platform's commands for that component, each delivered once; Link
        keeps the commands addressed to itself.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_commands_fan_out_to_their_component_once_and_link_keeps_its_own
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_the_platforms_pause_and_schedule_reach_the_components
    - id: L3-KNOVAS-LINK/local.heartbeat/P-2
      statement: Protocol 1.2 - where the Platform names a component's own pause and schedule (components), the
        component's heartbeat and configuration answer with that schedule, paused when the site or the component is;
        for a component it names none for, Link's own as before.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_a_components_own_pause_and_schedule_reach_it_alone
    - id: L3-KNOVAS-LINK/local.heartbeat/P-3
      statement: Protocol 1.2 - a component's sync status per source (synced and planned commit, times, up to 10 codes,
        the last apply's counts) is kept for the component's own sources only and passed on in Link's site.sources; a
        field outside the contract is dropped, and an entry shaped like a name or free text refuses the beat (400
        bad_field) and keeps nothing.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_a_components_sync_status_travels_in_links_heartbeat_for_its_own_sources_only
        - test_a_sync_status_shaped_like_a_name_or_free_text_is_refused
  local.command-done:
    needs:
    - id: L3-KNOVAS-LINK/local.command-done/N-1
      statement: result is ok, failed or refused, and the command was delivered to this component; otherwise 400
        bad_field or 404 unknown_command.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_a_component_reports_its_command_done_through_link
    promises:
    - id: L3-KNOVAS-LINK/local.command-done/P-1
      statement: Passed to the Platform as the component's (X-Sub-Component), and the Platform's answer comes back as
        it gave it.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_a_component_reports_its_command_done_through_link
    limits:
    - id: L3-KNOVAS-LINK/local.command-done/L-1
      statement: When the Platform does not answer, 503 unreachable, and the command stays open.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_command_done_while_the_platform_is_away_is_unreachable_and_stays_open
  local.config:
    promises:
    - id: L3-KNOVAS-LINK/local.config/P-1
      statement: Protocol v1's configuration limited to the component's own sources and their mappings; its brain_url
        is Link's relay, the only way a component reaches the Brain.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_config_is_limited_to_the_components_sources_and_points_at_links_relay
  local.package:
    promises:
    - id: L3-KNOVAS-LINK/local.package/P-1
      statement: The Platform's package limited to the workspaces of the component's sources, kept for when the
        Platform is away.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_package_is_limited_to_the_components_workspaces_and_cached
    limits:
    - id: L3-KNOVAS-LINK/local.package/L-1
      statement: Without a package ever read and with the Platform away, 503 unreachable.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_package_never_had_and_platform_away_is_unreachable
  local.ping:
    promises:
    - id: L3-KNOVAS-LINK/local.ping/P-1
      statement: Answers Link's version, certificate (present or waiting) and work channel state, and never calls
        Knovas.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_ping_never_calls_knovas
  local.jobs:
    needs:
    - id: L3-KNOVAS-LINK/local.jobs/N-1
      statement: wait is whole seconds; otherwise 400 bad_field. The component registered the job kind.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_jobs_refuses_a_wait_that_is_not_whole_seconds
        - test_a_component_that_is_not_registered_gets_no_job
    promises:
    - id: L3-KNOVAS-LINK/local.jobs/P-1
      statement: The next job for a source this component serves, unchanged and without the lease, or 204 when none
        came within the wait.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_job_goes_to_the_component_that_serves_its_source_unchanged_and_without_the_lease
    limits:
    - id: L3-KNOVAS-LINK/local.jobs/L-1
      statement: The wait is at most 25 seconds; a longer one is cut to 25.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_local_api.py
        checks:
        - test_jobs_wait_is_whole_seconds_up_to_25
  local.job-part:
    needs:
    - id: L3-KNOVAS-LINK/local.job-part/N-1
      statement: The caller holds the job (handed to it, no outcome yet), else 409 lease_lost; the job is a fetch; n
        counts from 0 up by one; the part is not empty.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_job_another_component_holds_is_not_the_callers
        - test_a_part_for_a_write_is_refused_and_the_write_goes_on
        - test_a_refused_part_ends_the_fetch
    promises:
    - id: L3-KNOVAS-LINK/local.job-part/P-1
      statement: Each part is streamed through to the Brain in order with the claim's lease, never held whole in memory
        or on disk.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_parts_arrive_in_order_unchanged_and_the_result_after_them
        - test_a_part_is_streamed_through_not_held_whole
    - id: L3-KNOVAS-LINK/local.job-part/P-2
      statement: A part Link refuses, or one the Brain does not take or cannot be reached for, ends the fetch - Link
        answers it failed part_not_accepted and relays nothing more of it.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_refused_part_ends_the_fetch
        - test_a_gap_after_a_good_part_ends_the_fetch
        - test_a_part_knovas_does_not_take_ends_the_fetch_part_not_accepted
        - test_a_part_while_secure_api_is_away_ends_the_fetch_part_not_accepted
    limits:
    - id: L3-KNOVAS-LINK/local.job-part/L-1
      statement: A part is at most 4 MiB (413); 30 s to connect, 60 s to read and to write the part to the Brain.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_refused_part_ends_the_fetch
  local.job-result:
    needs:
    - id: L3-KNOVAS-LINK/local.job-result/N-1
      statement: The caller holds the job, else 409 lease_lost; the result validates against job-result.schema.json,
        else 400 bad_field and the job stays open.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_result_that_breaks_the_contract_is_refused_and_the_job_stays_open
    promises:
    - id: L3-KNOVAS-LINK/local.job-result/P-1
      statement: The result is passed to the Brain unchanged with the claim's lease, after the job's parts; then Link
        forgets the job.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_parts_arrive_in_order_unchanged_and_the_result_after_them
        - test_link_forgets_every_job_once_it_has_its_outcome
    - id: L3-KNOVAS-LINK/local.job-result/P-2
      statement: A result that comes after the job's deadline or after another claim of it is refused 409 lease_lost;
        the job then has Link's own answer (unreachable) or the newer claim's.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_silent_past_the_deadline_is_unreachable_and_the_late_answer_lease_lost
        - test_a_late_result_after_another_claim_is_refused_and_the_rest_dropped
        - test_a_job_claimed_again_after_its_lease_ran_out_refuses_the_first_claims_late_result
  local.brain-relay:
    needs:
    - id: L3-KNOVAS-LINK/local.brain-relay/N-1
      statement: The path is on the allow-list - everything below secured/graph/, and exactly secured/
        init_document_transmission, transmit_document_part, delete_information_object, documents,
        documents/source_ref and folder_rules - with no encoded separator or dot segment; otherwise 403 not_relayed and
        nothing reaches the Brain.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_allowed_paths
        - test_everything_else_is_not_relayed
        - test_a_route_off_the_list_is_403_and_never_reaches_secure_api
        - test_a_doubled_slash_after_the_prefix_is_not_relayed
    - id: L3-KNOVAS-LINK/local.brain-relay/N-2
      statement: Link has its own certificate; while it waits for it, 503 waiting_for_certificate.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_while_waiting_for_the_certificate_nothing_is_relayed
    promises:
    - id: L3-KNOVAS-LINK/local.brain-relay/P-1
      statement: Method, path (as sent), query and body reach the Brain with the site's certificate, and the Brain's
        answer comes back unchanged; the component's token is never passed on; a call is never retried.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_relayed_call_reaches_secure_api_unchanged_and_its_answer_comes_back_unchanged
        - test_every_method_is_relayed
        - test_secure_apis_error_comes_back_unchanged
        - test_an_encoded_path_reaches_secure_api_as_it_was_sent
        - test_a_relayed_call_is_never_retried
    limits:
    - id: L3-KNOVAS-LINK/local.brain-relay/L-1
      statement: When the Brain does not answer, 503 unreachable, not retried; 30 s to connect, 300 s to read and to
        write.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_secure_api_away_is_unreachable_and_not_retried
    - id: L3-KNOVAS-LINK/local.brain-relay/L-2
      statement: Every method below secured/graph/ passes (accepted as a known limit until the first external
        customer, connector protocol v1.1).
      risk_class: critical
  local.report:
    needs:
    - id: L3-KNOVAS-LINK/local.report/N-1
      statement: kind is runs, events or checks (else 404); the body holds only codes and counts as the Platform takes
        them - no key shaped like a file name, at most 100 events or 200 checks; otherwise 400 bad_field.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_report_with_anything_but_codes_and_counts_is_refused
        - test_an_unknown_report_is_404
        - test_links_report_rules_are_the_platforms
    - id: L3-KNOVAS-LINK/local.report/N-2
      statement: A run names only a command delivered to the reporting component.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_run_may_name_only_a_command_delivered_to_its_component
    promises:
    - id: L3-KNOVAS-LINK/local.report/P-1
      statement: The report is passed to the Platform unchanged as the component's (X-Sub-Component).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_report_is_passed_on_unchanged_as_a_sub_component
    limits:
    - id: L3-KNOVAS-LINK/local.report/L-1
      statement: When the Platform does not answer, 503 unreachable.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_relay.py
        checks:
        - test_a_report_while_the_platform_is_away_is_unreachable
  cli.knovas_link.__main__:
    needs:
    - id: L3-KNOVAS-LINK/cli.knovas_link.__main__/N-1
      statement: Settings come from the environment only; LINK_PLATFORM_URL is an http(s) address; LINK_ENROL_TOKEN is
        set for the first start; otherwise Link does not start.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_settings_come_from_the_environment_only
        - test_settings_refuse_a_missing_platform_url
        - test_without_a_token_and_not_enrolled_link_does_not_start
    promises:
    - id: L3-KNOVAS-LINK/cli.knovas_link.__main__/P-1
      statement: The first start makes a key on site and enrols as kind knovas_link; a restart with the same token does
        not enrol again, a new token («Token erneuern») does.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_first_start_enrols_as_knovas_link_with_a_key_made_on_site
        - test_a_restart_with_the_same_token_does_not_enrol_again
        - test_a_new_token_enrols_again
    - id: L3-KNOVAS-LINK/cli.knovas_link.__main__/P-2
      statement: A refused, expired or unreachable enrolment keeps nothing new; an earlier key stays with its
        certificate.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_a_refused_token_keeps_nothing
        - test_a_refused_renewal_keeps_the_old_key_with_its_certificate
        - test_an_unreachable_platform_at_first_start_is_a_clear_refusal
    - id: L3-KNOVAS-LINK/cli.knovas_link.__main__/P-3
      statement: Link writes one random token per component to /link/NAME/token and keeps a token file already there,
        so a restart locks no component out.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_link_writes_a_token_per_component_and_keeps_it_across_restarts
    - id: L3-KNOVAS-LINK/cli.knovas_link.__main__/P-4
      statement: The tenant's own certificate (LINK_BRAIN_CERT, LINK_BRAIN_KEY) is used only with
        LINK_TEST_ONLY_SHARED_CERTIFICATE=true and while the Platform issued none, with a warning at start and in every
        heartbeat; an issued certificate wins.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_the_tenant_certificate_is_honoured_only_behind_the_test_switch
        - test_the_test_only_shared_certificate_warns_at_start_and_in_every_heartbeat
        - test_an_issued_certificate_wins_over_the_shared_one
  certificate-request:
    needs:
    - id: L3-KNOVAS-LINK/certificate-request/N-1
      statement: Link has enrolled, so its key exists; otherwise it exits 1 with certificate.not_enrolled.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_commands.py
        checks:
        - test_without_an_enrolment_there_is_no_request
    promises:
    - id: L3-KNOVAS-LINK/certificate-request/P-1
      statement: Prints a PEM request made from the stored key, its subject the common name only; asking again gives a
        request for the same key; the key is never printed.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_commands.py
        checks:
        - test_the_request_is_made_from_the_stored_key_and_round_trips_through_a_test_ca
        - test_asking_again_gives_a_request_for_the_same_key
  certificate-fingerprint:
    promises:
    - id: L3-KNOVAS-LINK/certificate-fingerprint/P-1
      statement: Prints the SHA-256 of the request's public key, the fingerprint the Platform recorded at enrolment;
        none without an enrolment.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_binding.py
        checks:
        - TestTheFingerprint::test_it_is_the_sha256_of_the_request_s_public_key
        - TestTheFingerprint::test_without_an_enrolment_there_is_none
        - TestTheFingerprint::test_another_key_has_another
  install-certificate:
    needs:
    - id: L3-KNOVAS-LINK/install-certificate/N-1
      statement: The certificate is for the stored key, valid now, for client authentication, signed by the client CA
        and for the site's tenant (CA and tenant from the enrolment answer, else LINK_CLIENT_CA and LINK_TENANT, which
        win); otherwise it exits 1 with a certificate.* code from codes.json and writes nothing.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_commands.py
        checks:
        - test_a_certificate_link_cannot_use_is_refused_and_nothing_is_written
        - test_installing_before_enrolment_is_refused
      - kind: test
        ref: KnovasLink/tests/test_certificate_binding.py
        checks:
        - TestTheReproduction::test_a_certificate_for_another_tenant_is_refused
        - TestTheReproduction::test_a_certificate_of_another_ca_is_refused
        - TestTheReproduction::test_a_ca_with_the_same_name_but_another_key_is_refused
        - TestTheReproduction::test_a_certificate_that_names_no_single_tenant_is_refused
        - TestWithoutTheSiteSConfiguration::test_without_a_client_ca_nothing_is_installed
        - TestWithoutTheSiteSConfiguration::test_without_a_tenant_nothing_is_installed
        - TestWithoutTheSiteSConfiguration::test_the_site_s_tenant_setting_wins
    promises:
    - id: L3-KNOVAS-LINK/install-certificate/P-1
      statement: Writes component.crt with its chain, readable by Link's user only, from a file or standard input, and
        prints the serial; a refusal leaves the certificate installed before.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_commands.py
        checks:
        - test_the_certificate_is_written_private_with_its_chain_from_a_file_or_standard_input
        - test_a_refused_certificate_leaves_the_one_installed_before
    - id: L3-KNOVAS-LINK/install-certificate/P-2
      statement: A Link waiting for its certificate takes it at its next heartbeat without a restart; one that replaces
        a certificate in use is taken at the next start.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_certificate_commands.py
        checks:
        - test_a_running_link_leaves_waiting_for_certificate_at_its_next_heartbeat
        - test_replacing_a_certificate_says_that_link_takes_it_at_its_next_start
        - test_a_link_that_uses_its_certificate_does_not_swap_it_while_running
    limits:
    - id: L3-KNOVAS-LINK/install-certificate/L-1
      statement: The input is at most 256 KiB.
      risk_class: low
  work-channel:
    needs:
    - id: L3-KNOVAS-LINK/work-channel/N-1
      statement: Link has its own certificate; while it waits for it, it claims nothing and sends no probe.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_waiting_for_the_certificate_claims_nothing
      - kind: test
        ref: KnovasLink/tests/test_enrolment.py
        checks:
        - test_without_a_certificate_link_runs_its_control_plane_but_claims_nothing
    promises:
    - id: L3-KNOVAS-LINK/work-channel/P-1
      statement: A claimed job goes to the component that serves its source and named its kind; where none does, Link
        answers itself - unsupported (no component), unreachable (deadline passed), refused fetch_disabled or
        write_disabled (the source's switch is off), failed invalid_job (the job does not validate).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_no_component_for_the_kind_is_unsupported
        - test_a_job_nobody_takes_is_unreachable_at_its_deadline
        - test_a_job_whose_deadline_passed_before_the_claim_is_unreachable
        - test_fetching_switched_off_is_refused_fetch_disabled
        - test_a_write_to_a_source_that_only_reads_is_refused_write_disabled
        - test_a_job_that_breaks_the_contract_is_answered_failed
        - test_a_job_with_a_lease_unfit_for_a_header_is_not_taken
    - id: L3-KNOVAS-LINK/work-channel/P-2
      statement: The channel comes back after the Brain was away, and a 429 waits out Retry-After before the next
        claim.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_the_channel_goes_down_and_comes_back
        - test_the_waiter_cap_is_respected_and_the_channel_comes_back
    - id: L3-KNOVAS-LINK/work-channel/P-3
      statement: 'Protocol 2.0 (LINK_PROTOCOL_V2): a v2 job (preview, act, reread, review_outcome, unstage) goes only
        to the connector serving its source that declared the source''s kind, the action and its staging; otherwise
        Link answers unsupported, refused action_not_declared or staging_unsupported, refused write_disabled for an
        act or unstage on a source that only reads, failed invalid_job. With the switch off: unsupported
        protocol_unsupported. A 1.x job goes its 1.x way either way.'
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_a_preview_reaches_the_connector_that_declared_the_action_and_its_answer_goes_back
        - test_an_undeclared_action_is_refused_before_any_permit_check
        - test_a_source_that_only_reads_refuses_an_act_write_disabled
        - test_a_source_of_another_kind_than_the_connector_declared_is_unsupported
        - test_a_v1_job_still_goes_its_1x_way_with_the_switch_on
        - test_with_the_switch_off_a_v2_job_is_refused_and_a_declaration_is_ignored
    - id: L3-KNOVAS-LINK/work-channel/P-4
      statement: An act reaches its connector only when every step's permit passes Link's checks in the Alloy model's
        order (LinkVerifyMechanism) - permit_missing, permit_bad_signature (canonical token, a pinned key whose
        window holds the permit's iat, at most 3600 s, signature), permit_wrong_site (this certificate's serial),
        permit_mismatch (tenant, source, action, target and parameters, expected version, staging), a used permit
        answered with its first result (repeat true, permit_used, also after expiry), permit_expired; nothing is
        written on a refusal, and the verdicts agree with the connector kit's reference.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_a_refused_permit_writes_nothing_and_is_logged
        - test_an_act_under_a_valid_permit_is_written_once_and_a_repeat_gets_the_first_result
        - test_a_repeat_after_the_permit_expired_and_its_key_retired_still_gets_the_first_result
        - test_links_verdicts_agree_with_the_kits_reference
    - id: L3-KNOVAS-LINK/work-channel/P-5
      statement: Every delivery that carried a permit is a line of the site's write log (accepted, executed, refused,
        repeated) and an act's first result is kept under each permit id, both written to Link's volume (0600)
        before the job goes on; when that fails nothing goes on (failed write_log_unavailable).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_an_act_under_a_valid_permit_is_written_once_and_a_repeat_gets_the_first_result
        - test_when_the_write_log_cannot_be_written_nothing_goes_on
    - id: L3-KNOVAS-LINK/work-channel/P-6
      statement: With LINK_PROTOCOL_V2 on, Link pins the Brain's permit keys from GET /secured/connector/v2/permit-keys
        only (keeping a key the Brain dropped until 30 days after its not_after) and declares its site with PUT
        /secured/connector/v2/site, listing per connector only the assigned sources of the kind it declared.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_protocol_v2.py
        checks:
        - test_link_pins_the_brains_permit_keys_on_its_volume
        - test_link_declares_its_site_with_each_connectors_declaration_and_its_sources_of_that_kind
    limits:
    - id: L3-KNOVAS-LINK/work-channel/L-2
      statement: Protocol 2.0 is a draft behind LINK_PROTOCOL_V2, off by default; the declarations do not reach the
        Platform's heartbeat yet (Phase C, C-1).
      risk_class: standard
    - id: L3-KNOVAS-LINK/work-channel/L-1
      statement: One long-poll of 25 s for at most 32 of the site's sources; backoff from 1 s doubling to 60 s.
      risk_class: low
  heartbeat-loop:
    promises:
    - id: L3-KNOVAS-LINK/heartbeat-loop/P-1
      statement: Every beat is protocol v1's heartbeat plus the site object - certificate, work channel, probe,
        components, sources' last good read and last run, job counts since the last beat taken - with codes, counts,
        versions and times only; a value nobody measured is null.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_the_heartbeat_is_protocol_v1_plus_the_site_object
        - test_a_working_site_reports_online_with_its_probe_components_and_job_counts
        - test_job_counts_are_those_since_the_last_beat_that_was_taken
        - test_sources_show_their_last_good_read_and_last_run
        - test_the_heartbeat_carries_codes_and_counts_never_a_name
    - id: L3-KNOVAS-LINK/heartbeat-loop/P-2
      statement: The site is online only with a certificate and a connected channel; a component silent for 120 s is
        offline, one that never beat unknown; waiting for the certificate is said.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_link_heartbeat.py
        checks:
        - test_a_component_that_fell_silent_is_offline_and_one_that_never_beat_is_unknown
        - test_while_waiting_for_the_certificate_the_heartbeat_says_so
    limits:
    - id: L3-KNOVAS-LINK/heartbeat-loop/L-1
      statement: LINK_HEARTBEAT_SECONDS 30 by default (1 to 3600); the configuration is read again every 10 beats.
      risk_class: low
  probe-loop:
    promises:
    - id: L3-KNOVAS-LINK/probe-loop/P-1
      statement: A probe goes round the work channel and each component that answers probes gets a local one; the round
        trip and each local ping are reported; the Platform's check command probes and reports done.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_probe_goes_round_the_channel_and_each_component_is_pinged_locally
        - test_the_platforms_check_command_probes_and_reports_done
    limits:
    - id: L3-KNOVAS-LINK/probe-loop/L-1
      statement: A probe that does not come round within 60 s is failed; a silent local probe (30 s) leaves the ping
        unknown; LINK_PROBE_SECONDS 300 by default (10 to 86400).
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasLink/tests/test_work_channel.py
        checks:
        - test_a_probe_that_does_not_come_round_is_failed
        - test_a_silent_local_probe_leaves_the_ping_unknown
uses:
- component: L2-BRAIN-BUILDER
  operations:
  - protocol-enrol
  - protocol-heartbeat
  - protocol-config
  - protocol-package
  - protocol-runs
  - protocol-command-done
  - protocol-events
  - protocol-checks
  expects:
  - L2-BRAIN-BUILDER/protocol-enrol/P-1
  - L2-BRAIN-BUILDER/protocol-heartbeat/P-1
  - L2-BRAIN-BUILDER/protocol-config/P-1
  - L2-BRAIN-BUILDER/protocol-runs/N-1
  method: connector protocol v1.1 from LINK_PLATFORM_URL (the control plane); reports of a component carry
    X-Sub-Component
  protocol: HTTPS, Bearer control token, client certificate once recorded
- component: L2-HOST-NGINX
  operations:
  - https-proxy
  expects:
  - L2-HOST-NGINX/https-proxy/P-1
  - L2-HOST-NGINX/https-proxy/P-2
  method: the control plane passes the host nginx terminator in front of the Platform
- component: EXT-BRAIN-API
  operations:
  - connector-jobs-claim
  - connector-job-part
  - connector-job-result
  - connector-probe
  - graph-routes
  - ingest-routes
  expects:
  - EXT-BRAIN-API/*/A-1
  - EXT-BRAIN-API/connector-jobs-claim/P-1
  - EXT-BRAIN-API/connector-job-part/P-1
  - EXT-BRAIN-API/connector-job-result/P-1
  - EXT-BRAIN-API/connector-probe/P-1
  - EXT-BRAIN-API/graph-routes/P-1
  - EXT-BRAIN-API/ingest-routes/P-1
  method: the brain_url of the enrolment answer, with the site's own client certificate
  protocol: HTTPS with mTLS
hides:
- The key size (RSA 3072) and the layout of the /data volume.
- The order in which held jobs are handed out within one component's queue.
- How many finished jobs Link remembers to answer a repeated claim (500).
decisions:
- id: DEC-0056
  statement: Every site's Link has its own certificate from Knovas's client CA (option A, A1); until it is installed
    Link claims no job, sends no probe and relays nothing.
- id: DEC-0062
  statement: Later the issuance job signs with the HSM-held client CA key; until then one Knovas admin confirms and
    signs.
- id: DEC-0040
  statement: The tenant's own certificate is only to test on one's own machine, never for a company.
risks:
- id: L3-KNOVAS-LINK/RISK-01
  statement: Jobs are not bound to one site - any certificate of the tenant that names the source can claim a fetch or
    write job; needed before a tenant has a second site.
  mitigation: Add a second site only after jobs name a certificate serial (README, "Not built yet").
- id: L3-KNOVAS-LINK/RISK-02
  statement: The relay passes every method below secured/graph/.
  mitigation: Accepted until the first external customer (connector protocol v1.1, "Sites and Knovas Link").
review:
- at: /parent
  why: L2-CONNECTION is the placement the connection-layer model proposes (a component of the Brain's side, with no
    card yet); the domain is confirmed by a person (Software Map K5).
- at: /owner
  why: Proposed owner; one role per component is confirmed by a person (Software Map K4).
- at: L3-KNOVAS-LINK/*/L-1
  why: No evidence; MAX_JSON_BYTES in local_api.py and the install package's compose file (builder/sites.py); no test
    sends a body over 256 KiB.
- at: L3-KNOVAS-LINK/local.brain-relay/L-2
  why: No evidence; a known limit stated in relay.py and the protocol document.
- at: L3-KNOVAS-LINK/install-certificate/L-1
  why: No evidence; MAX_INPUT_BYTES in certificate.py.
- at: L3-KNOVAS-LINK/work-channel/L-1
  why: No evidence for the numbers; WAIT_SECONDS, MAX_SOURCES and BACKOFF_MAX_SECONDS in jobs.py.
- at: L3-KNOVAS-LINK/heartbeat-loop/L-1
  why: No evidence for the numbers; settings.py and link.py (CONFIG_EVERY_BEATS).
- at: /operations
  why: The code reader sees only `python -m knovas_link` (its __main__ guard); the local API's routes (a Starlette route
    table with paths built from a constant), the three certificate commands (dispatched by argument) and the loops are
    listed by hand.
- at: L3-KNOVAS-LINK/work-channel/L-2
  why: No evidence; a known limit of the draft (FEAT-2026-11-10-write-back A-5, C-1).
- at: L3-KNOVAS-LINK/*/A-2
  why: Statement extended for the v2 contracts' own lock (A-5); a compatible addition, to be marked compatible by a
    person who reviews it.
