card: 2
id: L2-PLATFORM-ROLE-DATA
name: Rollendaten
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin_role_data.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_role_data.html
purpose: What a role may read (RB-5), on the Rollen page of the Platform's console - its folders and documents at the
  Core, the dry run before each change, four eyes, adopting an existing Core group, moving direct group grants into roles.
responsible_for:
- id: L2-PLATFORM-ROLE-DATA/R-1
  statement: 'The part «Darf lesen» shows the folder rules and own-rights documents naming the role''s Core group, read
    from the Core on every page (no copy kept), with «wirkt mit «Ein»» until the tenant is brokered; adds and removes a
    source, folder or document after a dry run of who gains and loses sight, through acl_change, planned again when
    carried out and only by an administrator; lets a role adopt an existing Core group (FU-45) and moves direct group
    grants into roles without changing anybody''s sight (FU-41).'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_role_data.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_role_data.html
not_responsible_for:
- The Rollen page, its other parts and routes (L2-PLATFORM-ROLES), which draws this card's part and answers its routes.
- The four-eyes path (run_guarded, the Freigaben page; L2-PLATFORM-ADMIN) and execute_acl_change (L2-PLATFORM-ACCESS),
  which hands this card its two actions.
- Whether the data hide anything; the Core decides, for the Platform's claims only under brokered (CR-R1 to CR-R3).
terms:
- 'dry run (Probelauf: what a change would do and who would gain or lose sight under «Ein»; it writes nothing)'
operations:
- id: http.POST.roles._role_id.data.preview
  name: 'POST /admin/roles/{role_id}/data/preview - the dry run of adding or removing a source, folder or document; writes nothing'
  entrance: http
  ref: POST /admin/roles/{role_id}/data/preview
- id: http.POST.roles._role_id.data.add
  name: 'POST /admin/roles/{role_id}/data/add - add a source, folder or document to the role: planned again, then acl_change'
  entrance: http
  ref: POST /admin/roles/{role_id}/data/add
- id: http.POST.roles._role_id.data.remove
  name: 'POST /admin/roles/{role_id}/data/remove - remove a source, folder or document from the role: planned again, then acl_change'
  entrance: http
  ref: POST /admin/roles/{role_id}/data/remove
- id: http.POST.roles._role_id.adopt.preview
  name: 'POST /admin/roles/{role_id}/adopt/preview - the dry run of adopting an existing Core group as the role''s group; writes nothing'
  entrance: http
  ref: POST /admin/roles/{role_id}/adopt/preview
- id: http.POST.roles._role_id.adopt
  name: 'POST /admin/roles/{role_id}/adopt - the role takes over an existing Core group; its previous group is deleted at the Core'
  entrance: http
  ref: POST /admin/roles/{role_id}/adopt
- id: http.POST.roles.direct-grants.preview
  name: 'POST /admin/roles/direct-grants/preview - the dry run of moving direct group grants into roles; writes nothing'
  entrance: http
  ref: POST /admin/roles/direct-grants/preview
- id: http.POST.roles.direct-grants.move
  name: 'POST /admin/roles/direct-grants/move - move direct group grants into roles, one role per group; nobody''s sight changes'
  entrance: http
  ref: POST /admin/roles/direct-grants/move
- id: call.web_interface.admin_role_data.attach_role_data_routes
  name: 'attach_role_data_routes - mounts the seven routes on the console''s blueprint behind the gate it is given'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_role_data.py#attach_role_data_routes
- id: call.web_interface.admin_role_data.role_data_part
  name: 'role_data_part - what the part «Darf lesen» shows for a role, read from the Core; writes nothing'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_role_data.py#role_data_part
- id: call.web_interface.admin_role_data.execute_role_data
  name: 'execute_role_data - carries out a role-data acl_change (role_data_add, role_data_remove)'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_role_data.py#execute_role_data
contract:
  http.POST.roles._role_id.data.preview:
    needs:
    - id: L2-PLATFORM-ROLE-DATA/http.POST.roles._role_id.data.preview/N-1
      statement: 'require_admin: signed out 302 to the sign-in, any other caller 403; then the form''s csrf_token (400), then the role (404); nothing changed, nothing sent to the Core.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_rb5_role_data_acceptance.py
        checks:
        - test_every_route_carries_the_console_admin_gate
        - test_a_form_without_the_token_or_with_a_wrong_one_is_refused_and_changes_nothing
        - test_an_unknown_or_malformed_role_is_404_and_nothing_is_sent
