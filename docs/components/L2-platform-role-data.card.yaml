uses:
- component: L2-PLATFORM-ADMIN
  operations:
  - call.web_interface.guarded.run_guarded
  expects: []
  method: 'imported: adding and removing data go acl_change through run_guarded'
  protocol: in-process call
- component: L2-BRAIN-BUILDER
  operations: []
  expects: []
  method: 'imported: builder.access.Tree, the group tree, for the dry runs'' reader closure'
  protocol: in-process call
- component: EXT-BRAIN-API
  operations:
  - access-routes
  expects:
  - EXT-BRAIN-API/access-routes/P-1
  method: 'through the Platform''s own client (client_factory): groups, folder rules, documents and a document''s access
    read on every page and dry run; one folder-rule or document-access write per carried-out change; a previous group
    deleted after an adopt; never acting_as'
  protocol: HTTPS with mTLS
hides:
- The German words of the part and its dry runs (templates/_role_data.html).
- How a dry run counts sight (builder.access.Tree, roles.active_claim_groups) and how many pages of the Core's list it
  walks.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
- at: /status
  why: Live or planned is not read from the code; the console is on main and runs where the Platform runs.
- at: /source_paths
  why: 'Split from L2-PLATFORM-ROLES when RB-5 was merged with RB-FIX-1 (2026-11-22, coordinator), the way RB-FIX-1 split
    Rollen and Agenten: with RB-5 the Rollen card was 33,953 tokens against 16,000. RB-5''s parts of the Rollen page moved
    to templates/_role_data.html, which admin_roles.html imports. The lines are new (never on the base): no aliases. The
    parent L1-WORKSPACE (KnowledgeBase) does not list this card yet.'
- at: L2-PLATFORM-ROLE-DATA/R-1
  why: 'RB-5 (work order docs/platform-mvp/work-orders/RB-5.md; coordinator: four eyes follow the existing approvals path
    and its bypass). No migration, no new guarded kind, no gate changed; identity/roles.py (no card) gained
    active_claim_groups and RoleStore.share.'
- at: /operations
  why: The code reader shows the routes without the prefix /admin (the blueprint is passed in); the refs name the
    served path.
