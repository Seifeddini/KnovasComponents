    promises:
    - id: L2-PLATFORM-ROLE-DATA/http.POST.roles._role_id.data.preview/P-1
      statement: 'Writes nothing. Names who gains and loses sight under «Ein» (open: everyone; else the holders of its groups and of groups above them), with counts and ids; a new rule keeps the governing groups. Warns walls-open, opens, already-read-in. Refused 400 before any write: Administration, no Core group, a bad op, kind or pointer, an unknown document, data not the role''s. A Core read that fails: 502.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_rb5_role_data_acceptance.py
        checks:
        - test_the_dry_run_of_a_walled_folder_names_who_gains_and_nobody_loses
        - test_a_group_above_the_folders_group_already_sees_it
        - test_a_new_folder_rule_keeps_the_groups_of_the_rule_that_governs_the_folder
        - test_what_the_dry_run_refuses
