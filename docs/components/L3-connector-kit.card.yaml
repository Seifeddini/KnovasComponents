# Component card (format 2) of L3-CONNECTOR-KIT; written for FEAT-2026-11-10-write-back Phase A (BET-2026-11-write-back
# WB-11, DEC-0068: the map grows per project). Edit this file, then `brain-runner card render`; the page beside it is
# generated.
card: 2
id: L3-CONNECTOR-KIT
name: Connector kit
kind: code
owner: ROLE-ENGINE-OWNER
status: planned
level: 3
parent: L2-CONNECTION
source_paths:
- KnovasConnectorKit/src/knovas_connector_kit
- KnovasConnectorKit/pyproject.toml
- KnovasConnectorKit/requirements.txt
purpose: The base every connector of protocol v2 is built on, and the conformance suite a connector package passes
  before its declaration may name a property, so that a new kind of source is one connector package and no change to
  the Brain, Knovas Link, the runner or the Platform.
responsible_for:
- id: L3-CONNECTOR-KIT/R-1
  statement: The protocol's v2 messages for a connector - a copy of Link's v2 contracts checked against their lock,
    canonical JSON, the parameter hash a permit binds, decoding and verifying permits.
  code:
  - KnovasConnectorKit/src/knovas_connector_kit/contracts.py
  - KnovasConnectorKit/src/knovas_connector_kit/canonical.py
  - KnovasConnectorKit/src/knovas_connector_kit/permits.py
- id: L3-CONNECTOR-KIT/R-2
  statement: The base class that answers a job - the job and the answer checked against the contract, each permit
    re-checked against its own step, an exception answered as failed internal and logged by its type only.
  code:
  - KnovasConnectorKit/src/knovas_connector_kit/connector.py
- id: L3-CONNECTOR-KIT/R-3
  statement: The conformance suite - seven properties on a connector's harness, with a reproducible report, and a
    reference of Link's permit checks (in the order of the Alloy model) that the suite plays Link with.
  code:
  - KnovasConnectorKit/src/knovas_connector_kit/conformance
  - KnovasConnectorKit/src/knovas_connector_kit/gate.py
- id: L3-CONNECTOR-KIT/R-4
  statement: A fake source of records and an example connector over it, the reference of a conformant connector.
  code:
  - KnovasConnectorKit/src/knovas_connector_kit/example.py
not_responsible_for:
- Reading or writing any real source; each connector package does (the GitHub connector in Phase C, Jira in Phase D).
- Checking permits at a site; Knovas Link does it with its own code (A-5). The kit's gate is a reference for tests.
- Signing permits; the Brain signs them. The kit's Signer serves only the suite and tests.
- Holding a credential; a connector keeps its source's credential at the site.
terms:
- connector (a program at the site that reads one kind of source and carries out the actions it declares)
- declaration (what a connector serves, reads and can carry out, and the conformance properties it passed)
- permit (a single-use, signed approval of one action, bound to tenant, site, source, action, parameters, version)
- harness (what a connector package gives the suite - a fresh connector over a source the suite may change)
operations:
- id: cli.knovas_connector_kit.conformance.__main__
  name: python -m knovas_connector_kit.conformance MODULE:FACTORY - run the suite on a connector's harness
  entrance: cli
  ref: knovas_connector_kit.conformance
contract:
  '*':
    always:
    - id: L3-CONNECTOR-KIT/*/A-1
      statement: The kit names no source kind, no source operation and no source field (SPEC-write-back-16).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasConnectorKit/tests/test_generic.py
        checks:
        - test_the_kit_names_no_source_kind
    - id: L3-CONNECTOR-KIT/*/A-2
      statement: Its v2 contracts are Link's, byte for byte, and are used only while they match their lock.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasConnectorKit/tests/test_contracts_and_permits.py
        checks:
        - test_the_kits_contracts_are_links_v2_contracts_byte_for_byte
    - id: L3-CONNECTOR-KIT/*/A-3
      statement: A permit verifies only when it is the one canonical encoding, names EdDSA and a pinned key whose
        window holds the permit's iat, lives at most 3600 seconds, and its signature verifies; else
        permit_bad_signature.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasConnectorKit/tests/test_contracts_and_permits.py
        checks:
        - test_a_key_is_checked_at_the_permits_iat_not_at_the_verifiers_clock
        - test_a_token_has_one_encoding_and_a_changed_payload_fails
        - test_the_examples_permits_verify_and_bind_their_steps
  cli.knovas_connector_kit.conformance.__main__:
    needs:
    - id: L3-CONNECTOR-KIT/cli.knovas_connector_kit.conformance.__main__/N-1
      statement: A harness factory that gives a fresh connector over a source the suite may change, as
        conformance/harness.py describes.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasConnectorKit/tests/test_conformance_suite.py
        checks:
        - test_the_example_connector_passes_every_property
    promises:
    - id: L3-CONNECTOR-KIT/cli.knovas_connector_kit.conformance.__main__/P-1
      statement: Reports each of the seven properties as passed, failed (with a code, never a value) or not
        applicable, with the report's SHA-256, and exits 1 when one failed; a connector that breaks one property
        fails exactly that one.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasConnectorKit/tests/test_conformance_suite.py
        checks:
        - test_the_suite_fails_the_mutant_on_its_property_only
        - test_the_report_is_reproducible
        - test_a_read_only_connector_is_not_offered_for_writing
    limits:
    - id: L3-CONNECTOR-KIT/cli.knovas_connector_kit.conformance.__main__/L-1
      statement: The report is the connector package's own statement; nothing signs it yet (an open question of the
        protocol text).
      risk_class: standard
uses: []
hides:
- The fake source's version numbering and its review queue.
decisions:
- id: DEC-0071
  statement: Every write is a typed action carried out by a connector at the site through one generic protocol v2;
    the protocol names no source kind.
review:
- at: /parent
  why: Placed under L2-CONNECTION like Link and the sync component; the domain is confirmed by a person (Software Map
    K5).
- at: /owner
  why: Proposed owner; one role per component is confirmed by a person (Software Map K4).
- at: /operations
  why: The code reader sees only the suite's command line; the base class, the permit functions and the reference
    gate become operations of their own when a connector package (the GitHub connector, Phase C) imports them.
- at: L3-CONNECTOR-KIT/cli.knovas_connector_kit.conformance.__main__/L-1
  why: No evidence; a known limit stated in the protocol text's open questions.
