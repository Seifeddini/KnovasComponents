card: 2
id: L2-PLATFORM-ACCESS-CHECK
name: Zugriff prüfen
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin_access.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_access.html
purpose: The console's page «Zugriff» (A-05, A-06) - «Was sieht …?» - where an administrator asks what a person, a role,
  the Knovas Assistent or an external agent reads, whether it may read one document, and what a search finds as it; and
  where the enforcement position is shown and one administrator switches it.
responsible_for:
- id: L2-PLATFORM-ACCESS-CHECK/R-1
  statement: '«Was sieht …?» (PMVP-41): for a person, a role, the assistant (for a person) or an external agent, with the
    groups its claim would carry (RB-2, RB-6), the folder rules and own-rights documents it reads (computed, at most 25
    rows, the rest a paged list), yes or no for one document with the reason, and a search as it, names only. Computed
    before «Ein»; once the client reports brokered, the yes or no and the search are the Core''s own, asked as it. Reads
    per thing, writes nothing but one audit row by id.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_access.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_access.html
- id: L2-PLATFORM-ACCESS-CHECK/R-2
  statement: 'The enforcement position (PMVP-42): one sentence for what the Core reports (rbac_posture, CR-R1a) - «Ein»,
    «Aus», teilweise or unbekannt - and, while it reports not_ready codes, why «Ein» is not possible yet in the page''s
    words; one administrator switches to the other position after a confirmation (set_rbac_posture brokered or
    disabled, CR-R8), the Core decides, its refusals in the page''s words; disabled, «wartet auf Knovas», until the Core
    offers the switch. No approvals, no record of rights runs; audit rows by id.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_access.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_access.html
not_responsible_for:
- The console's blueprint, its role gates and admin.css (L2-PLATFORM-ADMIN); the menu entry «Zugriff» (app.py, no card).
- The readers of the Core's groups, folder rules and documents and the reader closure (L2-PLATFORM-ROLE-DATA, imported).
- Who may read what; the Core decides, for the Platform's claims only under brokered (CR-R1, CR-R1a).
- Whether «Ein» is allowed - the Core's own preconditions (a broker key, the backfill, two green rights runs; CR-R7, CR-R8).
terms:
- 'X (the person, role or agent a question is about; its groups are those its signed claim would carry)'
operations:
- id: http.GET.access
  name: 'GET /admin/access - Zugriff: the three questions; writes nothing, asks the Core nothing'
  entrance: http
  ref: GET /admin/access
- id: http.POST.access.reach
  name: 'POST /admin/access/reach - what X reads (wer, fuer, seite): folder rules and own-rights documents, 25 then pages of 50'
  entrance: http
  ref: POST /admin/access/reach
- id: http.POST.access.check
  name: 'POST /admin/access/check - may X read this document (wer, fuer, pointer): yes or no with the reason'
  entrance: http
  ref: POST /admin/access/check
- id: http.POST.access.search
  name: 'POST /admin/access/search - a search as X (wer, fuer, query): at most 25 hits, names only'
  entrance: http
  ref: POST /admin/access/search
- id: http.POST.access.enforcement
  name: 'POST /admin/access/enforcement - one administrator switches the position (mode ein | aus, bestaetigt=1)'
  entrance: http
  ref: POST /admin/access/enforcement
- id: call.web_interface.admin_access.attach_access_routes
  name: 'attach_access_routes - mounts the page and its three questions on the console''s blueprint behind the gate it is given'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_access.py#attach_access_routes
contract:
  http.GET.access:
    needs:
    - id: L2-PLATFORM-ACCESS-CHECK/http.GET.access/N-1
      statement: 'require_admin: signed out 302 to the sign-in, any other caller 403; nothing asked.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_the_page_and_the_three_questions_admit_administrators_only
        - test_signed_out_is_sent_to_the_sign_in_and_nothing_is_asked
        - test_a_member_and_an_approver_are_refused_and_nothing_is_asked
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_gates.py
        checks:
        - TestTheGate::test_the_route_lets_in_the_administrator_alone
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/http.GET.access/P-1
      statement: 'Offers every person, role and agent that is not revoked as wer, active people as fuer; writes nothing.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_the_page_offers_people_roles_and_agents_and_writes_nothing
        - test_the_menu_offers_zugriff_to_administrators_only
    - id: L2-PLATFORM-ACCESS-CHECK/http.GET.access/P-2
      statement: 'One sentence on data-enforcement-position: ein, aus, teilweise or unbekannt as the client reports it;
        the not_ready reasons in words of their own; the switch to the other position with its checkbox, never Probe.'
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp42_enforcement_switch_acceptance.py
        checks:
        - test_the_page_says_in_one_sentence_which_position_is_active
        - test_the_page_says_why_ein_is_not_possible_yet_in_its_own_words
        - test_the_switch_offers_the_other_position_with_a_confirmation_and_never_probe
  http.POST.access.reach:
    needs:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.reach/N-1
      statement: 'require_admin (302, 403), then csrf_token (400), then wer and fuer (400): nothing asked, no audit row.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_a_member_and_an_approver_are_refused_and_nothing_is_asked
        - test_each_question_checks_the_form_token
        - test_an_unknown_or_malformed_subject_is_refused
        - test_the_assistant_is_asked_about_for_a_person_only
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.reach/P-1
      statement: 'X''s claim groups (a person''s, a role''s group, an agent''s narrowed to its person; none for a revoked
        agent, an inactive person or over 32 groups); each walled rule and own-rights document X reads, or one above;
        at most 25 rows, the rest a count opening pages of 50; per-thing reads only; one audit row by id, written in
        the answer''s transaction (record_or_raise): without it nothing is shown, 503 (every look audited).'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_a_person_reads_through_direct_grants_roles_and_groups_above
        - test_the_assistant_reads_its_roles_narrowed_to_the_person_and_never_a_direct_grant
        - test_a_revoked_agent_a_deactivated_person_and_a_claim_over_32_groups_read_nothing
        - test_at_most_25_rows_and_the_rest_is_a_count_that_opens_the_list
        - test_no_question_reads_the_whole_tenant_or_writes
        - test_every_answered_question_is_audited_by_id_without_customer_text
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_access_rules.py
        checks:
        - test_page_one_draws_at_most_25_and_the_rest_comes_in_pages_of_50
        - test_a_walk_that_cannot_finish_keeps_what_it_read_and_says_so
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_access_routes.py
        checks:
        - test_a_look_whose_audit_row_cannot_be_written_shows_nothing
  http.POST.access.check:
    needs:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.check/N-1
      statement: 'As reach''s N-1; an empty or unknown document 400, no audit row.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_each_question_checks_the_form_token
        - test_an_unknown_or_empty_document_is_refused
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.check/P-1
      statement: 'Yes or no with its rule and groups. Computed (berechnet) unless the client reports brokered; then the
        Core''s document_readable asked as the person or the agent''s principal (knovas), which counts; a role stays
        computed.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_before_ein_the_answer_is_computed_and_says_so
        - test_open_documents_groups_above_and_rights_of_its_own
        - test_under_ein_the_answer_is_knovas_own_asked_as_that_person
        - test_under_ein_an_agent_is_asked_with_its_own_claim
        - test_under_ein_a_role_has_no_principal_and_stays_computed
        - test_any_posture_but_brokered_keeps_the_preview
  http.POST.access.search:
    needs:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.search/N-1
      statement: 'As reach''s N-1; a role or an empty query 400, no audit row.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_each_question_checks_the_form_token
        - test_a_role_does_not_search_and_a_subject_that_reads_nothing_sends_nothing
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.search/P-1
      statement: 'The search inside asserting_for(X); at most 25 hits by title and pointer, never passage text; before
        «Ein» each marked would-read from the document''s rights, after it as the Core returned them.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_before_ein_the_search_runs_as_the_person_and_marks_each_hit
        - test_under_ein_the_hits_are_knovas_answer_for_the_person
        - test_the_assistant_searches_with_its_claim_for_the_person
        - test_at_most_25_hits_are_shown
        - test_no_customer_text_reaches_a_log_line
  http.POST.access.enforcement:
    needs:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.enforcement/N-1
      statement: 'require_admin (302, 403), then csrf_token (400): nothing sent to the Core, no audit row.'
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp42_enforcement_switch_acceptance.py
        checks:
        - test_the_switch_admits_administrators_only
        - test_signed_out_a_member_and_an_approver_cannot_switch
        - test_the_switch_checks_its_token
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_gates.py
        checks:
        - TestTheGate::test_the_route_lets_in_the_administrator_alone
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/http.POST.access.enforcement/P-1
      statement: 'Nothing sent without bestaetigt=1 or for a mode but ein or aus (400), while the Core does not offer the
        switch or for the active position (409). Else set_rbac_posture brokered or disabled once, never enforcing; the
        page shows what the Core reports after; a refusal 409 in the page''s words, no route 409 «wartet auf Knovas»,
        a failure 502. Every attempt''s row before it is sent (record_or_raise: no row, nothing sent, 503), the PUT
        sent once, never retried; then its outcome''s row (switched, switch_refused, switch_failed or switch_unknown,
        the last when the answer is lost); by id; no second administrator, no bypass.'
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp42_enforcement_switch_acceptance.py
        checks:
        - test_one_administrator_switches_to_ein_alone
        - test_one_administrator_switches_to_aus
        - test_from_teilweise_both_ways_are_open
        - test_without_the_confirmation_nothing_is_sent
        - test_a_bad_mode_is_refused_and_enforcing_is_never_sent
        - test_the_position_already_active_is_not_sent
        - test_until_the_core_offers_the_switch_it_waits_for_knovas
        - test_a_core_without_the_route_also_waits_for_knovas
        - test_a_refusal_is_shown_in_words_of_its_own_and_changes_nothing
        - test_a_core_that_fails_is_502_and_changes_nothing
        - test_audit_rows_and_log_lines_name_people_by_id_only
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_enforcement_routes.py
        checks:
        - test_a_switch_without_its_audit_row_answers_500_and_says_so
        - test_a_switch_whose_answer_is_lost_is_recorded_as_unknown_and_the_page_reads_the_position
        - test_every_attempt_is_recorded_before_it_is_sent_and_without_its_row_nothing_is_sent
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_knovas_client_posture.py
        checks:
        - test_the_switch_is_sent_once_and_never_retried
  call.web_interface.admin_access.attach_access_routes:
    promises:
    - id: L2-PLATFORM-ACCESS-CHECK/call.web_interface.admin_access.attach_access_routes/P-1
      statement: 'Every route it mounts carries the gate it is given and reads the form''s csrf_token first.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp41_what_sees_acceptance.py
        checks:
        - test_the_page_and_the_three_questions_admit_administrators_only
        - test_each_question_checks_the_form_token
uses:
- component: L2-PLATFORM-ROLE-DATA
  operations: []
  expects: []
  method: 'imported: RB-5''s readers (read_core, live_rules, governing, walk, own_rights, core_groups), Sight and
    tenant_brokered, under their public names'
  protocol: in-process call
- component: L2-PLATFORM-BRAIN-VIEWS
  operations: []
  expects: []
  method: 'imported: brain_views.limit (bounded, paged, page_number, more_text), the one 25-row cap (PMVP-34)'
  protocol: in-process call
- component: EXT-BRAIN-API
  operations:
  - access-routes
  expects:
  - EXT-BRAIN-API/access-routes/P-1
  method: 'through the Platform''s own client (client_factory): groups, folder rules, documents by group or prefix, one
    document''s access; as X (asserting_for), the search and document_readable; the posture (rbac_posture) and, after an
    administrator''s confirmation, its one write (set_rbac_posture)'
  protocol: HTTPS with mTLS
hides:
- The German words of the page (templates/admin_access.html).
- How X's groups are read (identity.roles.claim_groups, identity.agents.AgentStore.claim_for) and how many pages of the
  Core's list a question walks (RB-5's five pages of 200 a group).
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
- at: /status
  why: Live or planned is not read from the code; the console is on main and runs where the Platform runs.
- at: /source_paths
  why: 'A card of its own (PMVP-41, 2026-11-22), the way RB-5 split «Rollendaten»: with the page L2-PLATFORM-ACCESS would
    be over the context budget. PMVP-42 added the enforcement position and its switch to the same page (R-2). The lines
    are new: no aliases. The parent L1-WORKSPACE (KnowledgeBase) does not list this card yet.'
- at: /operations
  why: The code reader shows the routes without the prefix /admin (the blueprint is passed in); the refs name the
    served path.
- at: /contract
  why: 'Plan § 7 names Verwaltung only in SHELL POST-01, whose server half is each route''s N-1 here. The other lines come
    from the work order PMVP-41.md (decisions of the founder, 2026-11-22: names only, every look audited) and its frozen
    tests.'
