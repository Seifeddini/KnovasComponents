card: 2
id: L2-PLATFORM-SHELL
name: Platform shell
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_sidebar.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/style.css
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/shell.css
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/knovas-tokens.css
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/fonts
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/img
- KnovasPlatform/components/docbridge_integration/src/web_interface/shell_routes.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/styleguide.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_parts.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/parts.css
purpose: The frame every Platform page shares - the one navigation, which shows the area a person is in and links to the areas they may enter, and the Knovas look of fonts, logo, shared styles and page parts.
responsible_for:
- id: L2-PLATFORM-SHELL/R-1
  statement: 'The navigation: one partial every page includes, which shows only the area the page is in and marks the current page. In the Workspace that is the search, with the links to Verwaltung and to the Builder at the foot for a person who may open a page there; in Verwaltung it is the way back to the Workspace and the Admin pages the person may open. Its style rules are a stylesheet of their own.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_sidebar.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/shell.css
- id: L2-PLATFORM-SHELL/R-2
  statement: 'The look: the Knovas brand tokens (the brand''s own file, unchanged), the stylesheet every page loads, which pulls the tokens in first and the shared page parts right after them and gives the Platform''s style names the brand''s values, the self-hosted brand fonts and the logo.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/style.css
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/knovas-tokens.css
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/fonts
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/img
- id: L2-PLATFORM-SHELL/R-3
  statement: 'The styleguide: one page for administrators that shows the tokens and the Platform''s style names with the values the two stylesheets hold, the plain parts that exist today, and every shared page part in each state, drawn by its macro with its call beside it.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/shell_routes.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/styleguide.html
- id: L2-PLATFORM-SHELL/R-4
  statement: 'The shared page parts: the pieces every new screen is built from - the one centred column, the page head, a section, a card, a row of a list, tabs, the status dot, the tag, the numbered reference and the link - as template macros with fixed names and arguments, and their style rules (classes that start with k-, values from the brand tokens only). Whatever a macro is given reaches the page as text.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_parts.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/parts.css
not_responsible_for:
- Deciding who may enter an area; each area's routes refuse on their own (the console's role gates, the Builder's permissions). The link is presentation.
- Computing which links a person gets; the Platform's web app does (app.py, _sidebar_context). For Verwaltung it reads the roles each console route's own gate lets in (_admin_pages), for the Builder it asks the Builder's own check (_builder_nav); the partial draws what it is handed and names no role.
- The Builder's own menu and its way back to the Workspace (templates/builder/_base.html, the Builder's card).
- The content of the pages.
- The values of the brand tokens; the brand kit owns them (KnowledgeBase, brand/knovas-brand), and this repository carries its file unchanged.
terms:
- area (Workspace, Verwaltung or Builder)
- token (a named value of the brand - a colour, a type size, a spacing step, a radius, a shadow - that the style rules take instead of a value of their own)
- page part (one of the shared pieces a screen is built from - a macro of _parts.html and its rules in parts.css)
operations:
- id: http.GET.styleguide
  name: 'GET /styleguide - the styleguide page: the brand tokens and the Platform''s style names by name and value, the plain parts and the shared page parts'
  entrance: http
  ref: GET /styleguide
- id: call.web_interface.shell_routes.create_shell_blueprint
  name: create_shell_blueprint - builds the shell's blueprint with its one route; the app registers it when accounts are on
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/shell_routes.py#create_shell_blueprint
contract:
  '*':
    promises:
    - id: L2-PLATFORM-SHELL/*/P-1
      aliases:
      - POST-01
      statement: A link to Verwaltung or Builder is shown only to a person whose role allows the area, and the server refuses the page otherwise (the link is not the check).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp11_navigation_acceptance.py
        checks:
        - test_a_member_sees_no_link_to_verwaltung_or_builder
        - test_an_administrator_sees_both_links
        - test_an_approver_sees_verwaltung_leading_to_the_page_they_may_open_and_no_builder
        - test_the_server_refuses_a_member_whatever_the_menu_shows
        - test_the_server_refuses_an_approver_outside_the_approvals
        - test_a_signed_out_visitor_is_sent_to_sign_in
        - test_an_approver_sees_only_the_approvals_in_the_admin_menu
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_shell_nav_links.py
        checks:
        - test_verwaltung_and_its_menu_are_exactly_the_admin_pages_the_server_opens_for_the_person
        - test_builder_is_offered_exactly_to_a_person_the_builder_lets_in
        - test_the_menu_follows_a_routes_gate_when_the_gate_changes
        - test_a_route_that_is_not_there_or_a_gate_that_cannot_be_read_draws_no_link
  http.GET.styleguide:
    needs:
    - id: L2-PLATFORM-SHELL/http.GET.styleguide/N-1
      statement: 'The caller is signed in and holds the role admin, the console''s rule: a signed-out caller is sent to the login and anyone else gets 403. The server refuses; no link to the page is drawn anywhere.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp10_brand_acceptance.py
        checks:
        - test_a_signed_out_visitor_is_sent_to_sign_in
        - test_a_member_is_refused
        - test_an_administrator_sees_the_tokens_by_name
uses:
- component: L2-PLATFORM-ADMIN
  operations:
  - http.GET.admin.people
  - http.GET.admin.system
  - http.GET.approvals
  expects:
  - L2-PLATFORM-ADMIN/http.GET.admin.people/N-1
  - L2-PLATFORM-ADMIN/http.GET.admin.system/N-1
  - L2-PLATFORM-ADMIN/http.GET.approvals/N-1
  method: the link «Verwaltung» (console_url, the first Admin page the person may open - Personen for an administrator, Freigaben for an approver) and the entries of the area Verwaltung (admin_pages); the web app offers a page only when the person holds a role that page's route gate lets in
- component: L2-PLATFORM-ACCESS
  operations:
  - http.GET.documents
  - http.GET.access-groups
  expects:
  - L2-PLATFORM-ACCESS/http.GET.documents/N-1
  - L2-PLATFORM-ACCESS/http.GET.access-groups/N-1
  method: the entries Dokumente and Zugriffsgruppen of the area Verwaltung (admin_pages), offered only when the person holds a role those routes' gate lets in; the two pages were L2-PLATFORM-ADMIN's until PMVP-40 split the card
- component: L2-BRAIN-BUILDER
  operations:
  - home
  expects:
  - L2-BRAIN-BUILDER/home/N-1
  method: the link «Builder» (url_for('builder.home')), drawn when the web app's builder_nav says the person may build
hides:
- The navigation's markup and the order of its entries.
- The style rules behind the shared look.
- The mark-up and the class names a page part draws; a screen takes a part by its macro's name and arguments.
- How the styleguide page reads the two stylesheets and lays its sections out.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: Live or planned is not read from the code; the sidebar and the stylesheet are on main, the one navigation that shows the area a person is in (PMVP-11) is built on the Platform MVP's branch and not on main yet.
- at: /source_paths
  why: 'PMVP-10 added the brand tokens (knovas-tokens.css), the shell''s route file and the styleguide page; the two font files it added are under static/fonts. PMVP-11 added the navigation''s own stylesheet (shell.css, which style.css loads after the tokens and the parts) and no base template. PMVP-12 added the shared page parts (templates/_parts.html, static/css/parts.css) and their section of the styleguide page. style.css is here as the one stylesheet every page loads; it also holds the styles of pages no card holds yet (search, preview, settings, Cortex, sync). The reference screens (docs/platform-mvp/reference-screens/) are documentation, not this component.'
- at: /operations
  why: 'The two the code reader shows: the styleguide page and the factory the web app calls to register it. create_shell_blueprint has no line: the plan''s contract deltas (section 7) give none, and its one caller is the web app''s wiring. Which links a person gets is still computed in the web app (app.py), which has no card. PMVP-11 left it there: the function reads each console route''s gate from the app''s registered views, which only the app holds, and the work order allows app.py for what feeds the sidebar and nothing in the console''s blueprint.'
- at: L2-PLATFORM-SHELL/http.GET.styleguide/N-1
  why: 'The gate is written out in shell_routes.py, in the words of the console''s require_admin (admin.py), because that one is built inside the console''s blueprint factory and cannot be imported. Two copies of one rule. PMVP-11 did not make them one: it takes more than a line or two (admin.py would hand its gate out, app.py pass it to the shell''s factory, shell_routes.py take it in place of its copy), and the coordinator allowed it only if it did not. The navigation itself copies no rule; it reads the roles each console gate puts on its view (allowed_roles; app.py, _gate_roles).'
- at: /responsible_for
  why: 'R-2 says what the stylesheet does, not that every rule follows it: rules that write a colour of their own still do (counted and listed in the builder''s notes of work order PMVP-10, for PMVP-12 and PMVP-40), the Cortex page re-declares the style names for itself (ontology.css), and the Builder''s pages have tokens of their own (static/css/builder/tokens.css, the Builder''s card). R-4 has no contract line: the plan''s contract deltas (section 7) give the parts none, and the macros are templates, which the code reader (Python only) does not list as operations; what they hold is in the three test files tests/test_shell_parts_*.py. No page but the styleguide uses the parts yet, and the Builder''s pages do not load style.css, so a Builder screen has to link the tokens and parts.css itself.'
- at: L2-PLATFORM-SHELL/*/P-1
  why: 'The evidence is PMVP-11''s frozen acceptance file, which renders the pages as a member, an approver and an administrator and asks the server for every Admin page and the Builder as each of them and signed out; and the builder''s test_shell_nav_links.py, which does the same for every role the console can give and shows that the menu follows a route''s gate when the gate changes. Not shown by a page test: the Builder link for a consultant, who holds no Builder role and only a grant on one workspace (app.py, _builder_nav, unchanged by PMVP-11).'
- at: /responsible_for
  why: 'Founder, 2026-11-20 (work order PMVP-11): Cortex, Experimente, Eigene Ansichten, Einstellungen and Feedback have no entry until a later item places them; their pages answer as before, and the person''s block at the foot still leads to the settings. The web app still computes their switches (cortex_enabled, experiments_nav, custom_views_nav, feedback_url); the partial draws none of them. How the web app reads a gate: each of the console''s gates (admin.py, _require_roles) puts the set of roles it checks on the view it returns, as allowed_roles, and app.py reads that attribute from the registered view. A view without it gives no link (closed, not open); test_shell_nav_links.py holds both and fails when a console route lacks the attribute. The coordinator decided this on 2026-11-21 in place of reading the gate''s closure (inspect.getclosurevars), which a rewritten gate would have broken without a sound, and allowed admin.py for this one attribute.'
- at: /uses
  why: The templates are not read by the code reader (Python only), so these dependencies are declared, not observed.
