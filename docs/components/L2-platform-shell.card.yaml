card: 2
id: L2-PLATFORM-SHELL
name: Platform shell
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_sidebar.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/style.css
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/fonts
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/img
purpose: The frame every Platform page shares - the one navigation to the areas a person may enter, and the Knovas look of fonts, logo, shared styles and page parts.
responsible_for:
- id: L2-PLATFORM-SHELL/R-1
  statement: 'The navigation: one partial every page includes, which lists the areas and modules a person may enter and marks the current one.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/_sidebar.html
- id: L2-PLATFORM-SHELL/R-2
  statement: 'The look: the self-hosted brand fonts, the logo and the stylesheet every page loads (the brand tokens and the shared page parts of PMVP-10 to PMVP-12 go here).'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/style.css
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/fonts
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/img
not_responsible_for:
- Deciding who may enter an area; each area's routes refuse on their own (the console's role gates, the Builder's permissions). The link is presentation.
- Computing which links a person gets; today the Platform's web app does (app.py, _sidebar_context, _console_url and _builder_nav).
- The content of the pages.
terms:
- area (Workspace, Verwaltung or Builder)
contract:
  '*':
    promises:
    - id: L2-PLATFORM-SHELL/*/P-1
      aliases:
      - POST-01
      statement: A link to Verwaltung or Builder is shown only to a person whose role allows the area, and the server refuses the page otherwise (the link is not the check).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_documents.py
        checks:
        - TestConsoleShell::test_sidebar_offers_the_console_only_when_told_to
        - TestAppWiring::test_sidebar_link_is_gated_on_the_admin_role
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_approvals.py
        checks:
        - TestApproverOnlyReachesTheTab::test_console_url_offers_approvals_to_a_pure_approver
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_web_admin_people.py
        checks:
        - TestWhoMayOpenIt::test_an_ordinary_member_is_refused
        - TestWhoMayOpenIt::test_a_member_cannot_create_a_user_through_the_post_route_either
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_builder_shell.py
        checks:
        - TestTheGate::test_a_person_without_a_builder_role_is_refused
uses:
- component: L2-PLATFORM-ADMIN
  operations:
  - http.GET.admin.people
  - http.GET.approvals
  expects:
  - L2-PLATFORM-ADMIN/http.GET.admin.people/N-1
  - L2-PLATFORM-ADMIN/http.GET.approvals/N-1
  method: the link «Verwaltung» (console_url, which the web app sets to Personen for an administrator and to Freigaben for an approver)
- component: L2-BRAIN-BUILDER
  operations:
  - home
  expects:
  - L2-BRAIN-BUILDER/home/N-1
  method: the link «Builder» (url_for('builder.home')), drawn when the web app's builder_nav says the person may build
hides:
- The navigation's markup and the order of its entries.
- The style rules behind the shared look.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: Live or planned is not read from the code; the sidebar and the stylesheet are on main, the one navigation with three areas (PMVP-11) is planned.
- at: /source_paths
  why: 'PMVP-10 to PMVP-12 add the brand tokens, a base template, the styleguide page and the shared page parts (card, row line, tabs, status dot, reference chip); their files join source_paths when they exist. style.css is here as the one stylesheet every page loads, where PMVP-10''s tokens go; it also holds the styles of pages no card holds yet (search, preview, settings, Cortex, sync). The reference screens (docs/platform-mvp/reference-screens/) are documentation, not this component.'
- at: /operations
  why: None; the shell holds no Python today, so the code reader shows no operation. Which links a person gets is computed in the web app (app.py), which has no card; PMVP-11 (area links by role, checked on the server) decides whether that logic moves here.
- at: L2-PLATFORM-SHELL/*/P-1
  why: 'The evidence covers today''s Verwaltung link and the gates behind both areas: two tests read app.py''s _console_url rather than render the sidebar, and no test shows the Builder link hidden from a person without a Builder role (app.py, _builder_nav). PMVP-11 rebuilds the navigation and brings page tests (signed out, wrong role).'
- at: /uses
  why: The templates are not read by the code reader (Python only), so these dependencies are declared, not observed.
