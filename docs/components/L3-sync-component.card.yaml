card: 2
id: L3-SYNC-COMPONENT
name: Sync component
kind: code
owner: ROLE-ENGINE-OWNER
level: 3
parent: L2-CONNECTION
source_paths:
- KnovasPlatform/components/sync_component/src/sync_component
- KnovasPlatform/components/sync_component/Dockerfile
- KnovasPlatform/components/sync_component/requirements.txt
purpose: Reads a company's sources at the company, plans with brain-runner what changes in the Brain and applies it
  on a person's command, or on its own where a person switched that on and the plan holds nothing a person must
  decide, and answers the Brain's fetch and write jobs for GitHub sources.
responsible_for:
- id: L3-SYNC-COMPONENT/R-1
  statement: Reading a source of the kinds it knows (http_json, github, a mounted share) with the source's own
    credential from its environment.
  code:
  - KnovasPlatform/components/sync_component/src/sync_component/fetchers.py
  - KnovasPlatform/components/sync_component/src/sync_component/share.py
- id: L3-SYNC-COMPONENT/R-2
  statement: Dry runs and applies through brain-runner, an apply writing exactly the plan the last dry run made; diff
    polling of GitHub sources (only the mappings new commits concern are planned), the sync state per source, and the
    automatic apply of clean scheduled plans where a person switched it on (KG-2).
  code:
  - KnovasPlatform/components/sync_component/src/sync_component/agent.py
  - KnovasPlatform/components/sync_component/src/sync_component/engine.py
  - KnovasPlatform/components/sync_component/src/sync_component/runner_cli.py
- id: L3-SYNC-COMPONENT/R-3
  statement: In link mode, talking to Knovas Link only; in direct mode, enrolling with the Platform itself (connector
    protocol v1).
  code:
  - KnovasPlatform/components/sync_component/src/sync_component/__main__.py
  - KnovasPlatform/components/sync_component/src/sync_component/link_client.py
  - KnovasPlatform/components/sync_component/src/sync_component/client.py
  - KnovasPlatform/components/sync_component/src/sync_component/identity.py
- id: L3-SYNC-COMPONENT/R-4
  statement: The jobs of the work channel - probe, fetch (a GitHub original) and write (a GitHub pull request that
    changes front-matter values only).
  code:
  - KnovasPlatform/components/sync_component/src/sync_component/jobs.py
  - KnovasPlatform/components/sync_component/src/sync_component/github_jobs.py
  - KnovasPlatform/components/sync_component/src/sync_component/front_matter_edit.py
- id: L3-SYNC-COMPONENT/R-5
  statement: Connector protocol 2.0 (draft, SYNC_PROTOCOL_V2, off by default) - the GitHub connector on the connector
    kit - its declaration (one action set_front_matter, staging direct and native_review, no inverse) and the jobs
    preview, act, reread and review_outcome; direct writes one commit with the expected blob sha and the permit id.
  code:
  - KnovasPlatform/components/sync_component/src/sync_component/github_v2.py
  - KnovasPlatform/components/sync_component/src/sync_component/jobs.py
not_responsible_for:
- Transferring documents (the Knovas Connector does); it moves records through the mapping runner.
- Fetch and write for sources other than GitHub; writing to YAML or JSON files or below the front matter's top level.
- Renewing its certificate in direct mode; «Token erneuern» in the Platform enrols it again.
terms:
- link mode (behind Knovas Link, turned on by SYNC_LINK_URL)
- direct mode (enrolled with the Platform itself)
- acknowledged stream (the stream state the last successful apply left, the next plan's previous)
- synced commit (the commit the last apply without errors synced, per source, in sync-state.json)
- automatic apply (a person's switch per source; only a plan with nothing a person must decide, engine.attention)
operations:
- id: cli.sync_component.__main__
  name: python -m sync_component [--once] - run the component (link mode with SYNC_LINK_URL, else direct mode)
  entrance: cli
  ref: python -m sync_component
- id: cli.sync_component.runner_cli
  name: python -m sync_component.runner_cli [--previous FILE] [--stream-source KEY] [--share-root DIR] RUNNER-ARGS
  entrance: cli
  ref: python -m sync_component.runner_cli
- id: cli.sync_component.share
  name: python -m sync_component.share --root DIR RUNNER-ARGS - brain-runner over a mounted share
  entrance: cli
  ref: python -m sync_component.share
- id: platform-commands
  name: The Platform's commands, delivered with the heartbeat answer - run, approve_plan, reject_plan, check, pause,
    resume, reload_config
  entrance: queue
  ref: KnovasPlatform/components/sync_component/src/sync_component/agent.py#Agent.handle
- id: scheduled-dry-run
  name: A dry run on the Platform's schedule (interval or window)
  entrance: job
  ref: KnovasPlatform/components/sync_component/src/sync_component/agent.py#Agent.tick
- id: poll-commits
  name: The schedule «bei neuen Commits» - ask each GitHub source for its head every poll_seconds and plan only the
    mappings new commits concern
  entrance: job
  ref: KnovasPlatform/components/sync_component/src/sync_component/agent.py#Agent.poll
- id: auto-apply
  name: The automatic apply of a clean scheduled plan, for a source a person switched it on for
  entrance: job
  ref: KnovasPlatform/components/sync_component/src/sync_component/agent.py#Agent._apply_on_its_own
- id: job.probe
  name: A probe job from Link's work channel
  entrance: queue
  ref: KnovasPlatform/components/sync_component/src/sync_component/jobs.py#JobWorker.answer
- id: job.fetch
  name: A fetch job - one original from a GitHub source
  entrance: queue
  ref: KnovasPlatform/components/sync_component/src/sync_component/github_jobs.py#fetch_original
- id: job.write
  name: A write job - a write proposal as a GitHub pull request
  entrance: queue
  ref: KnovasPlatform/components/sync_component/src/sync_component/github_jobs.py#write_proposal
- id: job.v2
  name: A protocol 2.0 job (preview, act, reread, review_outcome) for a GitHub source, with SYNC_PROTOCOL_V2 on
  entrance: queue
  ref: KnovasPlatform/components/sync_component/src/sync_component/github_v2.py#GitHubConnector
contract:
  '*':
    always:
    - id: L3-SYNC-COMPONENT/*/A-1
      statement: Logs, reports, events and checks carry codes, counts, versions, hashes and durations only - never a
        path, a file name, a value, a repository, an address or a token.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestTheReport::test_no_address_or_key_reaches_the_platform
        - TestTheReport::test_a_failed_fetch_is_a_code_with_no_address
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestFetch::test_logs_carry_codes_counts_and_durations_only
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - test_logs_carry_codes_counts_and_durations_only
    - id: L3-SYNC-COMPONENT/*/A-2
      statement: A source's credential comes only from the component's environment (SYNC_CREDENTIAL_KEY, else
        SYNC_CREDENTIAL_KIND) and never travels through the Platform or Link.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestTheFetcher::test_a_credential_comes_from_the_components_environment
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestFetch::test_the_credential_comes_from_the_components_environment
    - id: L3-SYNC-COMPONENT/*/A-3
      statement: The Brain is written only on a person's command (an apply after a dry run, or an approved held plan),
        or - for a source whose automatic apply a person switched on - by the apply of a plan the schedule just made
        that holds nothing a person must decide; a guard hold, drift, a retire entry, a release, a stopped or reported
        document are never applied without a person, and the component never approves anything itself. Without the
        switch a schedule only dry-runs.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestRunning::test_a_dry_run_never_calls_apply
        - TestRunning::test_a_schedule_only_ever_dry_runs
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_autosync.py
        checks:
        - TestAutomaticApply::test_off_by_default
        - TestAutomaticApply::test_nothing_a_person_must_decide_is_ever_applied_on_its_own
        - TestAutomaticApply::test_a_plan_the_deletion_guard_held_goes_to_the_platform_and_is_not_applied
        - TestAutomaticApply::test_a_dry_run_a_person_asked_for_is_never_applied_on_its_own
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_connector_kinds.py
        checks:
        - TestConnectorLink::test_a_dry_run_reports_counts_and_an_apply_needs_a_persons_command
    - id: L3-SYNC-COMPONENT/*/A-4
      statement: Every code the component answers is in Link's codes.json, and the component, its image, its README and
        its link-mode tests name no client.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_codes.py
        checks:
        - test_every_code_the_component_answers_is_in_the_contract
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_generic.py
    - id: L3-SYNC-COMPONENT/*/A-5
      statement: The image carries a pinned kustomize whose archive is checked against its release's SHA-256 before it
        is unpacked.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_image.py
  cli.sync_component.__main__:
    needs:
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/N-1
      statement: Link mode needs SYNC_LINK_URL (an http(s) address) and the token Link wrote for SYNC_NAME, mounted at
        SYNC_LINK_TOKEN_FILE (default /link/token); without the file, or with a token Link does not know, it stops.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkModeStart::test_without_its_token_file_it_does_not_start
        - TestLinkModeStart::test_a_token_link_does_not_know_stops_it
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/N-2
      statement: Direct mode needs SYNC_PLATFORM_URL and, for the first start, the one-time SYNC_ENROL_TOKEN.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestEnrolling::test_the_token_works_once
    promises:
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/P-1
      statement: In link mode it neither enrols nor holds a certificate - it registers with Link (capabilities with
        fetch:github and write:github, job kinds fetch, write, probe), waits while Link has no configuration, and
        registers again every 5 minutes.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkModeStart::test_once_registers_runs_and_answers_without_enrolment_or_certificate
        - TestLinkModeStart::test_it_waits_until_link_has_a_configuration
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestTheLoop::test_it_registers_again_so_a_restarted_link_routes_its_jobs
        - TestWhatTheComponentDoesNotServe::test_it_registered_the_job_kinds_and_capabilities
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/P-2
      statement: In link mode every call goes to Link's local API with the token and the name, never through a proxy,
        one session per thread; the runner's Brain calls go through Link's relay with BRAIN_LOCAL_TOKEN.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkMode::test_a_dry_run_reads_plans_and_reports_through_link_only
        - TestLinkMode::test_the_runners_brain_calls_go_through_links_relay_with_the_local_token
        - TestLinkMode::test_link_calls_use_no_proxy_and_a_session_per_thread
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestWhatTheComponentDoesNotServe::test_every_call_carries_the_token_and_the_name
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/P-3
      statement: In direct mode it makes its key on site (readable by its owner only), enrols once with the one-time
        token, and a second start uses what it holds.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestEnrolling::test_the_key_stays_on_site_and_only_its_owner_can_read_it
        - TestEnrolling::test_the_token_works_once
        - TestEnrolling::test_a_second_start_uses_what_it_holds
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/P-4
      statement: It registers and beats as version 0.2.0.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - test_it_registers_and_beats_as_version_0_2_0
    limits:
    - id: L3-SYNC-COMPONENT/cli.sync_component.__main__/L-1
      statement: A heartbeat every SYNC_INTERVAL_SECONDS (30 by default); a failed beat or poll is retried, with backoff
        up to 60 s for the job long-poll.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestTheLoop::test_a_broken_poll_does_not_end_the_loop
  cli.sync_component.runner_cli:
    promises:
    - id: L3-SYNC-COMPONENT/cli.sync_component.runner_cli/P-1
      statement: Runs brain-runner's own command line with the kept stream as make_plan's previous and the source's key
        as the stream's source, for the one run; an unreadable previous gives no tombstones.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkMode::test_the_last_acknowledged_stream_is_the_next_plans_previous
  cli.sync_component.share:
    promises:
    - id: L3-SYNC-COMPONENT/cli.sync_component.share/P-1
      statement: brain-runner reads a mounted share as files with the file system's date, never asks git, and reads no
        link that leads out of the share.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_connector_kinds.py
        checks:
        - TestFiles::test_the_runner_reads_it_through_the_share_source
        - TestShareSource::test_it_lists_files_with_the_file_systems_date_and_never_asks_git
        - TestShareSource::test_a_link_out_of_the_share_is_not_read
  platform-commands:
    promises:
    - id: L3-SYNC-COMPONENT/platform-commands/P-1
      statement: run {kind} starts a dry run or an apply and is finished by its run report; a paused component refuses
        it; check reports per source whether it can read it; pause, resume, reject_plan and reload_config are
        acknowledged; any other command is refused.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestRunning::test_the_run_command_is_reported_as_finished
        - TestRunning::test_a_paused_component_refuses_a_run
        - TestLinkMode::test_commands_come_with_the_local_heartbeat_and_are_done_through_link
        - TestLinkMode::test_a_paused_site_refuses_a_run
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_connector_kinds.py
        checks:
        - TestChecks::test_a_person_can_ask_again_and_it_answers_with_the_next_heartbeat
    - id: L3-SYNC-COMPONENT/platform-commands/P-2
      statement: A dry run fetches, writes the published package, plans and reports counts only; an apply writes exactly
        the plan the last dry run made, once, and without one is refused (apply.no_dry_run).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestRunning::test_a_dry_run_fetches_compiles_and_reports_counts
        - TestRunning::test_an_apply_without_a_dry_run_is_refused_and_writes_nothing
        - TestRunning::test_an_apply_takes_the_dry_runs_plan_and_only_once
    - id: L3-SYNC-COMPONENT/platform-commands/P-3
      statement: A plan the deletion guard held goes to the Platform; approve_plan applies it with the person's reason,
        reject_plan leaves it unapplied.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestTheGuard::test_a_held_plan_goes_to_the_platform_and_its_approval_applies_it
        - TestTheGuard::test_a_rejected_plan_stays_unapplied
    - id: L3-SYNC-COMPONENT/platform-commands/P-4
      statement: In link mode the stream the last successful apply acknowledged is the next plan's previous; a dry run,
        a failed and a held apply acknowledge nothing; direct mode keeps no stream.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkMode::test_the_last_acknowledged_stream_is_the_next_plans_previous
        - TestLinkMode::test_a_failed_or_held_apply_acknowledges_nothing
        - TestLinkMode::test_direct_mode_keeps_no_stream_and_passes_no_previous
    - id: L3-SYNC-COMPONENT/platform-commands/P-5
      statement: A source switched to read_write is still read, in link mode and for a kind the component writes to
        (GitHub) only; any other source that is not read is refused source.write_unsupported.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkMode::test_only_link_mode_reads_a_read_write_source
    limits:
    - id: L3-SYNC-COMPONENT/platform-commands/L-1
      statement: One brain-runner call may take up to 3600 s; an HTTP/JSON source is read up to SYNC_FETCH_MAX_BYTES
        (50,000,000 by default).
      risk_class: standard
  scheduled-dry-run:
    promises:
    - id: L3-SYNC-COMPONENT/scheduled-dry-run/P-1
      statement: A schedule (manual, interval or a window of days and hours) only ever starts dry runs, and none while
        paused; «bei neuen Commits» is never due as a whole (poll-commits plans a source).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestRunning::test_a_schedule_only_ever_dry_runs
        - TestTheSchedule::test_when_a_dry_run_is_due
  poll-commits:
    promises:
    - id: L3-SYNC-COMPONENT/poll-commits/P-1
      statement: Every poll_seconds (15 to 3600) one request per GitHub source for its head, with the last ETag; the
        commit last synced or planned starts nothing (no plan, no Brain call); a new one plans only the mappings
        brain-runner's affected names, each whole, and reports the dry run as any other; a new package, no synced
        commit or a change affected cannot narrow plans every mapping; commits that concern none plan and report
        nothing; a failed plan of a head is tried again after five minutes; sources without commits are not polled;
        none while paused.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_autosync.py
        checks:
        - TestDiffPolling::test_the_head_last_synced_plans_nothing_and_calls_no_brain
        - TestDiffPolling::test_a_new_commit_plans_only_the_mappings_it_concerns_and_reports_as_today
        - TestDiffPolling::test_a_change_affected_cannot_narrow_plans_every_mapping
        - TestDiffPolling::test_a_new_package_plans_every_mapping_without_asking
        - TestDiffPolling::test_commits_that_concern_no_mapping_plan_nothing_and_report_nothing
        - TestDiffPolling::test_it_asks_only_every_poll_seconds
        - TestDiffPolling::test_a_failed_plan_is_tried_again_after_a_while_not_on_every_poll
        - TestDiffPolling::test_only_sources_with_commits_are_polled
        - TestTheHead::test_one_request_with_the_token_and_the_etag
    - id: L3-SYNC-COMPONENT/poll-commits/P-2
      statement: The synced commit of a source is written only after an apply without errors - for a plan of some
        mappings the commit affected compared to, for a full plan the commit it read - and the heartbeat names per
        source the synced commit, when, the last apply's counts, the last and next check, the commit planned and why
        it was not applied on its own; commits, times, codes and counts only.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_autosync.py
        checks:
        - TestDiffPolling::test_the_synced_commit_is_written_only_after_an_apply_without_errors
        - TestDiffPolling::test_a_full_plan_syncs_the_commit_it_read_and_a_narrowed_one_the_commit_affected_compared_to
        - TestTheSyncStatus::test_the_heartbeat_names_the_synced_commit_the_last_apply_and_the_next_check
        - TestTheSyncStatus::test_it_carries_commits_counts_codes_and_times_only
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component.py
        checks:
        - TestLinkMode::test_the_sync_status_travels_with_the_local_heartbeat
  auto-apply:
    promises:
    - id: L3-SYNC-COMPONENT/auto-apply/P-1
      statement: For a source with auto_apply, a plan the schedule made is applied right after its dry run's report,
        as a second run with no command and the event auto_apply.applied, only when it is ok, has no error and nothing
        held, and engine.attention finds nothing (guard holds of nodes or documents, drift of facts, computed attributes
        or derived edges, held retire entries, a release, documents stopped, reported or held, unreadable source
        documents, anything unresolved, blocked derived edges, an unknown plan version); otherwise auto_apply.withheld
        with the reasons as codes. The apply passes no approval flag. The switch is read fresh before each plan.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_autosync.py
        checks:
        - TestAutomaticApply::test_a_clean_plan_the_schedule_made_is_applied_right_after
        - TestAutomaticApply::test_nothing_a_person_must_decide_is_ever_applied_on_its_own
        - TestAutomaticApply::test_an_interval_schedule_s_clean_plan_is_applied_too
        - TestAutomaticApply::test_the_switch_is_read_fresh_before_a_plan
        - TestAutomaticApply::test_a_clean_plan_is_one_whose_attention_is_empty
  job.probe:
    promises:
    - id: L3-SYNC-COMPONENT/job.probe/P-1
      statement: A probe is answered ok at once, on the long-poll's own thread.
      risk_class: low
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestProbe::test_a_probe_is_answered_at_once
        - TestProbe::test_a_probe_through_the_long_poll_needs_no_thread_of_its_own
  job.fetch:
    needs:
    - id: L3-SYNC-COMPONENT/job.fetch/N-1
      statement: The job names a source this component serves, of a kind it reads originals of (GitHub), with its fetch
        switch on; otherwise unsupported, or refused fetch_disabled.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestWhatTheComponentDoesNotServe::test_a_job_for_a_source_it_does_not_serve_is_unsupported
        - TestWhatTheComponentDoesNotServe::test_a_fetch_of_a_kind_without_a_reader_is_unsupported
        - TestFetch::test_a_source_whose_fetch_switch_is_off_is_refused_here_too
    promises:
    - id: L3-SYNC-COMPONENT/job.fetch/P-1
      statement: Reads the blob at args.version, or what the source's ref holds now; bytes whose git blob hash is not
        the version never leave (failed version_mismatch); a file not there is refused not_found.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestFetch::test_the_blob_at_the_version_arrives_whole_and_its_git_hash_is_the_version
        - TestFetch::test_without_a_version_it_reads_what_the_ref_holds_now
        - TestFetch::test_an_older_version_is_still_read_by_its_blob
        - TestFetch::test_bytes_that_do_not_hash_to_the_version_never_leave
        - TestFetch::test_what_is_not_there_is_refused_not_found
    - id: L3-SYNC-COMPONENT/job.fetch/P-2
      statement: The bytes go to Link in parts numbered from 0, and the result is ok with version, bytes_sha256, mime,
        bytes and parts; once Link took a part no more, nothing more is sent.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestFetch::test_a_large_original_goes_in_numbered_parts_of_at_most_4_mib
        - TestFetch::test_an_empty_original_has_no_parts
        - TestFetch::test_a_fetch_whose_lease_ended_at_link_sends_nothing_more
    limits:
    - id: L3-SYNC-COMPONENT/job.fetch/L-1
      statement: A part is at most 4 MiB; the job's max_bytes, at most 25 MiB, is enforced before anything is sent
        (refused too_large).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_jobs.py
        checks:
        - TestFetch::test_max_bytes_is_enforced_before_anything_is_sent
        - TestFetch::test_exactly_max_bytes_is_allowed
        - TestFetch::test_a_large_original_goes_in_numbered_parts_of_at_most_4_mib
  job.write:
    needs:
    - id: L3-SYNC-COMPONENT/job.write/N-1
      statement: The job's mode is proposal (else refused mode_unsupported), the source is switched to read_write
        (else refused), and its credential may write contents and pull requests (else refused token_cannot_write).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestNothingIsWritten::test_a_mode_other_than_proposal_is_refused
        - TestNothingIsWritten::test_a_source_switched_to_read_is_refused
        - TestNothingIsWritten::test_a_token_that_cannot_write_is_refused
    promises:
    - id: L3-SYNC-COMPONENT/job.write/P-1
      statement: brain-runner's compile-write turns the job into the change of one file, and its refusal is the job's;
        the file read at the branch head must have the blob sha expected_version, else conflict and nothing is written.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestNothingIsWritten::test_what_the_inverse_mapping_refuses_is_the_jobs_refusal
        - TestNothingIsWritten::test_a_file_changed_since_the_version_is_a_conflict
    - id: L3-SYNC-COMPONENT/job.write/P-2
      statement: Only the changed values' text in the front matter is replaced - body, key order, comments, line
        endings and BOM stay byte-identical; a front matter it cannot change safely is refused edit_unsupported or
        front_matter_missing, the same values no_change.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestAProposalBecomesAPullRequest::test_the_pull_request_carries_only_the_changed_values
        - TestNothingIsWritten::test_a_front_matter_the_editor_cannot_change_safely_is_refused
        - TestNothingIsWritten::test_the_same_values_change_nothing
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_front_matter_edit.py
    - id: L3-SYNC-COMPONENT/job.write/P-3
      statement: The change is committed on a new branch knovas/write-JOBID, never on the source's branch, with a
        message naming the declared agent and 12 hex digits of the SHA-256 of the declared person; a pull request is
        opened and its URL is the result's source_ref; a job claimed again answers the same pull request.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestAProposalBecomesAPullRequest::test_the_commit_names_the_agent_and_only_a_hash_of_the_person
        - TestAProposalBecomesAPullRequest::test_a_job_claimed_again_ends_with_the_same_pull_request
        - TestAProposalBecomesAPullRequest::test_without_a_ref_the_default_branch_takes_the_pull_request
    - id: L3-SYNC-COMPONENT/job.write/P-4
      statement: A step that fails after the branch was made deletes the branch again (else the code is
        github.branch_left); a branch someone else changed is never deleted.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestABranchLeftBehindIsCleanedUp::test_a_failed_step_after_the_branch_deletes_the_branch
        - TestABranchLeftBehindIsCleanedUp::test_a_branch_that_cannot_be_deleted_is_named_in_the_code
        - TestABranchLeftBehindIsCleanedUp::test_a_branch_someone_else_changed_is_never_deleted
    limits:
    - id: L3-SYNC-COMPONENT/job.write/L-1
      statement: GitHub's 403 on a write step, or its 404 after the file was read, is token_cannot_write; a rate limit
        is not taken for it; a file gone from the branch is not_found.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_github_write.py
        checks:
        - TestATokenThatCannotWrite::test_a_404_on_a_write_step_after_the_file_was_read_is_token_cannot_write
        - TestATokenThatCannotWrite::test_a_404_on_a_read_keeps_the_reads_code
        - TestNothingIsWritten::test_a_rate_limit_is_not_taken_for_a_token_that_cannot_write
        - TestNothingIsWritten::test_a_file_gone_from_the_branch_is_not_found
  job.v2:
    needs:
    - id: L3-SYNC-COMPONENT/job.v2/N-1
      statement: SYNC_PROTOCOL_V2 is on and Knovas Link speaks protocol 2.0; an act carries the permits Link checked,
        each bound to its own step (else refused permit_mismatch), and the source is switched to read_write (else
        refused write_disabled).
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_github_v2.py
        checks:
        - test_the_github_connector_passes_the_conformance_suite
        - test_a_source_that_only_reads_is_never_written
    promises:
    - id: L3-SYNC-COMPONENT/job.v2/P-1
      statement: A preview reads the file at the branch head, writes nothing, and shows before and after per front
        matter key with a diff and the blob sha it read; a computed fact makes it inexact.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_github_v2.py
        checks:
        - test_the_github_connector_passes_the_conformance_suite
        - test_a_direct_write_is_one_commit_on_the_branch_with_the_permit_and_no_pull_request
    - id: L3-SYNC-COMPONENT/job.v2/P-2
      statement: A direct act is one commit on the source's branch through the contents API with the expected blob sha
        and the trailer Knovas-Permit - a changed file is conflict version_changed and nothing is written, a repeat
        finds its commit and answers its receipt without writing again, and the receipt comes from reading the file
        again. No pull request.
      risk_class: critical
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_github_v2.py
        checks:
        - test_a_direct_write_is_one_commit_on_the_branch_with_the_permit_and_no_pull_request
        - test_a_file_changed_after_the_preview_is_a_conflict_and_nothing_is_written
        - test_the_github_connector_passes_the_conformance_suite
    - id: L3-SYNC-COMPONENT/job.v2/P-3
      statement: A native_review act opens today's pull request on knovas/write-<permit id>; review_outcome answers
        pending, accepted with receipts once merged, or declined once closed. unstage is not offered in V1.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_sync_component_github_v2.py
        checks:
        - test_native_review_opens_a_pull_request_and_follows_its_outcome
        - test_unstage_is_not_offered_in_v1
    limits:
    - id: L3-SYNC-COMPONENT/job.v2/L-1
      statement: One file per step (grouping none); reading stays protocol 1.x's (no stream declared); no inverse.
      risk_class: standard
uses:
- component: L3-CONNECTOR-KIT
  operations:
  - cli.knovas_connector_kit.conformance.__main__
  expects:
  - L3-CONNECTOR-KIT/*/A-1
  - L3-CONNECTOR-KIT/*/A-2
  - L3-CONNECTOR-KIT/*/A-3
  method: the kit's base class and permits, imported from the copy beside the component (the image's build context
    is the component's folder); the conformance suite in the tests
- component: L3-KNOVAS-LINK
  operations:
  - local.register
  - local.heartbeat
  - local.command-done
  - local.config
  - local.package
  - local.jobs
  - local.job-part
  - local.job-result
  - local.brain-relay
  - local.report
  expects:
  - L3-KNOVAS-LINK/*/N-1
  - L3-KNOVAS-LINK/local.register/P-1
  - L3-KNOVAS-LINK/local.config/P-1
  - L3-KNOVAS-LINK/local.jobs/P-1
  - L3-KNOVAS-LINK/local.job-part/P-1
  - L3-KNOVAS-LINK/local.brain-relay/P-1
  - L3-KNOVAS-LINK/local.heartbeat/P-2
  - L3-KNOVAS-LINK/local.heartbeat/P-3
  method: link mode, SYNC_LINK_URL + /local/v1
  protocol: HTTP on the site's internal network, Bearer token and X-Component
- component: L2-BRAIN-BUILDER
  operations:
  - protocol-enrol
  - protocol-heartbeat
  - protocol-config
  - protocol-package
  - protocol-runs
  - protocol-command-done
  - protocol-events
  - protocol-checks
  expects:
  - L2-BRAIN-BUILDER/protocol-enrol/P-1
  - L2-BRAIN-BUILDER/protocol-config/P-1
  - L2-BRAIN-BUILDER/protocol-package/P-1
  method: direct mode only, SYNC_PLATFORM_URL (connector protocol v1)
  protocol: HTTPS, Bearer control token, client certificate
- component: EXT-BRAIN-RUNNER
  operations:
  - cli.plan
  - cli.apply
  - cli.compile-write
  - cli.affected
  - call.runner-entry
  expects:
  - EXT-BRAIN-RUNNER/cli.plan/P-1
  - EXT-BRAIN-RUNNER/cli.apply/P-1
  - EXT-BRAIN-RUNNER/cli.compile-write/P-1
  - EXT-BRAIN-RUNNER/cli.affected/P-1
  - EXT-BRAIN-RUNNER/call.runner-entry/P-1
  method: python -m brain_runner as a subprocess (engine.py), and its Python entry points (runner_cli.py, share.py)
- component: EXT-GITHUB-API
  operations:
  - repo-contents
  - git-data
  - pulls
  - head-and-compare
  expects:
  - EXT-GITHUB-API/git-data/P-1
  - EXT-GITHUB-API/pulls/P-1
  - EXT-GITHUB-API/head-and-compare/P-1
  method: the REST API with the source's own credential (BRAIN_GITHUB_API, default api.github.com)
hides:
- The per-source working folder (package, plan, state, acknowledged stream, sync state) under SYNC_DATA_DIR.
- The number of job worker threads (4).
- How a GitHub source's ref and file path are read from its settings.
decisions:
- id: DEC-0040
  statement: The mapping runner is the component's engine; plan on a dry run, apply exactly the plan a dry run made.
risks:
- id: L3-SYNC-COMPONENT/RISK-01
  statement: Link mode needs a brain-runner release that takes BRAIN_LOCAL_TOKEN and compile-write, and diff polling
    one with affected --source github (0.3.2 or later); with 0.3.1 every new commit plans every mapping, and an image
    with an older pin cannot plan, apply or answer write jobs behind Link (README, "Release coupling").
  mitigation: The image, the Platform's image and CI pin the same release (BRAIN_RUNNER_GIT_REF, CI's
    BRAIN_RUNNER_SHA); both images' builds stop on another version (BRAIN_RUNNER_VERSION); a release run prints the
    version its image carries.
review:
- at: L3-SYNC-COMPONENT/*/A-3
  why: Changed 2026-11-10 for KG-2 (the founder asked for automatic apply that day) - the Brain may now be written
    without a person's command, for a source a person switched it on for and a plan with nothing to decide. map-check
    reports the line as changed and not marked compatible; a person confirms it (compatible, reviewed_by).
- at: /parent
  why: L2-CONNECTION is the placement the connection-layer model proposes; the domain is confirmed by a person
    (Software Map K5).
- at: /owner
  why: Proposed owner; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: Link mode is built ahead of its bet's approval and not deployed; whether direct mode runs at a company is not
    read from the code.
- at: L3-SYNC-COMPONENT/platform-commands/L-1
  why: No evidence; the timeout is in engine.py (_cli) and the size in fetchers.py (MAX_BYTES).
- at: /operations
  why: The code reader sees only the three programs; the commands, the schedule and the jobs are listed by hand (the
    long-poll calls LinkClient.next_job, which no receive setting names).
- at: L3-SYNC-COMPONENT/job.v2/L-1
  why: No evidence; a known limit of the V1 draft (FEAT-2026-11-10-write-back C-3).
