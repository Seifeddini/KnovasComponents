uses:
- component: L2-PLATFORM-ROLE-DATA
  operations:
  - call.web_interface.admin_role_data.attach_role_data_routes
  - call.web_interface.admin_role_data.role_data_part
  expects:
  - L2-PLATFORM-ROLE-DATA/call.web_interface.admin_role_data.attach_role_data_routes/P-1
  - L2-PLATFORM-ROLE-DATA/call.web_interface.admin_role_data.role_data_part/P-1
  method: 'imported: attach_role_routes mounts RB-5''s routes with its page; the page asks role_data_part for «Darf
    lesen» and imports templates/_role_data.html'
  protocol: in-process call
- component: L2-PLATFORM-AGENTS
  operations:
  - call.web_interface.admin_agents.role_agents
  expects: []
  method: 'imported: the page asks role_agents for the agent rows under «Mitglieder» and the agents «+ Agent hinzufügen»
    offers'
  protocol: in-process call
- component: EXT-BRAIN-API
  operations:
  - access-routes
  expects:
  - EXT-BRAIN-API/access-routes/P-1
  method: 'through the Platform''s own client on the Platform''s certificate (knovas_client, passed in by the app as client_factory),
    on an administrator''s form only: create, rename and delete a role''s group, and read the tenant''s administrator group
    for Administration'
  protocol: HTTPS with mTLS
hides:
- The German texts of the Rollen page.
- The functions' plain words (FUNCTION_WORDS in identity/roles.py); the page never shows a key, its forms send role ids
  and function keys.
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
