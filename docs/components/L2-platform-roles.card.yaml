card: 2
id: L2-PLATFORM-ROLES
name: Rollen
kind: code
owner: ROLE-ENGINE-OWNER
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/web_interface/admin_roles.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_roles.html
purpose: The role builder's Rollen page in the Platform's console, where an administrator gives each role its functions and
  its people and links it to a Core group of its own.
responsible_for:
- id: L2-PLATFORM-ROLES/R-1
  aliases:
  - L2-PLATFORM-ADMIN/R-5
  statement: 'Roles (role builder RB-3, RB-4): the Rollen page shows each role (its functions in words, what it may read,
    its people) and lets an administrator create, rename and delete a role of the firm''s own, change a role''s functions
    and people, and link Administration and Mitglied to their Core groups. The Core is written first and only on an
    administrator''s form: a new role''s group before the role, a rename before the role, deleting goes members, Core group,
    role. Every change writes its audit row by id in the same transaction, and the last active administrator keeps
    Administration.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/web_interface/admin_roles.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/admin_roles.html
not_responsible_for:
- The console's blueprint, its role gates and the people page, where a person's roles are checked (L2-PLATFORM-ADMIN); the
  routes here are attached to that blueprint with its require_admin.
- The agents of a role, their rows and forms on this page (L2-PLATFORM-AGENTS); the page draws the rows it is given.
- The roles as stored, their audit rows and the claim's groups (identity/roles.py); the Platform's identity package, which
  has no card.
- 'A role''s data, its dry runs, adopting a group and moving direct grants (RB-5): L2-PLATFORM-ROLE-DATA; the page draws
  its parts (templates/_role_data.html) and the part «Darf lesen» from its role_data_part.'
terms:
- role (a name, functions and people, and a Core group of its own; what a person may do comes from her roles' functions,
  what she may read from their groups)
operations:
- id: http.GET.roles
  name: 'GET /admin/roles - Rollen: the roles as tabs and the first role''s card (Administration)'
  entrance: http
  ref: GET /admin/roles
- id: http.GET.roles._role_id
  name: 'GET /admin/roles/{role_id} - one role''s card: functions, data, members'
  entrance: http
  ref: GET /admin/roles/{role_id}
- id: http.POST.roles.create
  name: 'POST /admin/roles/create - create a role: its Core group first, then the role'
  entrance: http
  ref: POST /admin/roles/create
- id: http.POST.roles._role_id.rename
  name: 'POST /admin/roles/{role_id}/rename - rename a role: its Core group first'
  entrance: http
  ref: POST /admin/roles/{role_id}/rename
- id: http.POST.roles._role_id.functions
  name: 'POST /admin/roles/{role_id}/functions - replace a role''s functions'
  entrance: http
  ref: POST /admin/roles/{role_id}/functions
- id: http.POST.roles._role_id.members.add
  name: 'POST /admin/roles/{role_id}/members/add - put a person into a role'
  entrance: http
  ref: POST /admin/roles/{role_id}/members/add
- id: http.POST.roles._role_id.members.remove
  name: 'POST /admin/roles/{role_id}/members/remove - take a person out of a role'
  entrance: http
  ref: POST /admin/roles/{role_id}/members/remove
- id: http.POST.roles._role_id.delete
  name: 'POST /admin/roles/{role_id}/delete - delete a role: members, Core group, role'
  entrance: http
  ref: POST /admin/roles/{role_id}/delete
- id: http.POST.roles.connect
  name: 'POST /admin/roles/connect - link Administration and Mitglied to their Core groups'
  entrance: http
  ref: POST /admin/roles/connect
- id: call.web_interface.admin_roles.attach_role_routes
  name: attach_role_routes - attaches the Rollen routes to the console's blueprint, behind the gate it is given; returns
    the page function the agents' role forms answer with
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/admin_roles.py#attach_role_routes
