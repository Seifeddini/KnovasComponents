    needs:
    - id: L2-PLATFORM-ROLES/http.GET.roles/N-1
      aliases:
      - L2-PLATFORM-ADMIN/http.GET.roles/N-1
      statement: 'The caller is signed in and holds the role admin (require_admin): a signed-out caller is sent to the login,
        anyone else gets 403, whatever the page shows.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_rb34_roles_page_acceptance.py
        checks:
        - test_every_route_carries_the_console_admin_gate
        - test_a_signed_out_visitor_is_sent_to_sign_in
