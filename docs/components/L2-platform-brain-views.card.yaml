card: 2
id: L2-PLATFORM-BRAIN-VIEWS
name: Brain views
kind: code
owner: ROLE-ENGINE-OWNER
status: planned
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/brain_views
- KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/templates/dossier.html
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/brain_views.css
purpose: Shows a Workspace member what the Brain knows about one thing, where one statement comes from, or where one process instance stands, each as a bounded view with one starting point.
responsible_for:
- id: L2-PLATFORM-BRAIN-VIEWS/R-1
  aliases:
  - RESP-01
  statement: Shows one thing, one statement's evidence, or one process instance as a bounded view.
  code:
  - KnovasPlatform/components/docbridge_integration/src/brain_views
- id: L2-PLATFORM-BRAIN-VIEWS/R-2
  statement: 'The dossier (PMVP-30a): one thing''s name and kind, its facts - each with the document its source passage is in, or the mark «ohne Beleg» - and its documents, read as the person signed in, behind the switch brain_views.enabled; and opening one of those documents, checked with the Core per click, the way a search hit opens.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/brain_views/dossier.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/dossier.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/brain_views.css
- id: L2-PLATFORM-BRAIN-VIEWS/R-3
  statement: 'The dossier''s related things by kind (PMVP-30b): one tab per kind with its count, in the plural from one table, and behind it the list of that kind (each row a link to that thing''s dossier, with its relation), sorted, filtered and paged at 50; the documents as the same kind of list. Read as the person, per thing: one neighbours read and one round of kind reads.'
  code:
  - KnovasPlatform/components/docbridge_integration/src/brain_views/related.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/templates/dossier.html
  - KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/brain_views.css
not_responsible_for:
- 'The modellers'' views of the Platform: Ansichten (Graph, Ablauf, Baum, Board, Liste, Matrix, Definitionen, Dokumentation, Lücken), Cortex and the custom views. They read the tenant''s whole edge list (graph_views/topology.py) and stay outside this card (graph_views/, views_routes.py, ontology_graph.py, custom_views/).'
- A whole-graph screen for members; a member reaches a view from a result, an answer or a name typed into the box (B-02, B-05).
- The links from names in search results and answers to the dossier; the search page (the web app) and the assistant draw them (PMVP-33).
- 'Who may read a node, a fact or a document: the Core decides, and answers 404 for what the person may not see (graph_api.py, document_readable). Serving a document''s file: the web app''s file routes and their gate (app.py, document_grants.py); the dossier hands them the one document a person clicks, after the Core''s check, through the web app''s grant, as the search page does with its rows.'
- 'How a document opens: the search''s own enrichment and settings (app.py: _enhance_listing_rows, pdf_inline_in_browser, _download_open_enabled) and the file routes; the dossier picks among them in the order a search hit does. What an experiment document is: the Experimente module''s split (experiments/search.py), which the dossier calls.'
- The switch's place on the settings page and its storage (platform_settings.py, settings_routes.py); this card holds what the one registry entry means.
terms:
- dossier (the page for one thing - what the Brain knows about it)
- Beleg-Spur (evidence trail - the way from a statement to its passage and document)
- process line (one process instance - its main path, the current step and what is missing)
- ohne Beleg (the mark of a fact that has no source passage the person can open from the dossier)
operations:
- id: http.GET.dossier._node_id
  name: 'GET /dossier/<node_id> - the dossier of one thing: Überblick (its facts with their source); one tab per kind of related thing with its count, ?art=<kind> its list (the type''s uuid, or ohne for «Weitere Einträge»); ?tab=dokumente its documents. The lists take ?sort= (name, name-ab, beziehung), ?filter= (at most 100 characters) and ?seite= (50 a page)'
  entrance: http
  ref: GET /dossier/<node_id>
- id: http.GET.dossier._node_id.dokument._position
  name: 'GET /dossier/<node_id>/dokument/<int:position> - opens the document at this place of the dossier''s list: checked with the Core as the person, handed over to that person alone, then where a search hit opens it'
  entrance: http
  ref: GET /dossier/<node_id>/dokument/<int:position>
- id: call.web_interface.brain_views_routes.create_brain_views_blueprint
  name: create_brain_views_blueprint - builds the Brain views' blueprint; the web app registers it with its identity gate, its one Knovas client, the settings, its document grant and the frame's values
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py#create_brain_views_blueprint
contract:
  '*':
    needs:
    - id: L2-PLATFORM-BRAIN-VIEWS/*/N-1
      aliases:
      - PRE-01
      statement: The view is opened with exactly one starting point.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_there_is_no_dossier_without_exactly_one_node
        - test_a_malformed_id_is_not_sent_to_the_core
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_a_hidden_or_missing_thing_answers_404_and_its_neighbours_are_not_read
        - test_the_starting_thing_and_what_is_two_hops_away_are_never_counted
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_a_malformed_start_is_not_sent
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/*/P-1
      aliases:
      - POST-01
      statement: At most 25 nodes are drawn; the remainder is a count that opens a list.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp34_view_limit_acceptance.py
        checks:
        - test_the_limit_is_25
        - test_bounded_shows_at_most_25_in_the_order_given
        - test_bounded_refuses_more_than_25_and_negative_numbers
        - test_every_view_page_draws_at_most_25
        - test_the_rest_is_a_count_that_opens_a_list
        - test_the_dossier_draws_its_thing_and_lists_its_facts
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_the_overview_draws_nothing_but_the_thing
        - test_one_tab_per_kind_with_its_count_in_the_plural
        - test_a_list_has_pages_of_50
        - test_documents_are_sorted_filtered_and_paged
    - id: L2-PLATFORM-BRAIN-VIEWS/*/P-2
      aliases:
      - POST-02
      statement: A fact shown without a mark has at least one source passage that opens on click.
      risk_class: standard
    - id: L2-PLATFORM-BRAIN-VIEWS/*/P-3
      aliases:
      - POST-03
      statement: The view calls per-thing routes only, never a whole-tenant read.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_every_read_is_a_per_thing_read_made_as_the_person_signed_in
        - test_no_whole_tenant_read_even_without_a_kind
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_one_neighbours_read_and_one_round_of_kind_reads_per_page_as_the_person
        - test_no_whole_tenant_read_on_any_tab
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_one_neighbours_read_and_one_round_of_kind_reads
        - test_at_most_twenty_kinds_are_named_and_the_rest_fall_under_the_others
  http.GET.dossier._node_id:
    needs:
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/N-1
      statement: The caller is signed in (a signed-out caller is sent to sign-in), the installation has per-user accounts, and brain_views.enabled is on («an», or BRAIN_VIEWS_ENABLED=true); otherwise the address answers 404 and the Core is not asked.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_signed_out_caller_is_sent_to_sign_in
        - test_switched_off_the_address_answers_404_and_the_core_is_not_asked
        - test_the_switch_reads_the_page_word_and_the_environment_word
        - test_without_per_user_accounts_nothing_answers
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_a_signed_out_caller_is_sent_to_sign_in
        - test_switched_off_a_kinds_list_answers_404_and_the_core_is_not_asked
        - test_without_per_user_accounts_a_kinds_list_does_not_answer
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-1
      statement: Every read is made as the person signed in, through the web app's one Knovas client; a node the person may not see answers exactly as a node that does not exist (404).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_every_read_is_a_per_thing_read_made_as_the_person_signed_in
        - test_a_node_the_person_may_not_see_answers_as_a_node_that_does_not_exist
        - test_the_same_node_is_shown_to_the_person_the_core_shows_it_to
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-2
      statement: 'Showing the dossier hands over no document. The node''s documents are the ones the Core listed for this person, less experiment documents (taken out by the function search uses); every address on the page is built by the Platform (url_for), never taken from the Brain or a document.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_open.py
        checks:
        - test_showing_the_dossier_hands_over_nothing
        - test_an_experiment_document_is_not_listed_not_a_source_and_never_handed_over
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_facts.py
        checks:
        - test_showing_the_dossier_hands_over_no_document
        - test_every_address_on_the_page_is_one_the_platform_built
        - test_the_documents_tab_lists_each_document_once_with_its_address
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-3
      statement: Names, values and pointers from the Brain reach the page as text, and no log line carries them; a failed read is one plain message (502).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_facts.py
        checks:
        - test_mark_up_from_the_brain_comes_out_as_text
        - test_no_log_line_carries_a_name_a_value_or_a_pointer
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_failed_read_is_one_plain_message
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-4
      statement: 'A fact shown without a mark opens its source document on click: the document''s name and folder, and the address that opens it. Not the passage (its text and page): no per-thing route of the Core returns one.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_facts.py
        checks:
        - test_a_fact_with_a_source_passage_opens_its_document
        - test_a_fact_without_a_source_is_marked
        - test_a_fact_whose_source_the_person_was_not_handed_is_marked_and_its_document_stays_closed
        - test_a_fact_whose_passage_is_not_there_is_marked
        - test_no_fact_is_shown_with_a_source_unless_it_has_one
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-5
      statement: 'The related things are what the Core''s neighbours read hands this person, one hop away, the thing itself left out: counted per kind (by count, then by name; at most 20 kinds named, the rest and things without a kind under «Weitere Einträge», last), each kind in the plural from one table or with the name the Brain gives it; a row''s relation from the edges between the thing and it. A kind''s list and the documents sort, filter and page what was read; a position opens the same document whatever the sort, the filter and the page. A failed neighbours read is one line on the page and the rest of the dossier stands; a 404 or a graph switched off shows no kind tabs.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_one_tab_per_kind_with_its_count_in_the_plural
        - test_a_kinds_list_is_sorted_by_name_and_each_row_opens_that_things_dossier
        - test_a_rows_relation_stands_under_its_name
        - test_sorted_by_relation_when_the_kind_has_relations
        - test_the_filter_keeps_the_names_that_hold_it_and_is_shown_back
        - test_a_page_out_of_range_shows_the_nearest_one
        - test_an_unknown_kind_shows_the_overview_and_its_key_is_not_echoed
        - test_a_position_opens_the_same_document_whatever_the_sort_filter_and_page
        - test_a_failed_neighbours_read_is_one_line_and_the_dossier_still_opens
        - test_a_graph_switched_off_shows_no_kind_tabs_and_no_line
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_the_start_rows_not_one_hop_away_and_unusable_ids_are_left_out
        - test_kinds_by_count_then_by_name_and_the_others_last
        - test_a_kind_in_the_table_in_its_plural_and_one_outside_with_its_own_name
        - test_relations_come_from_the_edges_between_the_start_and_the_thing
        - test_any_other_failure_is_unavailable_with_the_error_type_only
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-6
      statement: 'Names, relations and the filter text reach the page as text; every address on the lists is built by url_for (a sort key only when it is a known one, the filter cleaned and cut at 100 characters, the kind''s key only as the Core gave it); no log line carries a name, a relation or a filter text. The lists hand over nothing: they link to dossiers.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_a_name_a_relation_and_a_filter_holding_mark_up_come_out_as_text
        - test_every_address_on_the_pages_is_one_the_platform_built
        - test_the_page_links_keep_the_sort_and_the_filter
        - test_the_filter_is_cut_at_100_characters
        - test_no_log_line_carries_a_name_a_relation_or_a_filter_text
  http.GET.dossier._node_id.dokument._position:
    needs:
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id.dokument._position/N-1
      statement: The same as the dossier's (signed in, per-user accounts, the switch on); otherwise sign-in or 404, and the Core is not asked.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_the_address_that_opens_a_document_has_the_same_gate
        - test_without_per_user_accounts_nothing_answers
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id.dokument._position/P-1
      statement: 'The node''s documents are read again as the person, and the Core is asked whether the person may read the chosen one (document_readable, as the person); only then is that one document handed to the file routes, for that person alone. Not readable, a place outside the list, an experiment document or a failed read: the same 404 as a document that is not there, and nothing handed over.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_open.py
        checks:
        - test_a_click_hands_over_exactly_that_document_to_that_person
        - test_the_click_reads_the_node_and_asks_the_core_as_the_person
        - test_another_persons_click_hands_the_first_person_nothing
        - test_a_stale_assignment_is_not_handed_over_and_answers_as_a_missing_document
        - test_a_place_outside_the_list_is_a_404_and_asks_nothing_more
        - test_a_failed_read_is_a_404_and_hands_over_nothing
        - test_an_experiment_document_is_not_listed_not_a_source_and_never_handed_over
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_document_of_a_node_the_person_may_not_see_answers_as_one_of_a_missing_node
    - id: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id.dokument._position/P-2
      statement: 'The document opens where a search hit opens it: at its OneDrive or SharePoint address when it has one, a PDF in the browser''s viewer while the installation shows PDFs inline, otherwise the file handed over when the installation offers downloads; a document none of these reaches gets a plain message (409), and nothing is handed over.'
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_open.py
        checks:
        - test_a_click_hands_over_exactly_that_document_to_that_person
        - test_a_document_that_is_not_a_pdf_is_handed_over
        - test_without_inline_pdfs_a_pdf_is_handed_over_as_a_search_hit_offers_it
        - test_what_the_browser_cannot_open_is_a_plain_message_and_hands_over_nothing
uses:
- component: EXT-BRAIN-API
  operations:
  - graph-routes
  method: 'Per-thing reads below /secured/graph/ through the Platform''s client (knovas_client.py) on the Platform''s certificate, each signed as the person: GET /nodes/<id> (graph_node - the node, its assignments and its facts), GET /node-types/<id> and GET /node-types/<id>/schema (graph_get_many - the kind and the field names, for a type id that is a uuid); GET /nodes/<id>/neighbors?depth=1&include_edges=true (graph_neighbors - the related things and their edges, PMVP-30b) and GET /node-types/<id> for their kinds (graph_get_many, one round of at most 20); never the whole-graph export. And, per click on a document, GET /secured/document_readable (document_readable), as the person'
  protocol: HTTPS with mTLS
hides:
- How a fact's value is written as text, and the order of the facts.
- 'How a view keeps to the 25-node limit: one shared function (brain_views/limit.py: bounded, more_text, paged) and the marks in the mark-up that the frozen test counts (data-bv-node on what a view draws, data-bv-row on the rows of a list, which are paged at 50 and not drawn, data-bv-more on the link that opens the rest).'
- The mark-up and the class names of the dossier; the page is built from the shared page parts.
- 'The plural of a kind''s name: one table in brain_views/related.py (the legal pack''s kinds, the pilot''s kinds, the reference screens'' words); the Brain has no plural.'
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map K4).
- at: /status
  why: 'Live or planned is not read from the code: the dossier (PMVP-30a) is built on the Platform MVP''s branch, behind a switch that is off by default, and not on main yet.'
- at: /source_paths
  why: 'The plan builds the views as a new module, src/brain_views/ (§ 5.2); PMVP-30a added the dossier (brain_views/dossier.py, its route file, its template and its stylesheet). The existing views the plan''s state table lists under "Brain views" (Ansichten, Cortex, custom views) are left out: they read the tenant''s whole edge list once per person (graph_views/topology.py) and have no 25-node limit (plan § 3), so they could not keep P-1 and P-3. If PMVP-32 takes the plan''s cut (2) - the process line becomes the existing Ablauf view (graph_views/process_views.py and its page) in the new look - that code joins this card or gets one of its own; the coordinator decides then. The wiring (one register_blueprint call in app.py) and the switch''s registry entry (platform_settings.py) stay in files no card holds.'
- at: /operations
  why: 'The three the code reader shows. create_brain_views_blueprint has no line: the plan''s contract deltas (section 7) give none, and its one caller is the web app''s wiring. PMVP-30b to PMVP-34 add theirs.'
- at: /uses
  why: 'Declared, as the code reader does not follow the client''s methods to the routes they call. /secured/document_readable is on no operation of EXT-BRAIN-API yet (FU-15). Used from the web app as well, which has no card: the file routes (document_external_open, preview_document, download_document), the grant (_grant_for_current_user), the search''s enrichment of a row (_enhance_listing_rows) and its open settings (pdf_inline_in_browser, _download_open_enabled), and the Experimente module''s split (experiments_search.split).'
- at: L2-PLATFORM-BRAIN-VIEWS/*/P-2
  why: 'Does not hold yet, so it has no evidence: a fact''s source is the Core''s provenance_pointer (the document), provenance_chunk_id (the passage) and provenance_status, and no per-thing route returns a passage''s text or its page. What holds is http.GET.dossier._node_id/P-4: a fact without a mark opens its source document. Follow-up FU-38; the Core request CR-2 (docs/platform-mvp/core-requests.md, one chunk read by its id) would close it. A fact whose document the Core did not list among the node''s documents for this person is marked «ohne Beleg» even when it has a passage: the Core shows a fact when any one of its evidence chunks is readable (graph_access.visible_fact_ids), so its provenance document is not known to be readable.'
- at: L2-PLATFORM-BRAIN-VIEWS/http.GET.dossier._node_id/P-5
  why: 'Until the Core''s CR-R1 the counts and lists are what the Core hands the caller: under «Aus» (every tenant today) every person sees every related thing; B-07 (facts and counts follow the person''s rights) is a 12 January row. The lists sort and filter on the Platform over what was read (decision D4 of PMVP-30b): the Core has no paged neighbours read, so a hub with thousands of neighbours is read whole on each page view; accepted for the MVP. The Core''s neighbours read applies no limit of its own at depth 1.'
- at: L2-PLATFORM-BRAIN-VIEWS/*/P-3
  why: 'The evidence covers the dossier and its related things (PMVP-30a, PMVP-30b); PMVP-32 brings its own. The whole-graph export answers an error for the Knovas tenant (inbox IN-2026-11-10-03, plan § 3).'
