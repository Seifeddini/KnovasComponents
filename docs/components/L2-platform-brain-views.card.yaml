card: 2
id: L2-PLATFORM-BRAIN-VIEWS
name: Brain views
kind: code
owner: ROLE-ENGINE-OWNER
status: planned
level: 2
parent: L1-WORKSPACE
source_paths:
- KnovasPlatform/components/docbridge_integration/src/brain_views/__init__.py
- KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py
- KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py
- KnovasPlatform/components/docbridge_integration/src/brain_views/lists.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
- KnovasPlatform/components/docbridge_integration/src/web_interface/static/css/brain_views.css
purpose: Holds the members' Brain views together (one blueprint behind one switch and one gate, the 25-node limit every view
  draws through, their stylesheet), so that each view shows one thing, one statement's evidence or one process instance as
  a bounded view with one starting point.
responsible_for:
- id: L2-PLATFORM-BRAIN-VIEWS/R-1
  aliases:
  - RESP-01
  statement: Shows one thing, one statement's evidence, or one process instance as a bounded view.
  code:
  - KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py
  - KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py
  - KnovasPlatform/components/docbridge_integration/src/brain_views/lists.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
- id: L2-PLATFORM-BRAIN-VIEWS/R-4
  statement: 'The 25-node limit as one shared function (PMVP-34): brain_views/limit.py (bounded, more_text, paged) and the
    marks a view''s mark-up carries (data-bv-node, data-bv-row, data-bv-more); the Brain views'' blueprint, the switch brain_views.enabled
    and the gate every view''s route stands behind; the reads every view makes the same way (brain_views/reads.py: the id
    checks, the node read as the person, NotFound and Unavailable; moved from dossier.py by PMVP-32a); the lists'' sort, filter
    and pages (brain_views/lists.py; moved from related.py and the routes by PMVP-32a).'
  code:
  - KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py
  - KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py
  - KnovasPlatform/components/docbridge_integration/src/brain_views/lists.py
  - KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py
not_responsible_for:
- 'The dossier and its lists (L2-PLATFORM-DOSSIER) and the process line (L2-PLATFORM-PROCESS-LINE): their routes are attached
  to this card''s blueprint, behind its switch and gate.'
- 'The modellers'' views of the Platform: Ansichten (Graph, Ablauf, Baum, Board, Liste, Matrix, Definitionen, Dokumentation,
  Lücken), Cortex and the custom views. They read the tenant''s whole edge list (graph_views/topology.py) and stay outside
  this card (graph_views/, views_routes.py, ontology_graph.py, custom_views/).'
- A whole-graph screen for members; a member reaches a view from a result, an answer or a name typed into the box (B-02, B-05).
- The switch's place on the settings page and its storage (platform_settings.py, settings_routes.py); this card holds what
  the one registry entry means.
terms:
- Beleg-Spur (evidence trail - the way from a statement to its passage and document)
operations:
- id: call.web_interface.brain_views_routes.create_brain_views_blueprint
  name: create_brain_views_blueprint - builds the Brain views' blueprint; the web app registers it with its identity gate,
    its one Knovas client, the settings, its document grant and the frame's values
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/web_interface/brain_views_routes.py#create_brain_views_blueprint
- id: call.brain_views.limit.bounded
  name: 'bounded(items, limit, reserved) - what a view draws: at most limit - reserved of the items'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py#bounded
- id: call.brain_views.limit.more_text
  name: more_text(rest) - the words beside the count that opens the rest
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py#more_text
- id: call.brain_views.limit.paged
  name: paged(items, page, size) - one page of a list, 50 rows by default
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py#paged
- id: call.brain_views.limit.page_number
  name: page_number(value) - a page number as an address gives it
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/limit.py#page_number
- id: call.brain_views.reads.node_payload
  name: 'node_payload(client, node_id) - GET /nodes/<id> as the person: the answer and its node'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py#node_payload
- id: call.brain_views.reads.valid_node_id
  name: valid_node_id(id) - whether a node id may go into an address
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py#valid_node_id
- id: call.brain_views.reads.valid_type_id
  name: valid_type_id(id) - whether a node type id may go into an address
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py#valid_type_id
- id: call.brain_views.lists.listing
  name: 'listing(items, args, href, keep, name, relation) - one list: sorted, filtered, 50 a page'
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/lists.py#listing
- id: call.brain_views.lists.sort_key
  name: sort_key(text) - a name as the lists sort it
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/lists.py#sort_key
- id: call.brain_views.reads.NotFound
  name: NotFound - the answer for a thing that does not exist or that the person may not see
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py#NotFound
- id: call.brain_views.reads.Unavailable
  name: Unavailable - the answer when the Core did not answer a read
  entrance: call
  ref: KnovasPlatform/components/docbridge_integration/src/brain_views/reads.py#Unavailable
contract:
  '*':
    needs:
    - id: L2-PLATFORM-BRAIN-VIEWS/*/N-1
      aliases:
      - PRE-01
      statement: The view is opened with exactly one starting point.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_there_is_no_dossier_without_exactly_one_node
        - test_a_malformed_id_is_not_sent_to_the_core
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_a_hidden_or_missing_thing_answers_404_and_its_neighbours_are_not_read
        - test_the_starting_thing_and_what_is_two_hops_away_are_never_counted
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_a_malformed_start_is_not_sent
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_page.py
        checks:
        - test_a_hidden_or_missing_thing_answers_404_as_the_dossier_does
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/*/P-1
      aliases:
      - POST-01
      statement: At most 25 nodes are drawn; the remainder is a count that opens a list.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp34_view_limit_acceptance.py
        checks:
        - test_the_limit_is_25
        - test_bounded_shows_at_most_25_in_the_order_given
        - test_bounded_refuses_more_than_25_and_negative_numbers
        - test_every_view_page_draws_at_most_25
        - test_the_rest_is_a_count_that_opens_a_list
        - test_the_dossier_draws_its_thing_and_lists_its_facts
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_the_overview_draws_nothing_but_the_thing
        - test_one_tab_per_kind_with_its_count_in_the_plural
        - test_a_list_has_pages_of_50
        - test_documents_are_sorted_filtered_and_paged
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_page.py
        checks:
        - test_thirty_main_steps_draw_at_most_25_in_rows_of_about_twelve
    - id: L2-PLATFORM-BRAIN-VIEWS/*/P-3
      aliases:
      - POST-03
      statement: The view calls per-thing routes only, never a whole-tenant read.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_every_read_is_a_per_thing_read_made_as_the_person_signed_in
        - test_no_whole_tenant_read_even_without_a_kind
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_one_neighbours_read_and_one_round_of_kind_reads_per_page_as_the_person
        - test_no_whole_tenant_read_on_any_tab
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_one_neighbours_read_and_one_round_of_kind_reads
        - test_at_most_twenty_kinds_are_named_and_the_rest_fall_under_the_others
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_page.py
        checks:
        - test_no_whole_tenant_read_on_any_of_the_pages
  call.brain_views.limit.bounded:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.limit.bounded/P-1
      statement: At most limit - reserved of the items, in the order given, with the rest and the total; a limit above 25,
        a negative number or a reserved above the limit is refused (ValueError).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp34_view_limit_acceptance.py
        checks:
        - test_bounded_shows_at_most_25_in_the_order_given
        - test_bounded_counts_what_the_view_draws_anyway
        - test_bounded_refuses_more_than_25_and_negative_numbers
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_limit_unit.py
        checks:
        - test_a_view_that_draws_more_than_its_limit_anyway_is_refused
  call.brain_views.limit.more_text:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.limit.more_text/P-1
      statement: «» for none, «1 weiterer Eintrag», «<n> weitere»; a negative or non-whole count is refused.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp34_view_limit_acceptance.py
        checks:
        - test_more_text_says_how_many_more
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_limit_unit.py
        checks:
        - test_more_text_refuses_what_is_no_count
  call.brain_views.limit.paged:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.limit.paged/P-1
      statement: The rows of that page, its number, the pages and the total; a page out of range gives the nearest one.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_pmvp34_view_limit_acceptance.py
        checks:
        - test_paged_gives_pages_of_50_and_the_nearest_page_when_out_of_range
  call.brain_views.limit.page_number:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.limit.page_number/P-1
      statement: A whole number from 1; anything else is page 1.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_limit_unit.py
        checks:
        - test_a_page_number_as_an_address_gives_it
  call.brain_views.reads.node_payload:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.reads.node_payload/P-1
      statement: One per-thing read through the client handed in; NotFound for an id that is malformed, unknown, hidden from
        the person or when the graph is off (the same for all), Unavailable when the read fails.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_malformed_id_is_not_sent_to_the_core
        - test_a_node_the_person_may_not_see_answers_as_a_node_that_does_not_exist
        - test_a_failed_read_is_one_plain_message
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_read.py
        checks:
        - test_a_hidden_or_missing_thing_is_not_found
  call.brain_views.reads.valid_node_id:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.reads.valid_node_id/P-1
      statement: True only for a word of letters, digits and _.:- that starts with a letter or digit, at most 128 long.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_malformed_id_is_not_sent_to_the_core
  call.brain_views.reads.valid_type_id:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.reads.valid_type_id/P-1
      statement: True only for a uuid.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_type_id_that_is_not_a_uuid_goes_into_no_address
  call.brain_views.lists.listing:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.lists.listing/P-1
      statement: Filters and sorts what was read (name A-Z, Z-A, by relation when there are relations; the filter cleaned
        and cut at 100 characters) and gives one page with the form's fields and the page links; only a known sort key and
        the cleaned filter go into an address.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_page.py
        checks:
        - test_a_list_has_pages_of_50
        - test_the_page_links_keep_the_sort_and_the_filter
        - test_the_filter_is_cut_at_100_characters
        - test_every_address_on_the_pages_is_one_the_platform_built
  call.brain_views.lists.sort_key:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.lists.sort_key/P-1
      statement: Case, accents and spacing ignored; ß as ss.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_related_read.py
        checks:
        - test_the_sort_key_ignores_case_accents_and_spacing
  call.brain_views.reads.NotFound:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.reads.NotFound/P-1
      statement: One answer for both; the views turn it into the same 404.
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_node_the_person_may_not_see_answers_as_a_node_that_does_not_exist
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_page.py
        checks:
        - test_a_hidden_or_missing_thing_answers_404_as_the_dossier_does
  call.brain_views.reads.Unavailable:
    promises:
    - id: L2-PLATFORM-BRAIN-VIEWS/call.brain_views.reads.Unavailable/P-1
      statement: Carries the error's type name only, never the Core's text; the views show one plain message (502).
      risk_class: standard
      evidence:
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_dossier_page.py
        checks:
        - test_a_failed_read_is_one_plain_message
      - kind: test
        ref: KnovasPlatform/components/docbridge_integration/tests/test_brain_views_process_line_page.py
        checks:
        - test_a_failed_read_is_one_plain_message
uses:
- component: L2-PLATFORM-DOSSIER
  operations:
  - call.web_interface.dossier_routes.attach_dossier_routes
  expects: []
  method: the factory attaches the dossier's routes to its blueprint, with its gate
  protocol: in-process call
- component: L2-PLATFORM-PROCESS-LINE
  operations:
  - call.web_interface.process_line_routes.attach_process_line_routes
  expects: []
  method: the factory attaches the process line's route to its blueprint, with its gate
  protocol: in-process call
hides:
- 'How a view keeps to the 25-node limit: one shared function (brain_views/limit.py: bounded, more_text, paged) and the marks
  in the mark-up that the frozen test counts (data-bv-node on what a view draws, data-bv-row on the rows of a list, which
  are paged at 50 and not drawn, data-bv-more on the link that opens the rest).'
review:
- at: /owner
  why: Proposed owner, as for every card in this repository; one role per component is confirmed by a person (Software Map
    K4).
- at: /status
  why: 'Live or planned is not read from the code: the dossier (PMVP-30a) is built on the Platform MVP''s branch, behind a
    switch that is off by default, and not on main yet.'
- at: /source_paths
  why: 'PMVP-32a split the views into three cards for the context budget (together 17,839 tokens of 16,000 before the process
    line): this one keeps the blueprint, the switch and gate, the limit and the stylesheet; the dossier (L2-PLATFORM-DOSSIER)
    and the process line (L2-PLATFORM-PROCESS-LINE) hold their own code. Moved lines keep their old ids as aliases there.
    The wiring (one register_blueprint call in app.py) and the switch''s registry entry (platform_settings.py) stay in files
    no card holds. The modellers'' views (Ansichten, Cortex, custom views) are left out: they read the tenant''s whole edge
    list (graph_views/topology.py) and could not keep P-1 and P-3.'
- at: /operations
  why: 'create_brain_views_blueprint has no line: the plan''s contract deltas (section 7) give none, and its one caller is
    the web app''s wiring. PMVP-30b to PMVP-34 add theirs.'
- at: L2-PLATFORM-BRAIN-VIEWS/*/P-3
  why: The evidence covers the dossier, its related things and the process line (PMVP-30a, 30b, 32a). The whole-graph export
    answers an error for the Knovas tenant (inbox IN-2026-11-10-03, plan § 3).
