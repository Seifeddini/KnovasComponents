# The Knovas login throttle's shared zone. Goes to /etc/nginx/conf.d/ (http
# context), once per host, however many Knovas sites the host serves -- a zone
# defined inside each site file would clash as soon as there are two.
limit_req_zone $binary_remote_addr zone=knovas_login:10m rate=10r/m;

# The Knovas access-log format, for the same reason in the same place: a
# log_format is http-context only and a second definition of the name would
# clash. Time, method, status, size and duration -- no request line. nginx's
# default "combined" format logs "$request", the URI with its query string,
# and Knovas Platform URLs carry document pointers (preview and open routes),
# which name clients and matters. The site file selects it with
# `access_log ... knovas_privacy;`.
log_format knovas_privacy '$time_iso8601 $request_method $status $body_bytes_sent $request_time';
