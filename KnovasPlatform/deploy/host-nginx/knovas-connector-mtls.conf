# http context (/etc/nginx/conf.d/): the connector protocol's client-certificate terminator (S-6).
# $knovas_client_cert_sha256 is the SHA-256 of the client certificate nginx verified, empty otherwise
# (knovas-client-cert.js). knovas-platform.conf.example sends it as X-Client-Cert-Fingerprint once
# scripts/host-https.sh is given the connector client CA; without that it sends an empty header.
# Needs nginx's njs module (Ubuntu/Debian: sudo apt-get install -y libnginx-mod-http-js).
js_import knovas_client_cert from /etc/nginx/njs/knovas-client-cert.js;
js_set $knovas_client_cert_sha256 knovas_client_cert.sha256;
