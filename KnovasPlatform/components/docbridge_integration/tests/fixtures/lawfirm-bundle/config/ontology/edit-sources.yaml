    fix_at: status
  '*.step_history':
    editable: false
    source: loader
    key_path: '-'
    reason: derived by loader
    fix_at: status
  Matter.client:
    editable: true
    source: DMS
    key_path: client
  Contract.term_end:
    editable: true
    source: DMS
    key_path: term_end
