    editable: true
    source: Akten register
    key_path: Contract
  Matter:
    editable: true
    source: Akten register
    key_path: Matter
relations:
  Contract belongs_to_matter Matter:
    editable: true
    source: Akten folder
    key_path: folder
facts:
  '*.status':
    editable: true
    source: DMS
    key_path: status
  '*.current_step':
    editable: false
    source: loader
    key_path: '-'
