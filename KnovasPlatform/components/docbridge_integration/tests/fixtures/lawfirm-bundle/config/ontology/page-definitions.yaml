version: 1
pages:
- key: matter
  type: Matter
  name:
    de: Mandat
    en: Matter
  sections:
  - id: client
    title:
      de: Klient
      en: Client
    render: text
    facts:
    - client
    required: true
  - id: contracts
    title:
      de: Verträge
      en: Contracts
    render: table
    columns:
    - status
    - term_end
    paths:
