# Change classes per process, for change requests from the TRACE view (Step 7).
#
# A stand-in: the change classes belong in KnowledgeBase's process definition
# (processes.yaml → generated/process-definitions.json). Once a process
# carries `change_classes`, graph_views.change_requests reads them from there
# and this file is ignored for that process.
#
# minor:        PR only; the plan's step does not change.
# substantive:  PR + status back to the rework step + a decision record (DEC-…).
# rework:       from which steps a substantive change sends the plan back, to
#               which step, and the plan status that names that step
#               (processes.yaml status_map: draft|review -> brief).
# fields marked unmapped have no place in the plan file (feature-plan.template.md).

PROC-feature-lifecycle:
  instance_type: FeaturePlan
  minor: [title, description, owner, sources]
  substantive: [affected_components, capability, goal, requirements, risks]
  unmapped:
    target_date: "Die Plan-Vorlage hat kein Zieldatum; **Date** ist das Erstellungsdatum."
  rework:
    from_steps: [approved, implementing, verified, implemented]
    to_step: brief
    status: review
  rules_after_substantive: [R1]
  large_plan_rule: {rule: R7, fact: size_points, threshold_sp: 50}
