# Controlled relation list (Phase 0, Brain v0). The API takes a free-text
# relation name on an edge; only these names are used (DEC-0006), read as
# "node_lo <name> node_hi". `sedm_iri` names the SeDM relation the name maps to
# when one exists; null = promotion candidate for Phase E (A1 relation registry).
# Families follow the plan's ontology section; `sedm_family` the SeDM category.

version: 1
relations:
  # structure
  - {name: part_of,        family: Structure,    sedm_iri: int:partOf,        domain: [Component, BoundedContext, ProcessStep, Goal, PlatformTier, ApiServiceGroup, Function, Process, SourceFile], range: [BoundedContext, Product, Process, Goal, PlatformTier, Component, Company, ValueStream], inverse: contains, reason: "SeDM partOf."}
  - {name: member_of,      family: Structure,    sedm_iri: int:memberOf,      domain: [Persona, Role, Person], range: [Segment, Function], reason: "SeDM memberOf."}
  # realisation
  - {name: realises,       family: Realisation,  sedm_iri: int:realizes,      domain: [Component, BoundedContext], range: [Capability], reason: "SeDM realizes: engineering links a component to a capability."}
  - {name: offers,         family: Realisation,  sedm_iri: null,              domain: [PlatformTier, ApiServiceGroup], range: [Capability], reason: "candidate: management links a tier or API group to the capabilities it sells."}
  - {name: implements,     family: Realisation,  sedm_iri: int:implements,    domain: [SourceFile, Commit, Component], range: [FeaturePlan, ComponentContract], reason: "SeDM implements."}
  - {name: serves,         family: Realisation,  sedm_iri: null,              domain: [FeaturePlan], range: [Capability], reason: "candidate: rule 1 requires an approved plan to name its capability."}
  # verification
  - {name: verifies,       family: Verification, sedm_iri: int:verifies,      domain: [AlloyCheck, TestRun], range: [Invariant, ComponentContract, FeaturePlan, Component], reason: "SeDM verifies; a passing check on a plan is rule 2's evidence."}
  - {name: satisfies,      family: Verification, sedm_iri: int:satisfies,     domain: [ComponentContract], range: [Invariant], reason: "SeDM satisfies: a contract clause satisfies the invariant it names."}
  - {name: governs,        family: Verification, sedm_iri: int:governedBy,    domain: [ComponentContract], range: [Component], reason: "SeDM governedBy read from the contract's side."}
  - {name: describes,      family: Verification, sedm_iri: int:isAbout,       domain: [Record], range: [Component, BoundedContext, FeaturePlan, Invariant, Process], reason: "SeDM isAbout: a record describes a thing (rule 5)."}
  - {name: changes,        family: Realisation,  sedm_iri: null,              domain: [Commit, Release], range: [Component, SourceFile], reason: "candidate: the components and files a commit touched (from git); the components a release shipped."}
  - {name: defines,        family: Structure,    sedm_iri: int:partOf,        domain: [SourceFile], range: [Symbol], reason: "SeDM partOf read inversely: a file defines its symbols."}
  - {name: measures,       family: Verification, sedm_iri: null,              domain: [Metric, MetricSample, KeyResult, Tripwire], range: [Capability, Process, Goal, Metric], reason: "candidate: a metric measures a thing; a key result or tripwire measures a metric."}
  - {name: evidenced_by,   family: Verification, sedm_iri: int:supports,      domain: [Hypothesis, Record, Risk, Release, Decision], range: [EvidenceRecord, SourceFile, Result, Commit], reason: "SeDM supports, read from the claim's side; a release is evidenced by its commits, a campaign decision by its result."}
  - {name: keeps,          family: Verification, sedm_iri: null,              domain: [Component, FeaturePlan], range: [Invariant, ComponentContract], reason: "candidate: the component the invariant constrains (manifest golden_invariants); a plan's own Golden Invariants and contract deltas (DEC-0023)."}
  # dependency
  - {name: depends_on,     family: Dependency,   sedm_iri: int:dependsOn,     domain: [Component, FeaturePlan, Phase], range: [Component, FeaturePlan, Phase], reason: "SeDM dependsOn."}
  - {name: blocked_by,     family: Dependency,   sedm_iri: int:blockedBy,     domain: [FeaturePlan, Phase, Decision], range: [Decision, Risk, Gate], reason: "SeDM blockedBy."}
  - {name: gated_by,       family: Dependency,   sedm_iri: null,              domain: [Phase, FeaturePlan], range: [Gate], reason: "candidate: a phase ends at a gate."}
  # decision
  - {name: decided_by,     family: Decision,     sedm_iri: int:approvedBy,    domain: [Decision], range: [Role, Person], reason: "SeDM approvedBy."}
  - {name: motivated_by,   family: Decision,     sedm_iri: null,              domain: [Decision, FeaturePlan], range: [Goal, Hypothesis, Risk, Result], reason: "candidate."}
  - {name: affects,        family: Decision,     sedm_iri: int:affects,       domain: [Decision, Risk, FeaturePlan], range: [Component, BoundedContext, Capability, FeaturePlan, Process, Goal, Invariant], reason: "SeDM affects."}
  - {name: supersedes,     family: Decision,     sedm_iri: int:supersedes,    domain: [Decision, Record, Capability], range: [Decision, Record, Capability], reason: "SeDM supersedes."}
  - {name: examines,       family: Decision,     sedm_iri: int:concerns,      domain: [PreMortem], range: [FeaturePlan, Goal, Decision], reason: "SeDM concerns."}
  # risk
  - {name: threatens,      family: Risk,         sedm_iri: null,              domain: [Risk], range: [Goal, Capability, FeaturePlan, Phase], reason: "candidate: ISO 31000 risk-to-objective link."}
  - {name: mitigated_by,   family: Risk,         sedm_iri: null,              domain: [Risk], range: [FeaturePlan, Decision, Process, Tripwire], reason: "candidate."}
  - {name: accepted_by,    family: Risk,         sedm_iri: null,              domain: [Risk], range: [Role, Person], reason: "candidate."}
  - {name: raised_in,      family: Risk,         sedm_iri: int:derivedFrom,   domain: [Risk, Tripwire], range: [PreMortem], reason: "SeDM derivedFrom."}
  # ownership
  - {name: owned_by,       family: Ownership,    sedm_iri: int:ownedBy,       domain: [Risk, Goal, FeaturePlan, Decision, Process, PlatformTier, Capability, Metric, Campaign, Opportunity, Customer, Release], range: [Role, Person], reason: "SeDM ownedBy."}
  - {name: performed_by,   family: Ownership,    sedm_iri: int:performedBy,   domain: [Event, RunEvent, Experiment, TestRun], range: [Role, Person, Agent], reason: "SeDM performedBy."}
  - {name: held_by,        family: Ownership,    sedm_iri: int:roleOf,        domain: [Role], range: [Person], reason: "SeDM roleOf."}
  # process
  - {name: has_level,      family: Structure,    sedm_iri: null,              domain: [Spine], range: [SpineLevel], reason: "candidate: a spine definition → its levels, in order."}
  - {name: has_step,       family: Process,      sedm_iri: null,              domain: [Process], range: [ProcessStep], reason: "candidate: process definition → its states."}
  - {name: transitions_to, family: Process,      sedm_iri: int:precedes,      domain: [ProcessStep], range: [ProcessStep], reason: "SeDM precedes between steps (forward transitions)."}
  - {name: reworks_to,     family: Process,      sedm_iri: null,              domain: [ProcessStep], range: [ProcessStep], reason: "candidate: a rework transition back to an earlier step (processes.yaml `[from, to, rework]`); its own relation because the engine keys an edge by its unordered node pair, so the reverse of a transitions_to edge would be dropped (F8, P8)."}
  - {name: instance_of,    family: Process,      sedm_iri: int:conformsTo,    domain: [ProcessInstance, FeaturePlan, Opportunity, Experiment, Decision, Risk, Campaign, Release, Customer, Lead], range: [Process], reason: "SeDM conformsTo."}
  - {name: in_state,       family: Process,      sedm_iri: null,              domain: [ProcessInstance, FeaturePlan, Opportunity, Experiment, Decision, Risk, Campaign, Release, Customer, Lead], range: [ProcessStep], reason: "candidate; current step also kept as a fact for history."}
  - {name: advanced_by,    family: Process,      sedm_iri: int:triggeredBy,   domain: [ProcessInstance], range: [Event], reason: "SeDM triggeredBy."}
  - {name: touches,        family: Process,      sedm_iri: int:concerns,      domain: [Event, RunEvent], range: [Component, FeaturePlan, Decision, Risk, Opportunity, Process], reason: "SeDM concerns (object-centric event); a review touches the process it reviews."}
  # market
  - {name: justified_by,   family: Market,       sedm_iri: null,              domain: [FeaturePlan, Capability], range: [Hypothesis], reason: "candidate: pre-requirement traceability."}
  - {name: targets,        family: Market,       sedm_iri: null,              domain: [Campaign, MarketingAsset, Opportunity, Hypothesis], range: [Segment, Persona], reason: "candidate."}
  - {name: observed_in,    family: Market,       sedm_iri: null,              domain: [Hypothesis], range: [EvidenceRecord], reason: "candidate (the plan's name; evidenced_by is the SeDM-aligned form)."}
  - {name: tests,          family: Market,       sedm_iri: null,              domain: [Experiment, Campaign], range: [Hypothesis], reason: "candidate; a campaign is a registered experiment."}
  - {name: uses,           family: Market,       sedm_iri: null,              domain: [Campaign], range: [MarketingAsset], reason: "candidate: the one-pagers, decks and mails a campaign sends."}
  - {name: via,            family: Market,       sedm_iri: null,              domain: [Campaign], range: [Channel], reason: "candidate: the channel a campaign runs through (mail, LinkedIn, phone, event)."}
  - {name: produced,       family: Market,       sedm_iri: int:hasOutput,     domain: [Campaign], range: [Lead], reason: "SeDM hasOutput: the leads a campaign produced (account plus role, never a name)."}
  - {name: measured_by,    family: Market,       sedm_iri: null,              domain: [Campaign], range: [Metric], reason: "candidate: the metric a campaign's keep and kill thresholds are set on."}
  - {name: for_account,    family: Market,       sedm_iri: null,              domain: [Lead, Opportunity, Customer, Quote, Contract], range: [Account], reason: "candidate: the company a lead, deal, customer, quote or contract belongs to."}
  - {name: converts_to,    family: Market,       sedm_iri: int:precedes,      domain: [Lead, Opportunity, Quote, Contract], range: [Account, Quote, Contract, Customer], reason: "SeDM precedes along the sales branch."}
  - {name: in_market,      family: Market,       sedm_iri: int:locatedIn,     domain: [Segment, Account], range: [Market], reason: "SeDM locatedIn."}
  # goals
  - {name: has_key_result, family: Goals,        sedm_iri: null,              domain: [Goal], range: [KeyResult], reason: "candidate."}
  - {name: about,          family: Goals,        sedm_iri: int:isAbout,       domain: [Goal, Experiment, Metric, MetricSample, EvidenceRecord, Result], range: [Capability, Segment, Campaign, Process, Component, Goal], reason: "SeDM isAbout: the node a goal or experiment is about."}
  - {name: results_in,     family: Goals,        sedm_iri: int:hasOutput,     domain: [Experiment, Campaign], range: [Result, Decision], reason: "SeDM hasOutput."}
  # fallback (reported by rule R0 when used)
  - {name: related,        family: Semantic,     sedm_iri: int:relatedTo,     domain: ["*"], range: ["*"], reason: "API default; allowed but reported."}
