# Display names and plain-language descriptions for every node type, attribute, relation name and enum
# value in terms.yaml and relations.yaml (plan: "Descriptions and master data", Phase 2; rule 8).
# Written for a manager who has never seen the code or the ontology. German and English display names;
# one or two sentences; one real Knovas example; "confuse" = not to be confused with. First drafts by the
# agent on 2026-10-26; Siran and Jiannis review them in one sitting.
#
# Keys: types.<Type>, attributes.<Type>.<attribute> (common attributes under attributes._common),
# relations.<name>, enums.<Type>.<attribute>.<value>.

version: 1

types:
  Product:          {de: Produkt, en: Product, text: "Something Knovas sells as a whole: the Platform for end users or the API for software vendors.", example: "PROD-PLATFORM, the Knovas Platform.", confuse: "A platform tier (Core, Cortex, Nexus) is a level within the Platform product, not a product of its own.", meta: false}
  PlatformTier:     {de: Plattform-Stufe, en: Platform tier, text: "One of the three cumulative levels of the Platform that a customer buys: Core, Cortex or Nexus. Each includes the one before it.", example: "TIER-CORTEX, Core plus a simple brain, CHF 59.90 per user and month.", confuse: "An API service group groups the same capabilities for software vendors; it is not a tier.", meta: false}
  ApiServiceGroup:  {de: API-Dienstgruppe, en: API service group, text: "A grouping of the Knovas API as software vendors and partners see it (Ingest, Search, Graph, …). A proposal in Phase 0.", example: "API-SEARCH, everything about searching with cited passages.", confuse: "A platform tier is what end users buy; a service group is what developers integrate.", meta: false}
  Capability:       {de: Fähigkeit, en: Capability, text: "One thing a customer can do with Knovas, in plain words. It is the meeting point between what management sells and what engineering builds.", example: "CAP-06, file a document to the right client and matter.", confuse: "A component is a part of the software; a capability says what the customer gets, not how it is built.", meta: false}
  BoundedContext:   {de: Software-Bereich (L1), en: Software area (L1), text: "One of the nine large areas the Knovas software is divided into; each has its own responsibility and vocabulary and contains several components (L2).", example: "L1-RETRIEVE, everything about search and retrieval.", confuse: "A capability describes what a customer can do, not how the software is split.", meta: false}
  Component:        {de: Software-Komponente (L2/L3), en: Software component (L2/L3), text: "A part of the Knovas software with a clear responsibility, its own documentation and tests, inside one software area.", example: "L2-KNOWLEDGE-GRAPH, the knowledge graph the brain is built on.", confuse: "A source file is a single code file; a component is the unit engineers own and document.", meta: false}
  ComponentContract: {de: Komponentenvertrag, en: Component contract, text: "A promise a component makes: what must be true before it runs (precondition), what is true afterwards (postcondition), or what it is responsible for.", example: "L2-KNOWLEDGE-GRAPH/POST-P0-01, new chunks carry the access scope of their document from the moment they exist.", confuse: "An invariant holds for the whole system; a contract belongs to one component.", meta: false}
  Invariant:        {de: Goldene Invariante, en: Golden invariant, text: "A rule the whole system must keep at all times, written down with an id, verified by tests and formal checks.", example: "GI-GRAPH-13, document sorting only ever proposes; the client decides.", confuse: "A component contract is local to one part; an invariant is system-wide.", meta: false}
  FeaturePlan:      {de: Feature-Plan, en: Feature plan, text: "The written plan for a piece of work: what problem it solves, which components it changes, which contracts and invariants apply, and its status from draft to released.", example: "FEAT-2026-10-25-client-zero-phase-0, the plan for Phase 0 of Client Zero.", confuse: "A decision is one choice inside or around a plan; a plan is the whole piece of work.", meta: false}
  Phase:            {de: Phase, en: Phase, text: "A dated stretch of a plan that ends at a gate.", example: "Phase 1 of Client Zero, ground truth, ended with gate G1 on 25 Oct 2026.", meta: true}
  Gate:             {de: Gate (Prüfpunkt), en: Gate, text: "A checkpoint at the end of a phase with a pass criterion the brain itself can check; the next phase starts only when it passes.", example: "G1, every component, plan and invariant exists as a node and one feature is traced to its commits.", confuse: "A milestone is a date something is due; a gate is a test that must pass.", meta: true}
  Milestone:        {de: Meilenstein, en: Milestone, text: "A dated point in a plan, such as a launch or a contract, by which something must be done.", example: "MS-CORTEX-DEFAULT, Cortex is the default module in every law-firm deal.", meta: false}
  Goal:             {de: Ziel, en: Goal, text: "What must change by the end of a month or a quarter, owned by a role, measured by key results.", example: "GOAL-2026-Q4-client-zero-foundation, Knovas steers itself from its own brain by G1.", confuse: "A key result is the number that shows the goal moved; a goal is the outcome.", meta: false}
  KeyResult:        {de: Schlüsselergebnis, en: Key result, text: "A measurable target on one metric that shows whether a goal was reached: baseline, target and actual value.", example: "KR-plan-coverage-g1, approved plans that satisfy rule 1, from 0 % to 90 %.", meta: false}
  Metric:           {de: Kennzahl, en: Metric, text: "A named, computable measure with a unit and a direction (up or down is better).", example: "MET-staleness, the share of canonical records flagged stale.", confuse: "A metric sample is one measured value at a time; the metric is the definition.", meta: false}
  MetricSample:     {de: Messwert, en: Metric sample, text: "One measured value of a metric at a point in time, computed by a script, never typed by hand.", example: "Staleness 4 % measured on 25 Oct 2026.", meta: false}
  Decision:         {de: Entscheidung, en: Decision, text: "A recorded choice with its date, who made it, what it affects and what it replaces, moving from proposed to decided.", example: "DEC-0001, Client Zero runs on tenant af639810.", confuse: "A goal says where to go; a decision says which way was chosen.", meta: false}
  Risk:             {de: Risiko, en: Risk, text: "Something that could go wrong, with an owner, a review date and either a mitigation or an explicit acceptance.", example: "RISK-01, capacity: two founders plus thesis and research probe.", confuse: "A tripwire is the threshold that triggers action; a risk is what might happen.", meta: false}
  Hypothesis:       {de: Hypothese, en: Hypothesis, text: "A belief about customers or the product that has not been proven yet, with a status from asserted to validated or refuted.", example: "P-02.H01, an associate loses at least one hour per day searching for prior work.", confuse: "An experiment is the test; a hypothesis is the claim being tested.", meta: false}
  Experiment:       {de: Experiment, en: Experiment, text: "A registered test of a hypothesis with keep and kill thresholds set before it starts and an end date.", example: "EXP-stage-0-probe, does concept membership beat the cheap null on German legal text?", meta: false}
  Result:           {de: Ergebnis, en: Result, text: "The measured outcome of an experiment or campaign, with the verdict the evaluation proposes.", example: "RES-cmp-2026-11-icp01-2026-12-05: reply rate 12 % (8 of 66), keep.", meta: false}
  PreMortem:        {de: Pre-Mortem, en: Pre-mortem, text: "A session before a big plan or decision in which the team assumes it already failed and writes down why; it produces risks and tripwires.", example: "PM-client-zero-2026-10-24, eight ways Client Zero could fail by March 2027.", meta: false}
  Tripwire:         {de: Auslöseschwelle, en: Tripwire, text: "A threshold on a metric that forces a decision when it fires.", example: "TW-g1-no-trace, no feature traceable end to end at G1 means fix ingestion first.", meta: false}
  Process:          {de: Prozess (Definition), en: Process (definition), text: "How a kind of work moves: its steps and the allowed transitions, with an owner.", example: "PROC-decision, proposed, reviewed, decided or rejected, superseded.", confuse: "A process instance is one run of it; the process is the definition.", meta: true}
  ProcessStep:      {de: Prozessschritt, en: Process step, text: "One named state of a process.", example: "STEP-decision-decided.", meta: true}
  ProcessInstance:  {de: Prozessinstanz, en: Process instance, text: "One running case of a process, such as one feature moving through the feature lifecycle.", example: "The Client Zero Phase 0 plan as an instance of the feature lifecycle, currently approved.", meta: false}
  Event:            {de: Ereignis, en: Event, text: "Something that happened in the business at a time, done by a person, touching one or more things in the brain: a decision review held, a step entered, a campaign ended.", example: "A decision review that touches PROC-decision (the G2 ritual).", confuse: "A run event only records that the loader, CI or an agent ran; it is bookkeeping, not business.", meta: false}
  RunEvent:         {de: Laufereignis, en: Run event, text: "A bookkeeping record of one loader, CI or agent run: when it ran, who ran it and which plans, decisions, risks and components it changed. Instance views hide run events as a whole.", example: "EVT-loader-2026-10-27-195507-646946, a loader run that moved four plans.", confuse: "An event is a business fact such as a decision taken or a step entered; a run event only records that a script or agent ran.", meta: true}
  Function:         {de: Unternehmensfunktion, en: Function, text: "A part of the company such as research, engineering, sales or finance.", example: "FN-ENGINEERING.", meta: false}
  Role:             {de: Rolle, en: Role, text: "A hat a person wears, such as ontology steward or engine owner; roles own things, people hold roles.", example: "ROLE-ONTOLOGY-STEWARD, held by Siran.", confuse: "A persona is a customer archetype used in sales, not a role at Knovas.", meta: false}
  Person:           {de: Person, en: Person, text: "A named person at Knovas (no private data beyond the name).", example: "PERS-siran.", meta: false}
  Agent:            {de: KI-Agent, en: Agent, text: "An automated actor such as a Claude Code session or a scheduled job that reads and proposes in the brain.", example: "AGENT-claude-code.", meta: false}
  Market:           {de: Markt, en: Market, text: "A region and offering Knovas sells into.", example: "MKT-01, DACH, the True Graph company brain.", meta: false}
  Segment:          {de: Kundensegment (ICP), en: Customer segment (ICP), text: "A kind of customer Knovas targets, the ideal customer profile.", example: "ICP-03, law firms in Switzerland and Germany.", confuse: "A persona is a person inside such a customer; a segment is the company type.", meta: false}
  Persona:          {de: Persona, en: Persona, text: "An archetype of a person in the buying centre of a customer, with pains, goals and a role in the deal.", example: "P-10, the senior lawyer who is the practice group's memory.", meta: false}
  EvidenceRecord:   {de: Evidenzeintrag, en: Evidence record, text: "A piece of evidence for or against a hypothesis: an interview, a statistic, a source.", example: "EV-0001, Explorium data on DACH software vendors.", meta: false}
  Channel:          {de: Vertriebskanal, en: Channel, text: "How a segment is reached: direct, resellers, software vendors, events, content.", example: "CH-RESELLERS.", meta: false}
  Campaign:         {de: Kampagne, en: Campaign, text: "A marketing effort aimed at a segment and its personas, run as a registered experiment: it tests a persona hypothesis with a metric, a minimum sample and keep and kill thresholds set before it starts.", example: "CMP-2026-11-icp01-head-of-dev, a call campaign to 40 ICP-01 heads of development.", confuse: "An experiment is the general type; a campaign is the marketing kind of it and appears on the same board.", meta: false}
  MarketingAsset:   {de: Marketing-Material, en: Marketing asset, text: "A one-pager, deck, demo or case study written for a persona.", example: "The reseller intro deck.", meta: false}
  Lead:             {de: Lead, en: Lead, text: "A company that showed interest in a campaign, stored as the account plus the buying-centre role mapped to a persona, never as a name or contact detail (privacy rule).", example: "LEAD-cmp-2026-11-icp01-acc-0007, economic buyer (P-03) at account ACC-0007.", confuse: "An opportunity is a qualified deal with a stage; a lead is the first reply.", meta: false}
  Account:          {de: Kunde (Organisation), en: Account, text: "A prospect or customer organisation.", example: "Olymp AG.", meta: false}
  Opportunity:      {de: Verkaufschance, en: Opportunity, text: "A deal in the sales pipeline with its stage and its MEDDPICC qualification.", example: "A proof of concept with a Treuhand firm, stage quote.", meta: false}
  Quote:            {de: Angebot, en: Quote, text: "A priced offer: articles, seats, API buckets.", example: "20 Cortex seats for a law firm.", meta: false}
  Contract:         {de: Vertrag, en: Contract, text: "A signed agreement with a customer or partner.", example: "A reseller contract with a 25 % margin.", meta: false}
  Customer:         {de: Kunde (Beziehung), en: Customer, text: "An account that signed, from onboarding through renewal, expansion or churn.", example: "A pilot law firm in its first 90 days.", meta: false}
  Record:           {de: Dokument (Beschreibung), en: Record, text: "A human-written description of how things are: a README, a spec, a glossary page, a runbook. It must point at the ground truth it describes and is flagged stale when that changes.", example: "The README of L2-KNOWLEDGE-GRAPH.", confuse: "A source file is the code itself; a record describes it.", meta: false}
  Repository:       {de: Code-Repository, en: Repository, text: "A git repository holding code or documents.", example: "KnowledgeBase.", meta: false}
  SourceFile:       {de: Quelldatei, en: Source file, text: "One code or model file in a repository, with a content hash so changes are noticed.", example: "knovas-software/app/src/api/graph_api.py.", meta: false}
  Symbol:           {de: Code-Symbol, en: Symbol, text: "A class, function or method inside a source file.", example: "graph_api.py#create_node.", meta: false}
  Commit:           {de: Commit, en: Commit, text: "One recorded change to a repository, linked to the plan it implements and the components it touched.", example: "COMMIT-215b05af5f77, the merge of Client Zero Phase 0.", meta: false}
  TestRun:          {de: Testlauf, en: Test run, text: "The result of running one test module on a date: passed or failed, how many tests.", example: "tests/test_document_sorter.py on 25 Oct 2026, passed.", meta: false}
  AlloyCheck:       {de: Alloy-Prüfung, en: Alloy check, text: "One formal check of a system model (Alloy) recorded in the lockfile; it verifies a component or an invariant.", example: "core/identity.als#no_non_uuid_tenant.", confuse: "A test run executes code; an Alloy check proves a property of a model.", meta: false}
  Release:          {de: Release (Version), en: Release, text: "A versioned release of the software moving from candidate through verified and deployed to announced; recorded by the engine owner in releases.yaml because no git tag or deploy flow marks releases today.", example: "REL-2026.10-brain-mvp, the brain MVP on cloudscale prod, 24 Oct 2026.", confuse: "A deployment is one rollout to one environment; a release is the versioned whole that may be deployed to dev and then prod.", meta: false}
  Deployment:       {de: Deployment, en: Deployment, text: "A release of the software to an environment on a date.", example: "The brain MVP on cloudscale prod, 24 Oct 2026.", meta: false}
  Spine:            {de: Strukturachse, en: Spine, text: "An ordered list of levels — a type at each level and the relation that links it to the level above — along which the company's things hang: product, organisation, process, market. The Platform draws trees and matrices from it.", example: "SPINE-product: product → tier → capability → software area → component → sub-part.", confuse: "A process says how work moves through steps; a spine says how things are arranged under each other.", meta: true}
  SpineLevel:       {de: Ebene einer Strukturachse, en: Spine level, text: "One level of a spine: the node types allowed there and the relation to the parent level.", example: "SPINE-product/L3, the capability level, linked to its tier by offers.", meta: true}
  Company:          {de: Unternehmen, en: Company, text: "The company itself, root of the organisation spine.", example: "COMP-knovas, Knovas GmbH.", confuse: "An account is a customer company; the company is Knovas.", meta: false}
  ValueStream:      {de: Wertstrom, en: Value stream, text: "A group of processes that together deliver one kind of value, root of the process spine.", example: "VS-build: feature lifecycle, decision, risk review, release.", confuse: "A process is one flow of steps; a value stream groups several.", meta: false}
  GlossaryTerm:     {de: Glossarbegriff, en: Glossary term, text: "One entry of this glossary inside the brain: a type, attribute, relation or value with its plain-language description.", example: "The entry for BoundedContext.", meta: true}

relations:
  part_of:        {de: ist Teil von, en: is part of, sentence: "Component is part of Software area — the component belongs to this area; a tier is part of the product, a function of the company, a process of its value stream."}
  member_of:      {de: gehört zu, en: belongs to, sentence: "Persona belongs to Segment — this persona works at this kind of customer; a role belongs to a function."}
  realises:       {de: realisiert, en: realises, sentence: "Component realises Capability — engineering says this part of the software delivers this capability."}
  offers:         {de: bietet an, en: offers, sentence: "Tier offers Capability — management says this tier (or API group) sells this capability."}
  implements:     {de: implementiert, en: implements, sentence: "Commit implements Feature plan — this change is part of carrying out the plan."}
  serves:         {de: dient, en: serves, sentence: "Feature plan serves Capability — the plan exists to deliver or improve this capability."}
  verifies:       {de: verifiziert, en: verifies, sentence: "Alloy check verifies Invariant — this check proves the invariant holds; a test run verifies a plan or component."}
  measures:       {de: misst, en: measures, sentence: "Key result measures Metric — the key result is read from this metric."}
  evidenced_by:   {de: belegt durch, en: evidenced by, sentence: "Hypothesis is evidenced by Evidence record — this evidence speaks for the claim."}
  keeps:          {de: hält ein, en: keeps, sentence: "Component keeps Invariant — this component must uphold this invariant."}
  depends_on:     {de: hängt ab von, en: depends on, sentence: "Component depends on Component — it cannot work without the other."}
  blocked_by:     {de: blockiert durch, en: blocked by, sentence: "Feature plan is blocked by Decision — the plan cannot proceed until this is decided."}
  gated_by:       {de: freigegeben durch, en: gated by, sentence: "Phase is gated by Gate — the phase ends only when this gate passes."}
  decided_by:     {de: entschieden von, en: decided by, sentence: "Decision was decided by Person — this person or role made the call."}
  motivated_by:   {de: begründet durch, en: motivated by, sentence: "Feature plan is motivated by Goal — the plan exists because of this goal."}
  affects:        {de: betrifft, en: affects, sentence: "Decision affects Component — the decision changes this part of the software or this plan."}
  supersedes:     {de: ersetzt, en: supersedes, sentence: "Decision supersedes Decision — the newer one replaces the older one, which stays on record."}
  examines:       {de: untersucht, en: examines, sentence: "Pre-mortem examines Feature plan — this session looked at how the plan could fail."}
  threatens:      {de: gefährdet, en: threatens, sentence: "Risk threatens Goal — if the risk happens, this goal is in danger."}
  mitigated_by:   {de: gemindert durch, en: mitigated by, sentence: "Risk is mitigated by Feature plan — this work reduces the risk."}
  accepted_by:    {de: akzeptiert von, en: accepted by, sentence: "Risk was accepted by Role — this role decided to live with the risk."}
  raised_in:      {de: erkannt in, en: raised in, sentence: "Risk was raised in Pre-mortem — the risk came out of this session."}
  owned_by:       {de: verantwortet von, en: owned by, sentence: "Goal is owned by Role — this role is responsible for it."}
  performed_by:   {de: ausgeführt von, en: performed by, sentence: "Event was performed by Agent — this actor did it."}
  held_by:        {de: wahrgenommen von, en: held by, sentence: "Role is held by Person — this person currently wears the hat."}
  has_level:      {de: hat Ebene, en: has level, sentence: "Spine has level Spine level — this level belongs to the spine, in order."}
  has_step:       {de: hat Schritt, en: has step, sentence: "Process has step Process step — this state belongs to the process."}
  transitions_to: {de: geht über in, en: transitions to, sentence: "Process step transitions to Process step — the allowed next state."}
  reworks_to:     {de: geht zurück zu, en: reworks to, sentence: "Process step reworks to an earlier Process step — the instance goes back for rework, e.g. an approved plan back to its brief."}
  instance_of:    {de: ist Instanz von, en: is an instance of, sentence: "Feature plan is an instance of Process — this plan runs through this process."}
  in_state:       {de: befindet sich in, en: is in state, sentence: "Decision is in state Process step — where the case stands today."}
  advanced_by:    {de: vorangebracht durch, en: advanced by, sentence: "Process instance was advanced by Event — this event moved it to the next step."}
  touches:        {de: berührt, en: touches, sentence: "Event touches Feature plan — the event concerned this thing."}
  justified_by:   {de: gerechtfertigt durch, en: justified by, sentence: "Feature plan is justified by Hypothesis — we build it because we believe this about customers."}
  targets:        {de: zielt auf, en: targets, sentence: "Hypothesis targets Persona — the claim is about this persona or segment; a campaign targets a segment."}
  observed_in:    {de: beobachtet in, en: observed in, sentence: "Hypothesis was observed in Evidence record — the claim showed up in this evidence."}
  tests:          {de: prüft, en: tests, sentence: "Experiment tests Hypothesis — the experiment or campaign is designed to confirm or refute it."}
  uses:           {de: verwendet, en: uses, sentence: "Campaign uses Marketing asset — the campaign sends this one-pager, deck or mail."}
  via:            {de: über, en: via, sentence: "Campaign via Channel — the campaign runs through this channel."}
  produced:       {de: erzeugte, en: produced, sentence: "Campaign produced Lead — this reply came out of the campaign."}
  measured_by:    {de: gemessen mit, en: measured by, sentence: "Campaign is measured by Metric — the keep and kill thresholds are set on this metric."}
  for_account:    {de: für Kunde, en: for account, sentence: "Opportunity is for Account — the deal, lead, customer, quote or contract belongs to this company."}
  converts_to:    {de: wird zu, en: converts to, sentence: "Lead converts to Account — the sales branch moves forward one stage."}
  in_market:      {de: im Markt, en: in market, sentence: "Segment is in market Market — this customer type belongs to this market."}
  has_key_result: {de: hat Schlüsselergebnis, en: has key result, sentence: "Goal has key result Key result — this number shows whether the goal moved."}
  about:          {de: handelt von, en: is about, sentence: "Goal is about Capability — the goal concerns this capability, segment or process."}
  results_in:     {de: führt zu, en: results in, sentence: "Experiment results in Decision — the experiment ended in this outcome or decision."}
  related:        {de: verwandt mit, en: related to, sentence: "X is related to Y — the API's default when no better relation was named; reported by rule 0."}
  satisfies:      {de: erfüllt, en: satisfies, sentence: "Component contract satisfies Invariant — this clause is how the component upholds the invariant."}
  governs:        {de: regelt, en: governs, sentence: "Component contract governs Component — this clause applies to this component."}
  describes:      {de: beschreibt, en: describes, sentence: "Record describes Component — this document is about this part."}
  changes:        {de: ändert, en: changes, sentence: "Commit changes Component — the change touched files of this component."}
  defines:        {de: definiert, en: defines, sentence: "Source file defines Symbol — the class or function lives in this file."}

attributes:
  _common:
    key:          {de: Schlüssel, en: Key, text: "The stable id of the thing, as it is written in the repository (FEAT-…, L2-…, CAP-…)."}
    source:       {de: Quelle, en: Source, text: "The file, document or system the node was loaded from."}
    owner:        {de: Verantwortlich, en: Owner, text: "The role or person responsible for this thing, as its key (ROLE-…, PERS-…)."}
    owner_text:   {de: Verantwortlich (Freitext), en: Owner as written, text: "What the source wrote as owner when it names no role or person; the thing has no owner until someone assigns one."}
    last_confirmed: {de: Zuletzt bestätigt, en: Last confirmed, text: "When a person last checked that this is still true."}
  Product:
    audience:     {de: Zielgruppe, en: Audience, text: "Who the product is for."}
  PlatformTier:
    price_per_user_month: {de: Preis pro Nutzer und Monat, en: Price per user and month, text: "The list price, as text with currency."}
    includes_tier: {de: Enthält Stufe, en: Includes tier, text: "The tier this one builds on."}
  Capability:
    status:       {de: Status, en: Status, text: "How far the capability is: live, on request, built but off, not activated, research or planned."}
    tier:         {de: Plattform-Stufe, en: Platform tier, text: "The tier the capability belongs to, or 'to be decided'."}
  Component:
    alloy_status: {de: Alloy-Status, en: Alloy status, text: "Whether the component's formal models cover it, as the manifest says."}
    docs_status:  {de: Dokumentationsstatus, en: Documentation status, text: "Whether a component folder with README and spec exists."}
    source_paths: {de: Code-Pfade, en: Code paths, text: "Where the component's code lives, from the manifest."}
    display_name: {de: Anzeigename, en: Display name, text: "The component's human name from the manifest."}
  ComponentContract:
    kind:         {de: Art, en: Kind, text: "Precondition, postcondition or responsibility."}
  Invariant:
    catalog_status: {de: Katalogstatus, en: Catalog status, text: "Coverage as the catalog page states it (pytest, Alloy, planned)."}
    area:         {de: Bereich, en: Area, text: "The area of the system the invariant belongs to."}
  FeaturePlan:
    substantive_change: {de: Wesentliche Änderung, en: Substantive change, text: "What changed in the plan's components, invariants, contracts or Alloy models since it was approved; the plan should go back to its brief."}
    status:       {de: Status, en: Status, text: "Where the plan stands, from draft to released or killed."}
    current_step: {de: Aktueller Prozessschritt, en: Current step, text: "Where the instance stands in its process; written by the loader and dated with the day the instance entered the step (DEC-0018)."}
    step_history: {de: Schrittverlauf, en: Step history, text: "Every step the instance went through with its start and end day, kept by the loader; the flow view measures lead times from it."}
    owner:        {de: Verantwortlich, en: Owner, text: "Who owns the plan."}
    date:         {de: Datum, en: Date, text: "When the plan was written."}
    size_points:  {de: Grösse (Story Points), en: Size (story points), text: "Estimated size; above the threshold a pre-mortem is required."}
  Phase:
    starts_on:    {de: Beginn, en: Starts on, text: "First day of the phase."}
    ends_on:      {de: Ende, en: Ends on, text: "Last day of the phase."}
    effort:       {de: Aufwand, en: Effort, text: "Estimated effort in person-days."}
  Gate:
    passes_when:  {de: Besteht wenn, en: Passes when, text: "The criterion the brain checks."}
    due:          {de: Fällig am, en: Due, text: "The date the gate is planned for."}
    status:       {de: Status, en: Status, text: "Open, passed, failed or cut-scope."}
