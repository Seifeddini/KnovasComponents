<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand }} Suche</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
</head>
<body>
    <div class="app-shell">
        {% include '_sidebar.html' %}

        <div class="app-content">
        <div class="container">
        <header class="site-header">
            <h1 class="site-greeting">
                Hallo,<br>
                <span class="site-greeting-question">was möchten Sie suchen?</span>
            </h1>
        </header>

        <main>
            <section class="search-section">
                <div class="search-box">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Durchsucht den Inhalt aller Dokumente" 
                        autofocus
                    >
                    <button id="searchButton" class="btn btn-primary">
                        <svg class="icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                        </svg>
                        Suchen
                    </button>
                </div>
            </section>

            <section class="results-section" id="resultsSection" style="display: none;">
                <div class="results-header">
                    <h2>Suchergebnisse<span id="resultsQuery" class="results-query"></span></h2>
                    <span id="resultsCount" class="results-count"></span>
                </div>
                <p class="results-notice" id="resultsNotice" hidden></p>
                <div id="resultsContainer" class="results-container">
                    <!-- Results will be dynamically inserted here -->
                </div>
                <div class="results-more">
                    <button type="button" id="loadMoreButton" class="btn btn-outline" hidden>
                        Mehr laden
                    </button>
                </div>
            </section>
        </main>

        <!-- Natives <dialog>: bringt Backdrop, Escape, Fokusfalle und inerten
             Hintergrund mit, statt dass wir jedes Stueck selbst bauen. -->
        <dialog class="preview-dialog" id="previewDialog" aria-labelledby="previewTitle">
            <header class="preview-dialog-header">
                <div class="preview-dialog-heading">
                    <h2 class="preview-title" id="previewTitle"></h2>
                    <p class="preview-meta" id="previewMeta"></p>
                </div>
                <div class="preview-dialog-controls">
                    <button type="button" class="preview-icon-button" id="previewPrev"
                            aria-label="Vorheriges Dokument" title="Vorheriges Dokument (Pfeil hoch)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </button>
                    <span class="preview-position" id="previewPosition" aria-live="polite"></span>
                    <button type="button" class="preview-icon-button" id="previewNext"
                            aria-label="Nächstes Dokument" title="Nächstes Dokument (Pfeil runter)">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m9 18 6-6-6-6"/>
                        </svg>
                    </button>
                    <button type="button" class="preview-icon-button preview-icon-button--close"
                            id="previewClose" aria-label="Vorschau schliessen" title="Schliessen">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
                        </svg>
                    </button>
                </div>
            </header>
            <div class="preview-actionbar">
                <div class="preview-actions" id="previewActions"></div>
                <!-- Fundstellen-Navigation: nur sichtbar, wenn es mehr als eine
                     gibt. Bei einem einzigen Treffer waere "1 von 1" mit zwei
                     toten Pfeilen daneben nur Ballast. -->
                <div class="preview-findings-nav" id="previewFindingsNav" hidden>
                    <span class="preview-findings-position" id="previewFindingsPosition"
                          aria-live="polite"></span>
                    <button type="button" class="preview-icon-button" id="previewFindingPrev"
                            aria-label="Vorherige Fundstelle" title="Vorherige Fundstelle">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m18 15-6-6-6 6"/>
                        </svg>
                    </button>
                    <button type="button" class="preview-icon-button" id="previewFindingNext"
                            aria-label="Nächste Fundstelle" title="Nächste Fundstelle">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="2" stroke-linecap="round"
                             stroke-linejoin="round" aria-hidden="true" focusable="false">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="preview-content">
                <div class="preview-body" id="previewBody" tabindex="0"></div>
                <aside class="preview-sidebar" id="previewSidebar" hidden>
                    <section class="preview-sidebar-section" id="previewFindingsSection" hidden>
                        <h3 class="preview-sidebar-title">
                            <span id="previewFindingsTitle">Fundstellen</span><span id="previewFindingsCount"></span>
                        </h3>
                        <p class="preview-findings-note" id="previewFindingsNote" hidden>
                            Die gesuchten Wörter kommen in diesem Dokument nicht vor.
                            Angezeigt werden die inhaltlich nächsten Stellen.
                        </p>
                        <ol class="preview-findings-list" id="previewFindings"></ol>
                    </section>
                    <section class="preview-sidebar-section" id="previewDocDataSection" hidden>
                        <h3 class="preview-sidebar-title">Dokumentdaten</h3>
                        <dl class="preview-docdata" id="previewDocData"></dl>
                    </section>
                </aside>
            </div>
        </dialog>

        </div>
        </div>
    </div>

    <script>
        window.__DOCBRIDGE__ = {
            csrfToken: {{ csrf_token|tojson }},
            browserClientOpenEnabled: {{ browser_client_open_enabled|tojson }},
            companionEnabled: {{ companion_enabled|tojson }},
            allowDegradedDownloadOpen: {{ allow_degraded_download_open|tojson }},
            openMappingConfigured: {{ open_mapping_configured|tojson }},
            pdfInlineInBrowser: {{ pdf_inline_in_browser|tojson }},
            onedriveEnrichmentLoaded: {{ onedrive_enrichment_loaded|tojson }},
            resultsPerPage: {{ results_per_page|tojson }},
            buildId: {{ build_id|tojson }},
        };
    </script>
    <script src="{{ url_for('static', filename='js/markdown.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
    <div class="toast-container" id="toastContainer" role="status" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
