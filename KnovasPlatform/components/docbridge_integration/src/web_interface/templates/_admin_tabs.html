{# Reiterleiste der Verwaltung: eine Quelle fuer alle Konsolenseiten (SS-387).
   Erwartet: admin_tab ('people' | 'documents' | 'access_groups').
   Der Link ist Darstellung; require_admin auf der Route ist die Kontrolle. #}
<nav class="tabs" aria-label="Verwaltung">
    <a href="{{ url_for('admin.people') }}"
       class="{% if admin_tab == 'people' %}active{% endif %}"
       {% if admin_tab == 'people' %}aria-current="page"{% endif %}>Personen</a>
    <a href="{{ url_for('admin.documents') }}"
       class="{% if admin_tab == 'documents' %}active{% endif %}"
       {% if admin_tab == 'documents' %}aria-current="page"{% endif %}>Dokumente</a>
    <a href="{{ url_for('admin.access_groups') }}"
       class="{% if admin_tab == 'access_groups' %}active{% endif %}"
       {% if admin_tab == 'access_groups' %}aria-current="page"{% endif %}>Zugriffsgruppen</a>
</nav>
