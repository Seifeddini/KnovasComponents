<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{{ brand }} Ansichten</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/views.css') }}?v={{ asset_version }}">
</head>
<body class="views-page" data-admin="{{ 'true' if is_admin else 'false' }}">
    <header class="views-header">
        <a class="views-brand" href="{{ url_for('ontology_page') }}" aria-label="Zurück zum Cortex">
            <img src="{{ url_for('static', filename='img/knovas-logo.svg') }}" alt="Knovas" width="96" height="13">
        </a>
        <h1 class="views-title">Ansichten</h1>
        <div class="views-picker" id="viewsPicker" hidden>
            <label class="visually-hidden" for="viewsSaved">Gespeicherte Ansicht</label>
            <select id="viewsSaved"></select>
            <button type="button" class="views-button" id="viewsSavedMenu" title="Speichern, teilen, Protokoll">Ansichten …</button>
        </div>
        <nav class="views-kinds" id="viewsKinds" aria-label="Darstellung">
            <button type="button" data-kind="graph" aria-pressed="true">Graph</button>
            <button type="button" data-kind="trace" aria-pressed="false">Ablauf</button>
            <button type="button" data-kind="board" aria-pressed="false">Board</button>
            <button type="button" data-kind="tree" aria-pressed="false">Baum</button>
            <button type="button" data-kind="matrix" aria-pressed="false">Matrix</button>
            <button type="button" data-kind="list" aria-pressed="false">Liste</button>
            <button type="button" data-kind="definitions" aria-pressed="false">Definitionen</button>
        </nav>
        <div class="views-freshness">
            <span id="viewsAsOf" class="views-asof" aria-live="polite"></span>
            <button type="button" id="viewsRefresh" class="views-icon-button" title="Neu laden (ohne Zwischenspeicher)"
                    aria-label="Neu laden">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            </button>
        </div>
    </header>

    {% if not graph_mode %}
    <main class="views-main"><p class="views-empty">Wissensnetz-Modus erforderlich</p></main>
    {% else %}
    <div class="views-toolbar" id="viewsToolbar">
        <button type="button" class="views-button" id="viewsStartButton" title="Startpunkt wählen">Start</button>
        <form class="views-search" id="viewsSearch" role="search" autocomplete="off">
            <label class="visually-hidden" for="viewsSearchInput">Suchen</label>
            <input id="viewsSearchInput" type="search" placeholder="Suchen: Name oder Schlüssel (FEAT-, L2-, DEC-, RISK-, GI-, CAP-)…">
            <ul class="views-search-results" id="viewsSearchResults" role="listbox" hidden></ul>
        </form>
        <label class="views-field" data-kinds="trace board">Prozess
            <select id="viewsProcess"></select>
        </label>
        <label class="views-field" data-kinds="tree matrix">Achse
            <select id="viewsSpine"></select>
        </label>
        <label class="views-field" data-kinds="tree matrix"><select id="viewsBranch" aria-label="Zweig"></select></label>
        <label class="views-field" data-kinds="matrix">Zeilen <select id="viewsRows"></select></label>
        <label class="views-field" data-kinds="matrix">Spalten <select id="viewsCols"></select></label>
        <label class="views-field" data-kinds="board"><select id="viewsFilterOwner" aria-label="Verantwortlich"></select></label>
        <label class="views-field" data-kinds="board"><select id="viewsFilterCapability" aria-label="Fähigkeit"></select></label>
        <label class="views-field" data-kinds="board"><select id="viewsFilterStatus" aria-label="Status"></select></label>
        <label class="views-toggle" data-kinds="graph trace list">
            <input type="checkbox" id="viewsMeta"> Meta-Ebene zeigen
        </label>
        <label class="views-threshold" data-kinds="graph">
            Gruppieren ab <input type="number" id="viewsThreshold" min="1" max="50" value="5"> Nachbarn
        </label>
        <p class="views-notice" id="viewsNotice" hidden></p>
    </div>

    <main class="views-main">
        <aside class="views-legend" id="viewsLegend" aria-label="Legende der Typen"></aside>
        <section class="views-stage" id="viewsStage" aria-live="polite">
            <div class="views-canvas" id="viewsCanvas"></div>
            <div class="views-doc" id="viewsDoc" hidden></div>
            <p class="views-empty" id="viewsEmpty">Einen Knoten suchen, um seine Umgebung zu sehen.</p>
        </section>
        <aside class="views-panel" id="viewsPanel" aria-label="Dossier" hidden>
            <header class="views-panel-head">
                <h2 id="viewsPanelTitle"></h2>
                <button type="button" class="views-icon-button" id="viewsPanelClose" aria-label="Schließen">×</button>
            </header>
            <div class="views-panel-body" id="viewsPanelBody"></div>
        </aside>
    </main>
    <div class="views-tooltip" id="viewsTooltip" role="tooltip" hidden></div>
    {% endif %}

    <script src="{{ url_for('static', filename='js/vendor/cytoscape.min.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_core.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_graph.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_definitions.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_change.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_process.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_spine.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_discover.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views_saved.js') }}?v={{ asset_version }}"></script>
    <script src="{{ url_for('static', filename='js/views.js') }}?v={{ asset_version }}"></script>
</body>
</html>
