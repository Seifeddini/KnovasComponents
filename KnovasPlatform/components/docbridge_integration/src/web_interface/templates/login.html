<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand }} Login</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <img class="login-logo"
                 src="{{ url_for('static', filename='img/knovas-logo.svg') }}"
                 alt="Knovas" width="180" height="30">
            <p class="login-slogan">Search Made Smarter</p>
            <h1 id="loginTitle">Login</h1>
            {# Der Mandantenname, nicht der Hersteller -- er sagt, in welcher
               Instanz man sich anmeldet. Das Logo darueber sagt nur, wessen
               Produkt es ist. #}
            {% if company_name %}<p class="login-subtitle">{{ company_name }}</p>{% endif %}

            {% if error %}
            <div class="login-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('login') }}" class="login-form">
                <input type="hidden" name="next" value="{{ next_url }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <label for="loginName">Benutzername</label>
                <input
                    type="text"
                    id="loginName"
                    name="login_name"
                    autocomplete="username"
                    required
                    autofocus
                >

                <label for="password">Passwort</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="btn btn-primary login-submit">Einloggen</button>
            </form>
        </section>
    </main>
</body>
</html>
