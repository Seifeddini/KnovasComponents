{# Line icons for the builder, 24-unit grid, drawn in currentColor.
   icon(name, size) -- one of the names below; unknown names draw nothing. #}
{% macro icon(name, size=16) -%}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor"
     stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'arbeitsbereich' -%}
    <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>
{%- elif name == 'verbinden' -%}
    <path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0V8zM12 17v4"/>
{%- elif name == 'ontologie' -%}
    <rect x="9" y="2.5" width="6" height="5" rx="1"/><rect x="2.5" y="16.5" width="6" height="5" rx="1"/><rect x="15.5" y="16.5" width="6" height="5" rx="1"/><path d="M12 7.5v4M5.5 16.5v-2.5h13v2.5"/>
{%- elif name == 'prozesse' -%}
    <circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.5 6h9M17.6 8.2l-4.2 7.6M6.4 8.2l4.2 7.6"/>
{%- elif name == 'quellen' -%}
    <ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/>
{%- elif name == 'ansichten' -%}
    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/>
{%- elif name == 'pruefen' -%}
    <path d="M12 21s8-3.5 8-10V5l-8-2.5L4 5v6c0 6.5 8 10 8 10z"/><path d="m8.5 12 2.5 2.5 4.5-5"/>
{%- elif name == 'betrieb' -%}
    <path d="M3 12h4l3-7 4 14 3-7h4"/>
{%- elif name == 'chevron-down' -%}
    <path d="m6 9 6 6 6-6"/>
{%- elif name == 'menu' -%}
    <path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'close' -%}
    <path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'check' -%}
    <path d="m5 12 5 5L20 7"/>
{%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14"/>
{%- elif name == 'trash' -%}
    <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
{%- elif name == 'pointer' -%}
    <path d="M5 3l14 7-6 2-2 6z"/>
{%- elif name == 'hand' -%}
    <path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L3 15.5a1.5 1.5 0 0 1 2.4-1.8L8 16"/>
{%- elif name == 'zoom-in' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M11 8v6M8 11h6"/>
{%- elif name == 'zoom-out' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6"/>
{%- elif name == 'fit' -%}
    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
{%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'back' -%}
    <path d="M15 18l-6-6 6-6"/>
{%- elif name == 'swatch' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h9"/>
{%- elif name == 'sun' -%}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
{%- elif name == 'moon' -%}
    <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif name == 'monitor' -%}
    <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
{%- elif name == 'info' -%}
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>
{%- endif -%}
</svg>
{%- endmacro %}
