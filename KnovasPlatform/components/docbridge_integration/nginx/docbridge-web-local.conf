server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # Security response headers. NOTE: this vhost serves plain HTTP for trusted-LAN
    # / dev use, so HSTS is intentionally omitted (it must not be sent over HTTP).
    # For production, terminate TLS at the host nginx (deploy/host-nginx/) which
    # additionally sets Strict-Transport-Security. See docs/setup.md §7.
    # SAMEORIGIN statt DENY: die App bettet eigene Dokumentvorschauen als
    # <iframe> ein. Framing durch fremde Herkuenfte bleibt verboten.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # Docker's embedded DNS, with the upstream in a variable so nginx
        # re-resolves per request instead of once at startup. A plain
        # `proxy_pass http://docbridge-web:5000` caches the container's IP for
        # the life of the worker, so every `docker compose up` that recreates
        # docbridge-web without also recreating nginx leaves this proxying to an
        # address nothing answers on -- 502 on every page while `/health` below,
        # served by nginx itself, still cheerfully returns ok.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://docbridge-web:5000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
