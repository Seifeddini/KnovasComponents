# Access log without the request line. nginx:alpine's default format logs
# "$request" -- the URI with its query string -- and the Platform's URLs can
# carry document pointers (preview and open routes), which name clients and
# matters. Method, status, size and time are enough to operate the proxy.
# log_format sits outside the server block: conf.d files are included in the
# http context, the only one log_format is allowed in.
log_format knovas_privacy '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    # Inside the server block, so it replaces the http-level default
    # access_log instead of logging every request a second time.
    access_log /dev/stdout knovas_privacy;

    client_max_body_size 32m;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://docbridge-web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # At least gunicorn's --timeout (DOCBRIDGE_WEB_TIMEOUT, default 180 s):
        # an admin upload may extract until its 120 s ceiling and must still
        # get its answer through, not a 504.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }
}
