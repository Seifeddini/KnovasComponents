# Unified Knovas stack: RemoteController (localhost) + KnovasPlatform (localhost → host nginx HTTPS).
# Usage: ./scripts/setup.sh && ./scripts/start.sh
#
# No container_name on any service: Compose prefixes containers, volumes and
# the network with the checkout directory (KnovasDemo → knovasdemo-platform-db-1),
# so a second copy on the same host can start. Host ports are
# DOCBRIDGE_WEB_PORT / RC_HOST_PORT; start.sh picks the next free ones.

services:
  # The firm's own identity store: accounts, roles, access-group grants,
  # approvals and the audit record. Deliberately NOT the Knovas-operated
  # PostgreSQL — staff names and credentials never cross into the tenant.
  #
  # No `ports:` on purpose. Reachable only on knovas-internal, so the admin
  # console is the single firm-facing surface. To inspect it by hand:
  #   docker compose --env-file knovas.env exec platform-db psql -U platform -d knovas_platform
  #
  # BACK THIS UP. It holds every account and every access-group grant; losing
  # it means the firm cannot log in and cannot prove who could see what.
  platform-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-platform}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-knovas_platform}
      POSTGRES_PASSWORD_FILE: /run/secrets/platform_db_password
    secrets:
      - platform_db_password
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PLATFORM_DB_USER:-platform} -d ${PLATFORM_DB_NAME:-knovas_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - knovas-internal

  remote-controller:
    build: ./RemoteController
    image: remote-controller:0.1.1
    env_file:
      - ./RemoteController/.env.generated
    volumes:
      - ./certs:/certs:ro
      - ${KNOVAS_DOCUMENTS_PATH}:/mnt/documents:ro
      - rc-config:/app/config
      - rc-state:/var/rc-state
      # The Platform's broker key directory. It holds the PRIVATE key too, and
      # :ro does not hide it -- what makes it unreadable here is that
      # docbridge-web runs as root (KnovasPlatform/.../Dockerfile has no USER)
      # and writes broker_ed25519.pem as root:root 0600, while RemoteController
      # runs as uid 10001. Adding a USER to the Platform image, or running
      # RemoteController as root, would expose the key that can assert any of
      # the firm's people to Knovas. RemoteController refuses to start if it
      # can read the file (auth/platform_principal.py).
      - docbridge_broker_key:/app/secrets/broker:ro
    environment:
      RC_PLATFORM_BROKER_PUBKEY_PATH: /app/secrets/broker/broker_ed25519.pub
      # The console's "Speichern und uebertragen" writes GET/POST /sync/config;
      # that API is off by default and the push fails at its first call without this.
      RC_SYNC_CONFIG_API_ENABLED: "true"
    ports:
      - "127.0.0.1:${RC_HOST_PORT:-5001}:5001"
    restart: unless-stopped
    networks:
      - knovas-internal

  docbridge-web:
    image: docbridge-web-clientbundle:latest
    build:
      context: ./KnovasPlatform/components/docbridge_integration
      dockerfile: Dockerfile
    env_file:
      - ./KnovasPlatform/.env.generated
    environment:
      PLATFORM_DB_HOST: platform-db
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-knovas_platform}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-platform}
      PLATFORM_DB_PASSWORD_FILE: /run/secrets/platform_db_password
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?set PLATFORM_ADMIN_EMAIL in knovas.env — the Platform has no default account}
      # Set it and the first administrator gets that password, which the operator
      # already holds so nothing is written to disk. Leave it empty and one is
      # generated into PLATFORM_ADMIN_BOOTSTRAP_PATH -- which defaults to /run,
      # inside the container, and therefore does not survive the next
      # `docker compose up` that recreates docbridge-web. Bootstrap only runs on
      # a database with no accounts at all, so losing that file before reading it
      # means the account exists with a password nobody knows.
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_BOOTSTRAP_PATH: ${PLATFORM_ADMIN_BOOTSTRAP_PATH:-/app/data/platform-admin-bootstrap}
      # Account lockout after repeated failures. 0 attempts switches it off.
      IDENTITY_ACCOUNT_LOCKOUT_ATTEMPTS: ${IDENTITY_ACCOUNT_LOCKOUT_ATTEMPTS:-5}
      IDENTITY_ACCOUNT_LOCKOUT_MINUTES: ${IDENTITY_ACCOUNT_LOCKOUT_MINUTES:-15}
      PLATFORM_BROKER_KEY_DIR: ${PLATFORM_BROKER_KEY_DIR:-/app/secrets/broker}
    secrets:
      - platform_db_password
    depends_on:
      platform-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5000"
    volumes:
      - ./KnovasPlatform/components/docbridge_integration/config:/app/config:ro
      - docbridge_integration_logs:/app/logs
      - docbridge_integration_data:/app/data
      # The broker signing key. Named volume, never a bind mount into the
      # repo: recreating the container without it silently rotates the key.
      - docbridge_broker_key:/app/secrets/broker
      - ${KNOVAS_DOCUMENTS_PATH}:/mnt/autodoc:ro
      - ./certs:/app/certs:ro
      - rc-state:/var/rc-state:ro
      # Writable, not ro: the Cortex graph is customer-maintained. Types,
      # entities and links are created by the user and the store writes them
      # back into the fixture. On a ro mount that fails, is only logged, and
      # looks like success in the UI until the next reload.
      - ./KnovasPlatform/docbridge_test_data/ontology:/mnt/ontology
    # --access-logfile=- puts every request on stdout. Without it the log shows
    # only what the application chooses to say, so a 403 from a route guard, or a
    # page that renders perfectly, are both completely silent -- and an empty
    # `docker compose logs | grep` reads as "the request never arrived" when it
    # means "nothing here logs requests".
    command: >
      sh -c "mkdir -p $${PLATFORM_BROKER_KEY_DIR:-/app/secrets/broker} && gunicorn
      --workers=$${DOCBRIDGE_WEB_WORKERS:-2}
      --threads=$${DOCBRIDGE_WEB_THREADS:-4}
      --timeout=$${DOCBRIDGE_WEB_TIMEOUT:-120}
      --bind=0.0.0.0:5000
      --access-logfile=-
      web_interface.wsgi:app"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/stats', timeout=5)"]
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - knovas-internal

  docbridge-web-nginx:
    image: nginx:alpine
    depends_on:
      docbridge-web:
        condition: service_healthy
    ports:
      # Localhost by default: with a reverse proxy in front, nothing should reach
      # the app directly. Set DOCBRIDGE_WEB_BIND=0.0.0.0 in knovas.env to publish
      # on the LAN instead -- the posture the per-component stack used to have.
      # Do that only together with WEB_SESSION_COOKIE_SECURE=false, or browsers
      # drop the session cookie over plain HTTP and login silently never sticks.
      - "${DOCBRIDGE_WEB_BIND:-127.0.0.1}:${DOCBRIDGE_WEB_PORT:-8081}:80"
    volumes:
      - ./KnovasPlatform/components/docbridge_integration/nginx/docbridge-web-local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost/health"]
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - knovas-internal

  # Offline demo API, so the search UI can be shown without a Knovas tenant.
  # Profile-gated: `docker compose --profile mock up -d --build`, never part of
  # a default start. See KnovasPlatform/docs/demo.md.
  knovas-mock:
    build:
      context: ./KnovasPlatform/mock_knovas_api
      dockerfile: Dockerfile
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      timeout: 10s
      interval: 20s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    profiles:
      - mock
    networks:
      - knovas-internal

networks:
  knovas-internal:
    driver: bridge

volumes:
  docbridge_broker_key:
  rc-config:
  rc-state:
  docbridge_integration_data:
  docbridge_integration_logs:
  platform_db_data:

secrets:
  # Generated by scripts/setup.sh into ./secrets/, mode 0600. A file rather
  # than an environment variable so the value does not appear in
  # `docker inspect`, in the process list, or in a support bundle.
  platform_db_password:
    file: ./secrets/platform_db_password
