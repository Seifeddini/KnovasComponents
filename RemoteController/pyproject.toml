[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-controller"
version = "0.3.0"
description = "Knovas Connector (customer-hosted) — discover and sync local files to Knovas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0,<4",
    "requests>=2.31,<3",
    "cryptography>=42,<45",
    "jsonschema>=4.21,<5",
    "prometheus-client>=0.20,<1",
    "gunicorn>=22.0,<24",
    # The Platform's PyMuPDF (docbridge_integration/requirements.txt): one PDF
    # parser under both images and both CI jobs (spec L7). The Dockerfile
    # installs these dependencies before knovas-extract, whose
    # pymupdf>=1.24 floor this satisfies.
    "pymupdf==1.28.0",
    # No [markdown]: sync never asks for emit_markdown (sync/document_text.py)
    # — it cost ~8 s per document and parked mixed PDFs and large-table DOCX
    # through the expansion guard — and the extra pulled the PolyForm-NC
    # pymupdf-layout into the customer image. [html] (selectolax) stays so CI
    # and the image install one extras set; EML/MSG HTML bodies do not use it,
    # knovas-extract converts them with its own HTML-to-text helper. The Docker image adds [ocr]
    # (tesserocr; Linux wheels only) — see Dockerfile KNOVAS_EXTRACT_EXTRAS.
    "knovas-extract[pdf,docx,msg,html,sentences]>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "knovas_api: tests requiring real Knovas API connectivity (skipped by default)",
]
