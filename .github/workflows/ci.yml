name: CI

on:
  push:
    branches: [main, master]
  # Deliberately unfiltered: this work lands through stacked pull requests
  # whose base is another feature branch, and a base filter meant those PRs
  # carried no checks at all. Every pull request is built, whatever it targets.
  pull_request:

# Runners: trusted runs (pushes, and same-repository pull requests not opened by a bot) go to the self-hosted
# AWS box when the repository variable CI_RUNNER names its label (knovas-ci); forks and bots, or an unset
# CI_RUNNER, run on GitHub's runners. Since 2026-11-06: GitHub-hosted minutes are used up.
# One secret, read-only: KB_READ_TOKEN (Contents: read on the knowledge-base repository), given to the one step of
# knovas-platform that installs brain-runner and to nothing else. A fork's pull request has no secrets, and that
# step then fails with a message instead of skipping the runner's tests. Until the single-use runners are live, a
# same-repository pull request's knovas-platform job holds that read-only token on the shared box.
# A push to main or master goes to [self-hosted, knovas-ci-ephemeral] instead while the repository variable
# CI_EPHEMERAL_RUNNER is set: one fresh AWS instance per job, destroyed after it, never the shared box (K-D3;
# KnowledgeBase runbook docs/Docs/08_RUNBOOKS/Semantix_Runbooks/Ops/CI_Ephemeral_Runners.md). With it unset, the
# routing above applies unchanged. Forks and bots reach neither self-hosted label.
#
# Read-only token: nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  knovas-platform:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      # The DSN, port, user, password and database name match what
      # tests/conftest.py already expects (PLATFORM_DB_TEST_DSN). The
      # platform_db fixture migrates its own per-test schema, so no separate
      # migration step is needed here.
      platform-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: knovas_platform_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U platform -d knovas_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: KnovasPlatform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # One knovas-extract for both images and both test jobs: the check fails
      # when the two Dockerfiles' ARG defaults differ and hands the pin
      # (KNOVAS_EXTRACT_VERSION, KNOVAS_EXTRACT_GIT_REF) to the next steps.
      # Its own test runs first.
      - name: knovas-extract pin
        working-directory: .
        run: |
          bash scripts/ci/test_check_knovas_extract_pin.sh
          bash scripts/ci/check_knovas_extract_pin.sh >> "$GITHUB_ENV"

      - name: Install dependencies
        # The pinned knovas-extract first, with the Platform image's extras:
        # the floor in requirements.txt (>=0.4.0a1) is then satisfied and left
        # alone. The last line fails the job if anything replaced it.
        run: |
          python -m pip install --upgrade pip
          extras="pdf,ocr,docx,msg,html,rtf,markdown,sentences"
          if [ -n "$KNOVAS_EXTRACT_GIT_REF" ]; then
            pip install "knovas-extract[${extras}] @ git+https://github.com/Seifeddini/knovas-extract-python.git@${KNOVAS_EXTRACT_GIT_REF}"
          else
            pip install "knovas-extract[${extras}]==${KNOVAS_EXTRACT_VERSION}"
          fi
          pip install -r components/docbridge_integration/requirements.txt
          python ../scripts/ci/assert_knovas_extract_pin.py

      # brain-runner, the product's mapping runner (V1-G1, V1-G11): the tests of the Brain sync, the Builder's
      # mappings, sources and publish and the sync component import it and skip without it, so CI installs it.
      # From KnowledgeBase at a pinned commit: the repository variable BRAIN_RUNNER_SHA (a full SHA), else
      # 961b2f72b, the KnowledgeBase commit of brain-runner 0.3.2 (tag brain-runner-v0.3.2). The token is the
      # read-only secret KB_READ_TOKEN; it is only in this step's environment and never printed (no set -x; pip redacts it from URLs and GitHub
      # masks it). Without it (a fork's pull request) the step fails and says why: a green run without the
      # runner's tests would be a lie.
      - name: brain-runner (pinned, from KnowledgeBase)
        env:
          KB_READ_TOKEN: ${{ secrets.KB_READ_TOKEN }}
          BRAIN_RUNNER_SHA: ${{ vars.BRAIN_RUNNER_SHA || '961b2f72bd178ce86998070b53caa70363451f06' }}
        run: |
          set -euo pipefail
          if [ -z "${KB_READ_TOKEN:-}" ]; then
            echo "::error title=KB_READ_TOKEN is not set::brain-runner cannot be installed, so its tests cannot run. Set the repository secret KB_READ_TOKEN (a fine-grained token, Contents: read on the KnowledgeBase repository only). A pull request from a fork gets no secrets: push the branch to this repository instead."
            exit 1
          fi
          if ! [[ "$BRAIN_RUNNER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=BRAIN_RUNNER_SHA::BRAIN_RUNNER_SHA must be a full 40-character commit SHA."
            exit 1
          fi
          pip install --no-cache-dir --no-deps "brain-runner @ git+https://x-access-token:${KB_READ_TOKEN}@github.com/Seifeddini/KnowledgeBase.git@${BRAIN_RUNNER_SHA}#subdirectory=scripts/brain_runner"
          python -c "import brain_runner; print('brain-runner', brain_runner.__version__, 'at', '${BRAIN_RUNNER_SHA}')"

      - name: Pytest
        working-directory: KnovasPlatform/components/docbridge_integration
        # The identity and admin suites skip themselves when no database is
        # reachable. Here that must be a failure, not a quietly green run.
        env:
          PLATFORM_DB_REQUIRED: "true"
        run: pytest

      - name: Experiments SDK (Python client)
        # Standard library and pytest only. Also runs the README's CI script
        # (bench/report_to_knovas.py) against a fake Platform.
        run: python -m pytest experiments-sdk/python

      # The mock Knovas API emulates every document-fields server state (off,
      # values, filters, uncalibrated); the Platform and RC contract tests
      # drive it, so its own suite runs here. Working directory: KnovasPlatform.
      - name: Mock Knovas API
        run: pytest mock_knovas_api/tests

      # The per-component stack under KnovasPlatform/ is gone; there is one
      # Compose project at the repo root, so these steps run from there.
      - name: Env expansion contract
        working-directory: .
        run: bash scripts/lib/test_expand_knovas_env.sh

      - name: Multi-stack identity contract
        working-directory: .
        run: bash scripts/lib/test_stack_identity.sh

      - name: Connector extraction settings contract
        working-directory: .
        run: bash scripts/lib/test_rc_extraction_settings.sh

      - name: Upgrade from the Connector's old name
        working-directory: .
        run: bash scripts/lib/test_old_connector_name.sh

      - name: The Connector's old name stays gone
        working-directory: .
        run: bash scripts/ci/check_old_connector_name.sh

      - name: Generate compose inputs
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.fixture
          mkdir -p secrets
          echo ci-not-for-production > secrets/platform_db_password

      - name: Docker compose build
        working-directory: .
        run: |
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture config --quiet
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture build docbridge-web

      - name: The Platform image carries the pinned knovas-extract
        working-directory: .
        run: |
          docker run --rm -i -e KNOVAS_EXTRACT_VERSION -e KNOVAS_EXTRACT_GIT_REF \
            docbridge-web-clientbundle:latest python - < scripts/ci/assert_knovas_extract_pin.py

      - name: No pymupdf-layout (PolyForm-NC) in the Platform image
        # Same gate as the Connector image's: the Platform adds [markdown]
        # (markdownify, selectolax) for the preview, never [pdf-markdown],
        # whose pymupdf4llm pulls pymupdf-layout. A failure blocks the build.
        working-directory: .
        run: |
          if docker run --rm docbridge-web-clientbundle:latest pip show pymupdf-layout >/dev/null 2>&1; then
            echo "pymupdf-layout is installed in the image"; exit 1
          fi
          echo "pymupdf-layout absent"

      # OneDrive/SharePoint: no KNOVAS_DOCUMENTS_PATH, the app secret handed to
      # Knovas Connector alone and never to the internet-facing Platform.
      - name: Compose contract (Microsoft 365 documents)
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.m365.fixture
          docker compose --env-file scripts/lib/fixtures/knovas.env.m365.fixture config --format json > m365-compose.json
          python3 - <<'PY'
          import json
          services = json.load(open("m365-compose.json"))["services"]
          rc, web = services["knovas-connector"]["environment"], services["docbridge-web"]
          assert rc["M365_FOLDER_URL"].startswith("https://contoso.sharepoint.com/"), rc
          assert rc["M365_CLIENT_SECRET"], "Knovas Connector did not get the app secret"
          assert "not-a-real-secret" not in json.dumps(web), "the app secret reached the Platform"
          assert web["environment"]["DOCUMENT_SOURCE"] == "m365"
          PY
          # Neither a share nor a Microsoft 365 folder: compose must refuse,
          # never mount the empty stand-in as if it were the share.
          grep -v '^KNOVAS_DOCUMENTS_PATH=' scripts/lib/fixtures/knovas.env.fixture > no-documents.env
          if docker compose --env-file no-documents.env config --quiet 2>/dev/null; then
            echo "compose started with no document source"; exit 1
          fi

  # Knovas Link's own suite (V1-G11): the one component per site that talks to Knovas. Standard library, its
  # pinned requirements and pytest; no secret, no database, no Docker. Python 3.11 is pinned here (the box's
  # system Python is 3.10, and Link requires 3.11).
  knovas-link:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: KnovasLink
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=7.4,<9"

      - name: Pytest
        run: python -m pytest -q tests

  # The connector kit and its conformance suite (connector protocol v2, draft; BET-2026-11-write-back WB-11): its
  # pinned requirements and pytest; no secret, no database, no Docker. It also checks that its copy of the v2
  # contracts equals Knovas Link's, byte for byte.
  connector-kit:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: KnovasConnectorKit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=7.4,<9"

      - name: Pytest
        run: python -m pytest -q tests

  # The Jira connector (connector protocol v2; FEAT-2026-11-10-write-back J-1, J-2): its tests and the connector kit's
  # conformance suite against an in-process fake Jira. No secret, no network, no real Jira; nothing ships the package.
  jira-connector:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: KnovasConnectorJira
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=7.4,<9"

      - name: Pytest
        run: python -m pytest -q tests

  # The sandbox for user-written Python and Julia evaluators (Experimente).
  # Its isolation is only real in the image with compose's settings, so this
  # job builds the image and runs code in it, not just the unit tests.
  experiments-runner:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: KnovasPlatform/components/experiments_runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Julia harness has its own JSON reader and writer; test it against
      # a real Julia, not only inside the image.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install dependencies
        # The evaluators' toolbox as well, so the numpy tests run.
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt

      - name: Pytest
        env:
          # A missing julia or numpy fails the run instead of skipping tests.
          RUNNER_TESTS_REQUIRE_ALL: "true"
        run: pytest

      # The Julia client of the machine API, with the real HTTP.jl and JSON3.jl,
      # in an environment of its own (the runner's Julia tests never see it).
      - name: Experiments SDK (Julia client)
        working-directory: KnovasPlatform/experiments-sdk/julia
        run: |
          julia --startup-file=no --project=@kx-sdk -e 'using Pkg; Pkg.add(["HTTP", "JSON3"])'
          julia --startup-file=no --project=@kx-sdk test/runtests.jl

      - name: Generate compose inputs
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.fixture
          mkdir -p secrets
          echo ci-not-for-production > secrets/platform_db_password

      - name: Compose config with and without the experiments profile
        working-directory: .
        run: |
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture config --quiet
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments config --quiet

      - name: Build the runner image
        working-directory: .
        run: docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments build experiments-runner

      - name: Smoke test the image
        working-directory: .
        run: |
          docker run --rm knovas-experiments-runner:0.1.0 /opt/venv/bin/python3 -I -c 'import numpy, scipy, pandas, statsmodels'
          # The packages live in /opt/julia-depot; the image sets no depot of its own.
          docker run --rm -e JULIA_DEPOT_PATH=/tmp/depot:/opt/julia-depot: knovas-experiments-runner:0.1.0 \
            julia --startup-file=no -e 'using JSON3, Distributions'
          # One evaluator per language through the real job path, under the
          # container settings compose applies. Fails when the precompiled
          # Julia packages are not reused (every job would compile for minutes).
          docker run --rm --network none --read-only --tmpfs /tmp:size=1g,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 3g \
            knovas-experiments-runner:0.1.0 /opt/venv/bin/python3 -I /app/runner.py --self-test

      - name: Start with the profile and reach it over the socket
        working-directory: .
        run: |
          DC=(docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments)
          "${DC[@]}" up -d experiments-runner
          healthy=false
          for _ in $(seq 1 30); do
            if "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I /app/runner.py --healthcheck; then
              healthy=true; break
            fi
            sleep 2
          done
          "${DC[@]}" logs experiments-runner
          [[ "$healthy" == true ]]
          # No network interface but loopback, not root, read-only root. The
          # uid is the runner's own (10101), shared with no other image: the
          # per-job process limit counts every process of a uid on the host.
          "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I -c \
            "import os, sys; names = [l.split(':')[0].strip() for l in open('/proc/net/dev').read().splitlines()[2:]]; print(names, os.getuid()); sys.exit(names != ['lo'] or os.getuid() != 10101)"
          if "${DC[@]}" exec -T experiments-runner touch /app/written; then
            echo "the root filesystem is writable"; exit 1
          fi
          # As docbridge-web does: root, the socket volume mounted read-only.
          VOL="$(docker volume ls -q --filter name=experiments_runner_socket | head -1)"
          docker run --rm --user 0 -v "$VOL:/run/experiments-runner:ro" knovas-experiments-runner:0.1.0 \
            /opt/venv/bin/python3 -I /app/runner.py --healthcheck
          # Jobs share the runner's uid and can put a directory where the
          # socket belongs; the watchdog then makes the container restart.
          # While another container keeps the volume mounted (docbridge-web
          # always does), the entry survives that restart, so the runner has
          # to clear its socket directory at start or it never listens again.
          docker run -d --name keep-socket-volume -v "$VOL:/run/experiments-runner:ro" \
            knovas-experiments-runner:0.1.0 sleep 600
          "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I -c \
            "import os; p = '/run/experiments-runner/runner.sock'; os.unlink(p); os.mkdir(p); open(os.path.join(p, 'x'), 'w').close()"
          sleep 2
          healthy=false
          for _ in $(seq 1 30); do
            if "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I /app/runner.py --healthcheck; then
              healthy=true; break
            fi
            sleep 2
          done
          "${DC[@]}" logs --tail 20 experiments-runner
          docker rm -f keep-socket-volume
          [[ "$healthy" == true ]]
          # grep without -q reads to the end: no SIGPIPE for logs under pipefail.
          "${DC[@]}" logs experiments-runner 2>&1 | grep "Emptied the socket directory"
          "${DC[@]}" down -v

  knovas-connector:
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && vars.CI_EPHEMERAL_RUNNER && fromJSON('["self-hosted","knovas-ci-ephemeral"]') || (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type != 'Bot')) && vars.CI_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: KnovasConnector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The pin both images install (scripts/ci/check_knovas_extract_pin.sh
      # fails when the two Dockerfiles disagree): the tests run against
      # exactly the extractor the images ship.
      - name: knovas-extract pin
        working-directory: .
        run: bash scripts/ci/check_knovas_extract_pin.sh >> "$GITHUB_ENV"

      - name: Install Tesseract (OCR tests run against the real engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
          tesseract --version | head -1

      - name: Install dependencies
        # Der Korpusgenerator unter scripts/demo_kanzlei/ ist ein Werkzeug und
        # steht nicht in den Paketabhaengigkeiten -- seine Tests sammelt pytest
        # aber mit ein. Ohne diese Zeile fehlt msgforge, das Einsammeln
        # scheitert, und ein Sammelfehler bricht den GANZEN Lauf ab: seit
        # Einfuehrung des Generators lief kein einziger Knovas-Connector-Test
        # mehr durch.
        #
        # knovas-extract comes first: exactly the pin of the previous step,
        # with the Connector image's extras. `pip install -e` then finds it
        # satisfying the floor in pyproject.toml (>=0.4.0a1) and leaves it in
        # place. The last line fails the job if anything replaced it.
        run: |
          extras="pdf,ocr,docx,msg,html,rtf,sentences"
          if [ -n "$KNOVAS_EXTRACT_GIT_REF" ]; then
            pip install "knovas-extract[${extras}] @ git+https://github.com/Seifeddini/knovas-extract-python.git@${KNOVAS_EXTRACT_GIT_REF}"
          else
            pip install "knovas-extract[${extras}]==${KNOVAS_EXTRACT_VERSION}"
          fi
          pip install -e ".[dev]"
          pip install -r scripts/demo_kanzlei/requirements.txt
          python ../scripts/ci/assert_knovas_extract_pin.py

      - name: Run pytest
        env:
          # Fehlt hier ein Generatorpaket, sollen die Tests NICHT still
          # uebersprungen werden -- wie PLATFORM_DB_REQUIRED in der Plattform.
          DEMO_CORPUS_REQUIRED: "true"
          RC_SKIP_CONFIG_VALIDATION: "true"
          TESTING: "true"
          RC_RATE_LIMIT_ENABLED: "true"
          RC_MTLS_DEV_BYPASS: "true"
          RC_MTLS_DEV_EMPLOYEE_ID: "11111111-1111-1111-1111-111111111111"
          KNOVAS_INTERNAL_API_URL: http://internal-api:5000
          RC_INSTANCE_TOKEN: test-token
          RC_CLIENT_ID: "22222222-2222-2222-2222-222222222222"
          RC_WATCH_ROOTS: /tmp
          SEMANTIX_SECURE_BASE_URL: https://knovas:8443
          SEMANTIX_CLIENT_CERT_PATH: /certs/client.pem
          SEMANTIX_CLIENT_KEY_PATH: /certs/client.key
          SEMANTIX_CA_CERT_PATH: /certs/ca.pem
          # Outside the checkout: the default (.rc-sync-state.json beside the
          # tracked .rc-sync-state.db) lets a test rewrite a committed file.
          RC_SYNC_STATE_PATH: ${{ runner.temp }}/rc-state/.rc-sync-state.json
        run: |
          mkdir -p "$(dirname "$RC_SYNC_STATE_PATH")"
          pytest
          git diff --exit-code -- .rc-sync-state.db

      - name: Validate contract schemas
        run: |
          pip install jsonschema
          python -c "import json, pathlib; from jsonschema import Draft202012Validator; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in pathlib.Path('contracts').glob('*.json')]"

      - name: Build image
        run: docker build -t knovas-connector:ci .

      - name: Image carries Tesseract models and the OMP/TESSDATA env (GI-EXTRACT-05)
        run: |
          docker run --rm knovas-connector:ci sh -c '
            test "$OMP_THREAD_LIMIT" = "1" || { echo "OMP_THREAD_LIMIT is not 1"; exit 1; }
            test -d "$TESSDATA_PREFIX" || { echo "TESSDATA_PREFIX $TESSDATA_PREFIX missing"; exit 1; }
            for lang in deu eng fra ita; do
              test -f "$TESSDATA_PREFIX/$lang.traineddata" || { echo "$lang.traineddata missing"; exit 1; }
            done
            tesseract --list-langs 2>&1 | tail -n +2 | sort | tr "\n" " "; echo'
          # The [ocr] extra: OCR runs in-process through tesserocr, not the CLI.
          docker run --rm knovas-connector:ci python -c "from knovas_extract._ocr.backend import select_backend; name = select_backend('auto').name; print('OCR engine', name); assert name == 'tesserocr', name"

      - name: The Connector image carries the pinned knovas-extract
        run: |
          docker run --rm -i -e KNOVAS_EXTRACT_VERSION -e KNOVAS_EXTRACT_GIT_REF \
            knovas-connector:ci python - < ../scripts/ci/assert_knovas_extract_pin.py

      - name: No pymupdf-layout (PolyForm-NC) in the Connector image
        # Gates the build (plan M0, [C-reg-9]): both images install the pin of
        # scripts/ci/check_knovas_extract_pin.sh, knovas-extract 0.4.0a1, whose
        # [pdf] extra is pymupdf alone; pymupdf4llm, which pulls
        # pymupdf-layout, is in the separate [pdf-markdown] extra that neither
        # image installs. A bump or an extra that drags it back in fails here.
        run: |
          if docker run --rm knovas-connector:ci pip show pymupdf-layout >/dev/null 2>&1; then
            echo "pymupdf-layout is installed in the image"; exit 1
          fi
          echo "pymupdf-layout absent"

      - name: Boot with valid env and probe health
        run: |
          mkdir -p /tmp/rc-watch
          touch /tmp/rc-watch/.keep
          cat > ci.env <<'EOF'
          KNOVAS_INTERNAL_API_URL=http://internal-api:5000
          RC_INSTANCE_TOKEN=test-token
          RC_CLIENT_ID=22222222-2222-2222-2222-222222222222
          RC_WATCH_ROOTS=/data
          SEMANTIX_SECURE_BASE_URL=https://knovas:8443
          SEMANTIX_CLIENT_CERT_PATH=/certs/client.pem
          SEMANTIX_CLIENT_KEY_PATH=/certs/client.key
          SEMANTIX_CA_CERT_PATH=/certs/ca.pem
          EOF
          docker run -d --name rc-ci --env-file ci.env \
            -v /tmp/rc-watch:/data:ro \
            knovas-connector:ci
          sleep 3
          docker exec rc-ci python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5001/health'); assert r.status==200, r.status"
          # E6: PID 1 is gunicorn itself (shell-form CMD with exec), one
          # gthread worker with four threads, the default 120 s timeout.
          pid1="$(docker exec rc-ci sh -c 'tr "\0" " " < /proc/1/cmdline')"
          echo "PID 1: $pid1"
          case "$pid1" in
            *gunicorn*"-w 1 -k gthread --threads 4 --timeout 120 "*) ;;
            *) echo "the image does not run the gthread gunicorn as PID 1"; exit 1 ;;
          esac
          docker stop rc-ci
