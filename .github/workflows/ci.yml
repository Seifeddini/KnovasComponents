name: CI

on:
  push:
    branches: [main, master]
  # Deliberately unfiltered: this work lands through stacked pull requests
  # whose base is another feature branch, and a base filter meant those PRs
  # carried no checks at all. Every pull request is built, whatever it targets.
  pull_request:

jobs:
  knovas-platform:
    runs-on: ubuntu-latest
    services:
      # The DSN, port, user, password and database name match what
      # tests/conftest.py already expects (PLATFORM_DB_TEST_DSN). The
      # platform_db fixture migrates its own per-test schema, so no separate
      # migration step is needed here.
      platform-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: knovas_platform_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U platform -d knovas_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: KnovasPlatform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r components/docbridge_integration/requirements.txt

      - name: Pytest
        working-directory: KnovasPlatform/components/docbridge_integration
        # The identity and admin suites skip themselves when no database is
        # reachable. Here that must be a failure, not a quietly green run.
        env:
          PLATFORM_DB_REQUIRED: "true"
        run: pytest

      - name: Experiments SDK (Python client)
        # Standard library and pytest only. Also runs the README's CI script
        # (bench/report_to_knovas.py) against a fake Platform.
        run: python -m pytest experiments-sdk/python

      # The mock Knovas API emulates every document-fields server state (off,
      # values, filters, uncalibrated); the Platform and RC contract tests
      # drive it, so its own suite runs here. Working directory: KnovasPlatform.
      - name: Mock Knovas API
        run: pytest mock_knovas_api/tests

      # The per-component stack under KnovasPlatform/ is gone; there is one
      # Compose project at the repo root, so these steps run from there.
      - name: Env expansion contract
        working-directory: .
        run: bash scripts/lib/test_expand_knovas_env.sh

      - name: Multi-stack identity contract
        working-directory: .
        run: bash scripts/lib/test_stack_identity.sh

      - name: Connector extraction settings contract
        working-directory: .
        run: bash scripts/lib/test_rc_extraction_settings.sh

      - name: Generate compose inputs
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.fixture
          mkdir -p secrets
          echo ci-not-for-production > secrets/platform_db_password

      - name: Docker compose build
        working-directory: .
        run: |
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture config --quiet
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture build docbridge-web

      # OneDrive/SharePoint: no KNOVAS_DOCUMENTS_PATH, the app secret handed to
      # RemoteController alone and never to the internet-facing Platform.
      - name: Compose contract (Microsoft 365 documents)
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.m365.fixture
          docker compose --env-file scripts/lib/fixtures/knovas.env.m365.fixture config --format json > m365-compose.json
          python3 - <<'PY'
          import json
          services = json.load(open("m365-compose.json"))["services"]
          rc, web = services["remote-controller"]["environment"], services["docbridge-web"]
          assert rc["M365_FOLDER_URL"].startswith("https://contoso.sharepoint.com/"), rc
          assert rc["M365_CLIENT_SECRET"], "RemoteController did not get the app secret"
          assert "not-a-real-secret" not in json.dumps(web), "the app secret reached the Platform"
          assert web["environment"]["DOCUMENT_SOURCE"] == "m365"
          PY
          # Neither a share nor a Microsoft 365 folder: compose must refuse,
          # never mount the empty stand-in as if it were the share.
          grep -v '^KNOVAS_DOCUMENTS_PATH=' scripts/lib/fixtures/knovas.env.fixture > no-documents.env
          if docker compose --env-file no-documents.env config --quiet 2>/dev/null; then
            echo "compose started with no document source"; exit 1
          fi

  # The sandbox for user-written Python and Julia evaluators (Experimente).
  # Its isolation is only real in the image with compose's settings, so this
  # job builds the image and runs code in it, not just the unit tests.
  experiments-runner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KnovasPlatform/components/experiments_runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The Julia harness has its own JSON reader and writer; test it against
      # a real Julia, not only inside the image.
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"

      - name: Install dependencies
        # The evaluators' toolbox as well, so the numpy tests run.
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r requirements.txt

      - name: Pytest
        env:
          # A missing julia or numpy fails the run instead of skipping tests.
          RUNNER_TESTS_REQUIRE_ALL: "true"
        run: pytest

      # The Julia client of the machine API, with the real HTTP.jl and JSON3.jl,
      # in an environment of its own (the runner's Julia tests never see it).
      - name: Experiments SDK (Julia client)
        working-directory: KnovasPlatform/experiments-sdk/julia
        run: |
          julia --startup-file=no --project=@kx-sdk -e 'using Pkg; Pkg.add(["HTTP", "JSON3"])'
          julia --startup-file=no --project=@kx-sdk test/runtests.jl

      - name: Generate compose inputs
        working-directory: .
        run: |
          bash scripts/lib/expand_knovas_env.sh scripts/lib/fixtures/knovas.env.fixture
          mkdir -p secrets
          echo ci-not-for-production > secrets/platform_db_password

      - name: Compose config with and without the experiments profile
        working-directory: .
        run: |
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture config --quiet
          docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments config --quiet

      - name: Build the runner image
        working-directory: .
        run: docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments build experiments-runner

      - name: Smoke test the image
        working-directory: .
        run: |
          docker run --rm knovas-experiments-runner:0.1.0 /opt/venv/bin/python3 -I -c 'import numpy, scipy, pandas, statsmodels'
          # The packages live in /opt/julia-depot; the image sets no depot of its own.
          docker run --rm -e JULIA_DEPOT_PATH=/tmp/depot:/opt/julia-depot: knovas-experiments-runner:0.1.0 \
            julia --startup-file=no -e 'using JSON3, Distributions'
          # One evaluator per language through the real job path, under the
          # container settings compose applies. Fails when the precompiled
          # Julia packages are not reused (every job would compile for minutes).
          docker run --rm --network none --read-only --tmpfs /tmp:size=1g,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 256 --memory 3g \
            knovas-experiments-runner:0.1.0 /opt/venv/bin/python3 -I /app/runner.py --self-test

      - name: Start with the profile and reach it over the socket
        working-directory: .
        run: |
          DC=(docker compose --env-file scripts/lib/fixtures/knovas.env.fixture --profile experiments)
          "${DC[@]}" up -d experiments-runner
          healthy=false
          for _ in $(seq 1 30); do
            if "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I /app/runner.py --healthcheck; then
              healthy=true; break
            fi
            sleep 2
          done
          "${DC[@]}" logs experiments-runner
          [[ "$healthy" == true ]]
          # No network interface but loopback, not root, read-only root. The
          # uid is the runner's own (10101), shared with no other image: the
          # per-job process limit counts every process of a uid on the host.
          "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I -c \
            "import os, sys; names = [l.split(':')[0].strip() for l in open('/proc/net/dev').read().splitlines()[2:]]; print(names, os.getuid()); sys.exit(names != ['lo'] or os.getuid() != 10101)"
          if "${DC[@]}" exec -T experiments-runner touch /app/written; then
            echo "the root filesystem is writable"; exit 1
          fi
          # As docbridge-web does: root, the socket volume mounted read-only.
          VOL="$(docker volume ls -q --filter name=experiments_runner_socket | head -1)"
          docker run --rm --user 0 -v "$VOL:/run/experiments-runner:ro" knovas-experiments-runner:0.1.0 \
            /opt/venv/bin/python3 -I /app/runner.py --healthcheck
          # Jobs share the runner's uid and can put a directory where the
          # socket belongs; the watchdog then makes the container restart.
          # While another container keeps the volume mounted (docbridge-web
          # always does), the entry survives that restart, so the runner has
          # to clear its socket directory at start or it never listens again.
          docker run -d --name keep-socket-volume -v "$VOL:/run/experiments-runner:ro" \
            knovas-experiments-runner:0.1.0 sleep 600
          "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I -c \
            "import os; p = '/run/experiments-runner/runner.sock'; os.unlink(p); os.mkdir(p); open(os.path.join(p, 'x'), 'w').close()"
          sleep 2
          healthy=false
          for _ in $(seq 1 30); do
            if "${DC[@]}" exec -T experiments-runner /opt/venv/bin/python3 -I /app/runner.py --healthcheck; then
              healthy=true; break
            fi
            sleep 2
          done
          "${DC[@]}" logs --tail 20 experiments-runner
          docker rm -f keep-socket-volume
          [[ "$healthy" == true ]]
          # grep without -q reads to the end: no SIGPIPE for logs under pipefail.
          "${DC[@]}" logs experiments-runner 2>&1 | grep "Emptied the socket directory"
          "${DC[@]}" down -v

  remote-controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RemoteController
    env:
      # The knovas-extract revision the tests run against. It must be the
      # RemoteController/Dockerfile default (ARG KNOVAS_EXTRACT_REF), so the
      # image ships the extractor CI tested; the install step fails when the
      # two differ. PyPI's knovas-extract 0.2 lacks the 0.4 `Limits` the OCR
      # budgets are sent through, which is what turned main red.
      KNOVAS_EXTRACT_SHA: 11ec1c38053cbbc914207c9e2f24636cde709617
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract (OCR tests run against the real engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu
          tesseract --version | head -1

      - name: Install dependencies
        # Der Korpusgenerator unter scripts/demo_kanzlei/ ist ein Werkzeug und
        # steht nicht in den Paketabhaengigkeiten -- seine Tests sammelt pytest
        # aber mit ein. Ohne diese Zeile fehlt msgforge, das Einsammeln
        # scheitert, und ein Sammelfehler bricht den GANZEN Lauf ab: seit
        # Einfuehrung des Generators lief kein einziger RemoteController-Test
        # mehr durch.
        #
        # knovas-extract comes first, from the pinned sha with the extras of
        # pyproject.toml: `pip install -e` then finds it satisfying
        # `knovas-extract>=0.2` and leaves it in place instead of pulling 0.2
        # from PyPI. The last line fails the job if anything replaced it.
        run: |
          grep -qx "ARG KNOVAS_EXTRACT_REF=${KNOVAS_EXTRACT_SHA}" Dockerfile \
            || { echo "Dockerfile KNOVAS_EXTRACT_REF is not ${KNOVAS_EXTRACT_SHA}"; exit 1; }
          pip install "knovas-extract[pdf,docx,msg,html,sentences] @ git+https://github.com/Seifeddini/knovas-extract-python.git@${KNOVAS_EXTRACT_SHA}"
          pip install -e ".[dev]"
          pip install -r scripts/demo_kanzlei/requirements.txt
          python -c "import json, os; from importlib.metadata import distribution; d = distribution('knovas-extract'); u = json.loads(d.read_text('direct_url.json') or '{}'); sha = u.get('vcs_info', {}).get('commit_id'); assert sha == os.environ['KNOVAS_EXTRACT_SHA'], (d.version, sha); print('knovas-extract', d.version, sha)"

      - name: Run pytest
        env:
          # Fehlt hier ein Generatorpaket, sollen die Tests NICHT still
          # uebersprungen werden -- wie PLATFORM_DB_REQUIRED in der Plattform.
          DEMO_CORPUS_REQUIRED: "true"
          RC_SKIP_CONFIG_VALIDATION: "true"
          TESTING: "true"
          RC_RATE_LIMIT_ENABLED: "true"
          RC_MTLS_DEV_BYPASS: "true"
          RC_MTLS_DEV_EMPLOYEE_ID: "11111111-1111-1111-1111-111111111111"
          KNOVAS_INTERNAL_API_URL: http://internal-api:5000
          RC_INSTANCE_TOKEN: test-token
          RC_CLIENT_ID: "22222222-2222-2222-2222-222222222222"
          RC_WATCH_ROOTS: /tmp
          SEMANTIX_SECURE_BASE_URL: https://knovas:8443
          SEMANTIX_CLIENT_CERT_PATH: /certs/client.pem
          SEMANTIX_CLIENT_KEY_PATH: /certs/client.key
          SEMANTIX_CA_CERT_PATH: /certs/ca.pem
          # Outside the checkout: the default (.rc-sync-state.json beside the
          # tracked .rc-sync-state.db) lets a test rewrite a committed file.
          RC_SYNC_STATE_PATH: ${{ runner.temp }}/rc-state/.rc-sync-state.json
        run: |
          mkdir -p "$(dirname "$RC_SYNC_STATE_PATH")"
          pytest
          git diff --exit-code -- .rc-sync-state.db

      - name: Validate contract schemas
        run: |
          pip install jsonschema
          python -c "import json, pathlib; from jsonschema import Draft202012Validator; [Draft202012Validator.check_schema(json.loads(p.read_text())) for p in pathlib.Path('contracts').glob('*.json')]"

      - name: Build image
        run: docker build -t remote-controller:ci .

      - name: Image carries Tesseract models and the OMP/TESSDATA env (GI-EXTRACT-05)
        run: |
          docker run --rm remote-controller:ci sh -c '
            test "$OMP_THREAD_LIMIT" = "1" || { echo "OMP_THREAD_LIMIT is not 1"; exit 1; }
            test -d "$TESSDATA_PREFIX" || { echo "TESSDATA_PREFIX $TESSDATA_PREFIX missing"; exit 1; }
            for lang in deu eng fra ita; do
              test -f "$TESSDATA_PREFIX/$lang.traineddata" || { echo "$lang.traineddata missing"; exit 1; }
            done
            tesseract --list-langs 2>&1 | tail -n +2 | sort | tr "\n" " "; echo'

      - name: No pymupdf-layout (PolyForm-NC) in the customer image
        # Gates the build (plan M0, [C-reg-9]): KNOVAS_EXTRACT_REF is pinned to
        # knovas-extract 0.4.0a1, whose [pdf] extra is pymupdf alone
        # (pymupdf4llm moved to the separate `pdf-markdown` extra). A later
        # bump or extra that drags pymupdf-layout back in fails here.
        run: |
          if docker run --rm remote-controller:ci pip show pymupdf-layout >/dev/null 2>&1; then
            echo "pymupdf-layout is installed in the image"; exit 1
          fi
          echo "pymupdf-layout absent"

      - name: Boot with valid env and probe health
        run: |
          mkdir -p /tmp/rc-watch
          touch /tmp/rc-watch/.keep
          cat > ci.env <<'EOF'
          KNOVAS_INTERNAL_API_URL=http://internal-api:5000
          RC_INSTANCE_TOKEN=test-token
          RC_CLIENT_ID=22222222-2222-2222-2222-222222222222
          RC_WATCH_ROOTS=/data
          SEMANTIX_SECURE_BASE_URL=https://knovas:8443
          SEMANTIX_CLIENT_CERT_PATH=/certs/client.pem
          SEMANTIX_CLIENT_KEY_PATH=/certs/client.key
          SEMANTIX_CA_CERT_PATH=/certs/ca.pem
          EOF
          docker run -d --name rc-ci --env-file ci.env \
            -v /tmp/rc-watch:/data:ro \
            remote-controller:ci
          sleep 3
          docker exec rc-ci python -c "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:5001/health'); assert r.status==200, r.status"
          docker stop rc-ci
