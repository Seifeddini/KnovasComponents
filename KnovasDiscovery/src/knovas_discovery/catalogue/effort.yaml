# How the effort of a custom source (class C) is counted. Discovery sizes the work and says nothing about cost.
# Change a number here and every report changes with it.

version: 1

# Effort classes, from the points the scan counts (docs/design.md, "Effort of a custom source").
effort_classes:
  S: {max_points: 8}
  M: {max_points: 16}
  L: {max_points: 26}
  XL: {max_points: null}

# Points per driver.
effort_points:
  record_tables: {each: 1, max: 12}
  foreign_keys: {none: 3}
  change_markers: {all: 0, some: 2, none: 5}
  removed_rows: {present: 3}
  rights_in_source: {present: 5}
  custom_fields: {present: 2}
  unknown_product: {present: 5}
  volume: {over_one_million_rows: 2}
  authentication: {windows_only: 2}
