# What each class costs. The founders set the numbers; an agent never does.
# While a value is null the tool prints "price not set" and the plan shows the effort class only.

version: 1
currency: CHF
set_by: null          # who set the prices
set_on: null          # when

classes:
  A:
    basis: "part of onboarding"
    chf: null
  B:
    basis: "fixed package per source"
    chf: null
  C:
    basis: "individual offer by effort class"
    S: null
    M: null
    L: null
    XL: null
  D:
    basis: "not offered"

# Effort classes of a custom source, from the points the scan counts (docs/design.md, "Effort of a custom source").
effort_classes:
  S: {max_points: 8}
  M: {max_points: 16}
  L: {max_points: 26}
  XL: {max_points: null}

# Points per driver. Change a number here and every report changes with it.
effort_points:
  record_tables: {each: 1, max: 12}
  foreign_keys: {none: 3}
  change_markers: {all: 0, some: 2, none: 5}
  removed_rows: {present: 3}
  rights_in_source: {present: 5}
  custom_fields: {present: 2}
  unknown_product: {present: 5}
  volume: {over_one_million_rows: 2}
  authentication: {windows_only: 2}
