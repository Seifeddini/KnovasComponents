[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knovas-link"
version = "1.1.0"
description = "Knovas Link: the one component per site that talks to Knovas (connector protocol 1.1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<1",
    "httpx>=0.28,<0.29",
    "jsonschema>=4.26,<5",
    "cryptography>=42,<50",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]
